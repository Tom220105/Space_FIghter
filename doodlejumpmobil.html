<script>
  // Fehler sichtbar machen - auf dem Telefon gibt es keine Konsole
  const errBox = document.getElementById("err");
  function showErr(msg) {
    errBox.style.display = "block";
    errBox.textContent += msg + "\n";
  }
  window.addEventListener("error", e =>
    showErr(`${e.message}\n${e.filename}:${e.lineno}`));
  window.addEventListener("unhandledrejection", e => showErr("Promise: " + e.reason));
</script>

// Doodle Jump ins Weltall - mobile Fassung.
// Portierung von doodle_jump.py; Zahlen und Skins kommen unveraendert aus
// data.js, die Spiellogik ist Schritt fuer Schritt uebernommen. Gezeichnet
// wird direkt auf ein Canvas statt auf ein Tk-Canvas, gesteuert wird per
// Finger (ziehen = lenken, tippen = schiessen) oder Neigung.


const SKIN_BY_KEY = Object.fromEntries(SKINS.map(s => [s.key, s]));
const POOLS = {};
for (const r of ["common", "rare", "epic", "legendary", "mythic"]) {
  POOLS[r] = SKINS.filter(s => s.rarity === r).map(s => s.key);
}
const DEFAULT_SKIN = "klassiker";
const SAVE_KEY = "doodlejump.save.v1";
const FRAME_TIME = 1 / K.FPS;
const TAU = Math.PI * 2;

// ------------------------------------------------------------- Hilfsmittel

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const rnd = (a = 1, b = 0) => b + Math.random() * (a - b);
const rndInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const choice = arr => arr[Math.floor(Math.random() * arr.length)];

function mix(c1, c2, t) {
  t = clamp(t, 0, 1);
  const a = [1, 3, 5].map(i => parseInt(c1.substr(i, 2), 16));
  const b = [1, 3, 5].map(i => parseInt(c2.substr(i, 2), 16));
  return "#" + [0, 1, 2].map(i => {
    const v = Math.round(a[i] + (b[i] - a[i]) * t);
    return v.toString(16).padStart(2, "0");
  }).join("");
}

function hsvHex(h, sat = 1, val = 1) {
  h = ((h % 1) + 1) % 1 * 6;
  const i = Math.floor(h), f = h - i;
  const p = val * (1 - sat), q = val * (1 - sat * f), t = val * (1 - sat * (1 - f));
  const [r, g, b] = [[val, t, p], [q, val, p], [p, val, t],
                     [p, q, val], [t, p, val], [val, p, q]][i % 6];
  return "#" + [r, g, b].map(v =>
    Math.round(v * 255).toString(16).padStart(2, "0")).join("");
}

// Stipple-Muster von Tk als Deckkraft nachbilden
const STIP = { gray12: 0.14, gray25: 0.26, gray50: 0.5, gray75: 0.75 };

function starCost(n) { return K.STAR_STEP * n; }
function starTotal(n) { return K.STAR_STEP * n * (n + 1) / 2; }

// Ruesselkontur, um `look` nach oben geschwenkt (wie snout_points in Python)
function snoutPoints(look) {
  const a = -K.SNOUT_AIM * look * Math.PI / 180;
  const ca = Math.cos(a), sa = Math.sin(a), lift = K.SNOUT_LIFT * look;
  const [ax, ay] = K.SNOUT_PIVOT;
  const pts = [...K.SNOUT_SHAPE, K.SNOUT_NOSTRIL].map(([dx, dy]) => {
    const rx = dx - ax, ry = dy - ay;
    return [ax + rx * ca - ry * sa, ay + rx * sa + ry * ca - lift];
  });
  return { pts: pts.slice(0, -1), tip: pts[K.SNOUT_TIP_I], nostril: pts[pts.length - 1] };
}

// Gluecksrad: viele kleine Felder, gleichmaessig verteilt (build_slices)
function buildSlices() {
  const counts = K.WHEEL.map(w => K.SLICE_COUNTS[w[0]]);
  const total = counts.reduce((a, b) => a + b, 0);
  const placed = counts.map(() => 0);
  const order = [];
  for (let step = 0; step < total; step++) {
    let best = 0, bestv = -1e9;
    for (let i = 0; i < counts.length; i++) {
      const v = counts[i] * (step + 1) / total - placed[i];
      if (v > bestv) { bestv = v; best = i; }
    }
    order.push(best); placed[best]++;
  }
  const out = []; let cum = 0;
  for (const i of order) {
    const w = K.WHEEL[i][1] / counts[i];
    out.push([i, cum, w]); cum += w;
  }
  return out;
}
const WHEEL_SLICES = buildSlices();

// ------------------------------------------------------ Zeichen-Schicht
// Bildet die im Python benutzten Tk-Aufrufe auf das Canvas ab.

class Draw {
  constructor(ctx) { this.c = ctx; }

  _fill(o) {
    const c = this.c;
    const al = o.stipple ? STIP[o.stipple] : 1;
    if (o.fill) {
      c.globalAlpha = al; c.fillStyle = o.fill; c.fill(); c.globalAlpha = 1;
    }
    if (o.outline) {
      c.strokeStyle = o.outline; c.lineWidth = o.width ?? 1; c.stroke();
    }
  }
  ov(x0, y0, x1, y1, o = {}) {
    const c = this.c;
    c.beginPath();
    c.ellipse((x0 + x1) / 2, (y0 + y1) / 2, Math.abs(x1 - x0) / 2,
              Math.abs(y1 - y0) / 2, 0, 0, TAU);
    this._fill(o);
  }
  rc(x0, y0, x1, y1, o = {}) {
    const c = this.c;
    c.beginPath();
    c.rect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
    this._fill(o);
  }
  pg(pts, o = {}) {
    const c = this.c;
    c.beginPath();
    c.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
    c.closePath();
    this._fill(o);
  }
  ln(pts, o = {}) {
    const c = this.c;
    c.beginPath();
    c.lineJoin = o.round ? "round" : "miter";
    c.lineCap = o.round ? "round" : "butt";
    if (o.smooth && pts.length >= 6) {           // weiche Kurve wie Tk smooth
      c.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length - 2; i += 2) {
        c.quadraticCurveTo(pts[i], pts[i + 1],
                           (pts[i] + pts[i + 2]) / 2, (pts[i + 1] + pts[i + 3]) / 2);
      }
      c.lineTo(pts[pts.length - 2], pts[pts.length - 1]);
    } else {
      c.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
    }
    c.globalAlpha = o.stipple ? STIP[o.stipple] : 1;
    c.strokeStyle = o.fill || "#000"; c.lineWidth = o.width ?? 1; c.stroke();
    c.globalAlpha = 1;
    c.lineJoin = "miter"; c.lineCap = "butt";
  }
  // Tk-Winkel: Grad gegen den Uhrzeigersinn ab 3 Uhr, y nach oben
  arc(x0, y0, x1, y1, start, extent, o = {}) {
    const c = this.c;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const rx = Math.abs(x1 - x0) / 2, ry = Math.abs(y1 - y0) / 2;
    const a0 = -start * Math.PI / 180, a1 = -(start + extent) * Math.PI / 180;
    c.beginPath();
    if (o.style === "pieslice") c.moveTo(cx, cy);
    c.ellipse(cx, cy, rx, ry, 0, a0, a1, extent > 0);
    if (o.style === "pieslice") c.closePath();
    if (o.style === "arc") {
      c.globalAlpha = o.stipple ? STIP[o.stipple] : 1;
      c.strokeStyle = o.outline || "#000"; c.lineWidth = o.width ?? 1; c.stroke();
      c.globalAlpha = 1;
    } else this._fill(o);
  }
  tx(x, y, text, o = {}) {
    const c = this.c;
    const size = o.size ?? 12;
    c.font = `${o.bold === false ? "" : "bold "}${size}px -apple-system, Helvetica, Arial, sans-serif`;
    c.textAlign = o.anchor === "w" ? "left" : o.anchor === "e" ? "right" : "center";
    c.textBaseline = "middle";
    c.fillStyle = o.fill || "#fff";
    const lines = String(text).split("\n");
    lines.forEach((ln, i) => {
      c.fillText(ln, x, y + (i - (lines.length - 1) / 2) * size * 1.25);
    });
  }
}

// --------------------------------------------------------------- Objekte

class Platform {
  constructor(x, y, kind = "normal", springChance = K.SPRING_CHANCE) {
    this.x = x; this.y = y; this.kind = kind;
    this.dx = kind === "moving" ? choice([-1.7, 1.7]) : 0;
    this.spring = (kind === "normal" || kind === "moving") && Math.random() < springChance;
    this.broken = false; this.used = false; this.vy = 0;
  }
  get alive() { return !this.used && this.y < K.HEIGHT + 80; }
  update() {
    if (this.kind === "moving") {
      this.x += this.dx;
      if (this.x <= 0) { this.x = 0; this.dx = Math.abs(this.dx); }
      else if (this.x + K.PLAT_W >= K.WIDTH) {
        this.x = K.WIDTH - K.PLAT_W; this.dx = -Math.abs(this.dx);
      }
    }
    if (this.broken) {
      this.vy += K.GRAVITY * 1.6; this.y += this.vy;
      if (this.y > K.HEIGHT + 60) this.used = true;
    }
  }
}

const ITEM_SIZES = { rocket: [K.ROCKET_W, K.ROCKET_H], shield: [30, 32], hole: [34, 34] };

class Item {
  constructor(plat, kind = "rocket") {
    this.plat = plat; this.kind = kind;
    [this.w, this.h] = ITEM_SIZES[kind];
    this.offx = K.PLAT_W / 2 - this.w / 2;
    this.phase = rnd(TAU); this.taken = false;
    this.x = plat.x + this.offx; this.y = plat.y - this.h - 4;
  }
  get alive() { return !this.taken && this.plat.alive && !this.plat.broken; }
  update() {
    this.phase += 0.11;
    this.x = this.plat.x + this.offx;
    this.y = this.plat.y - this.h - 6 + Math.sin(this.phase) * 3.5;
  }
}

class Monster {
  constructor(x, y) {
    this.w = 48; this.h = 40; this.x = x; this.y = y;
    this.dx = choice([-1.4, 1.4]); this.dead = false;
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  update() {
    this.x += this.dx;
    if (this.x <= 0 || this.x + this.w >= K.WIDTH) {
      this.dx = -this.dx;
      this.x = clamp(this.x, 0, K.WIDTH - this.w);
    }
  }
}

class Bullet {
  constructor(x, y) { this.x = x; this.y = y; }
  update() { this.y -= K.BULLET_SPEED; }
}

class Ring {
  constructor(x, y, rmax, color, width = 5) {
    this.x = x; this.y = y; this.r = 6; this.rmax = rmax;
    this.color = color; this.width = width;
  }
  get alive() { return this.r < this.rmax * 0.97; }
  update() { this.r += (this.rmax - this.r) * 0.17 + 2; }
}

// ----------------------------------------------------------------- Spiel

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.d = new Draw(this.ctx);
    this.sw = K.WIDTH; this.sh = K.HEIGHT; this.scale = 1; this.ox = 0; this.oy = 0;
    this.mo = 0;                   // Versatz der Menuebox auf hohen Schirmen

    this.left = this.right = false;
    this.pointerX = null;          // Finger/Cursor in virtuellen Koordinaten
    this.pointerCtrl = false;
    this.tilt = 0;                 // -1..1 aus der Neigung
    this.tiltOn = false;
    this.paused = false;
    this.mode = "menu";
    this.menuCursor = 0;
    this.runActive = false;
    this.cursor = 0; this.gridTop = 0;
    this.wheelRot = 0; this.wheelSpinning = false; this.wheelT = 0;
    this.wheelFrom = 0; this.wheelTo = 0; this.wheelIdx = 0;
    this.wheelResult = null; this.winGlow = 0;
    this.showFps = false; this.fps = 0;

    this.load();
    this.applyStats();
    this.reset();
    this.runActive = false;
  }

  // ---- Speicherstand im Browser

  load() {
    let data = {};
    try { data = JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) {}
    this.highscore = data.highscore | 0;
    this.coins = data.coins | 0;
    this.spins = data.spins | 0;
    this.owned = new Set((data.owned || []).filter(k => SKIN_BY_KEY[k]));
    this.owned.add(DEFAULT_SKIN);
    this.copies = {};
    for (const [k, v] of Object.entries(data.copies || {})) {
      if (SKIN_BY_KEY[k]) this.copies[k] = Math.max(0, v | 0);
    }
    this.skinKey = this.owned.has(data.skin) ? data.skin : DEFAULT_SKIN;
    for (const s of SKINS) {
      if (s.unlock !== null && this.highscore >= s.unlock) this.owned.add(s.key);
    }
  }
  save() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        highscore: this.highscore, coins: this.coins, spins: this.spins,
        owned: [...this.owned].sort(), skin: this.skinKey, copies: this.copies
      }));
    } catch (e) {}
  }
  get skin() { return SKIN_BY_KEY[this.skinKey]; }

  // ---- Sterne und Wirkwerte

  stars(key) {
    const have = this.copies[key] || 0;
    let n = 0;
    while (n < K.MAX_STARS && have >= starTotal(n + 1)) n++;
    return n;
  }
  starProgress(key) {
    const st = this.stars(key);
    if (st >= K.MAX_STARS) return null;
    return [(this.copies[key] || 0) - starTotal(st), starCost(st + 1)];
  }
  isMaxed(key) { return (this.copies[key] || 0) >= K.MAX_COPIES; }
  effectiveStats(key) {
    const bonus = this.stars(key) * K.STAR_BONUS;
    return SKIN_BY_KEY[key].stats.map(b => (b > 0 ? b + bonus : 0));
  }
  applyStats() {
    const [sp, ag, iv, ib] = this.effectiveStats(this.skinKey);
    const P = K.STAT_PER_POINT;
    this.jumpV = K.JUMP_V * (1 + P[0] * sp);
    this.springV = K.SPRING_V * (1 + P[0] * sp * 0.5);
    this.accel = K.MOVE_ACCEL * (1 + P[1] * ag);
    this.maxSpeed = K.MAX_SPEED_X * (1 + P[1] * ag);
    this.springChance = K.SPRING_CHANCE * (1 + P[2] * iv);
    this.itemRate = 1 + P[2] * iv;
    this.rocketTotal = K.ROCKET_DISTANCE * (1 + P[3] * ib);
    this.holeTotal = K.HOLE_DISTANCE * (1 + P[3] * ib);
    this.itemBoost = 1 + P[3] * ib;
    this.springBoost = 1 + K.SPRING_BOOST_PER_POINT * ib;
  }

  get rocketActive() { return this.rocketLeft > 0; }
  get holeActive() { return this.holeLeft > 0; }
  get holeStreak() { return this.holeLeft > 0 && this.holeSuck <= 0; }
  get riding() { return this.rocketLeft > 0 || this.holeLeft > 0; }

  // ---- Neustart

  reset() {
    this.platforms = []; this.items = []; this.monsters = [];
    this.bullets = []; this.particles = []; this.rings = []; this.speedlines = [];
    this.initBackground();

    this.frame = 0; this.score = 0; this.bonus = 0;
    this.heightClimbed = 0; this.progress = 0;
    this.gameOver = false; this.paused = false;
    this.shootTimer = 0; this.shootAnim = 0; this.squash = 0;
    this.gapSinceSolid = 0;
    this.shield = 0; this.holeLeft = 0; this.holeSuck = 0;
    this.holeFx = 0; this.holeScale = 1; this.itemFlash = null;
    this.rocketLeft = 0; this.rocketV = 0; this.rocketFx = 0;
    this.rocketFlash = 0; this.flash = 0; this.earned = 0; this.toast = null;

    const start = new Platform(K.WIDTH / 2 - K.PLAT_W / 2, K.HEIGHT - 90, "normal");
    start.spring = false;
    this.platforms.push(start);
    this.topY = start.y;
    this.itemDue = {}; this.itemPending = {};
    for (const k of Object.keys(K.ITEM_INTERVALS)) {
      this.itemDue[k] = 0; this.itemPending[k] = 0;
    }
    while (this.topY > -K.HEIGHT) this.addNextPlatform();
    for (const k of Object.keys(K.ITEM_INTERVALS)) {
      this.itemDue[k] = this.rollDue(k); this.itemPending[k] = 0;
    }

    this.runActive = true;
    this.px = K.WIDTH / 2 - K.PLAYER_W / 2;
    this.py = start.y - K.PLAYER_H;
    this.vx = 0; this.vy = this.jumpV; this.facing = 1;
  }

  // ---- Plattform-Erzeugung mit garantierter Erreichbarkeit

  nextGap() {
    const gap = rndInt(K.MIN_GAP, K.MAX_GAP) + Math.floor(Math.min(this.progress / 900, 14));
    const room = K.SAFE_JUMP - this.gapSinceSolid;
    return clamp(gap, 26, Math.max(26, room));
  }
  makePlatform(y, forceSolid) {
    const diff = Math.min(this.progress / 6000, 1);
    const wMove = 0.10 + 0.18 * diff;
    const wBreak = forceSolid ? 0 : 0.07 + 0.11 * diff;
    const wVanish = 0.05 + 0.07 * diff;
    const wNormal = Math.max(0.05, 1 - wMove - wBreak - wVanish);
    let r = Math.random() * (wNormal + wMove + wBreak + wVanish);
    let kind;
    if ((r -= wNormal) < 0) kind = "normal";
    else if ((r -= wMove) < 0) kind = "moving";
    else if ((r -= wBreak) < 0) kind = "breakable";
    else kind = "vanish";
    return new Platform(rnd(K.WIDTH - K.PLAT_W), y, kind, this.springChance);
  }
  rollDue(kind) {
    // Exponentialverteilt, im Mittel ITEM_INTERVALS[kind] Punkte
    return -Math.log(1 - Math.random()) * K.ITEM_INTERVALS[kind] / this.itemRate;
  }
  addNextPlatform() {
    const gap = this.nextGap();
    for (const k of Object.keys(K.ITEM_INTERVALS)) {
      this.itemDue[k] -= gap;
      if (this.itemDue[k] <= 0) {
        this.itemPending[k] = Math.min(2, this.itemPending[k] + 1);
        this.itemDue[k] = this.rollDue(k);
      }
    }
    this.topY -= gap;
    this.gapSinceSolid += gap;
    const forceSolid = this.gapSinceSolid + K.MIN_GAP * 0.6 > K.SAFE_JUMP;
    const p = this.makePlatform(this.topY, forceSolid);
    this.platforms.push(p);
    if (p.kind !== "breakable") this.gapSinceSolid = 0;
    return p;
  }
  spawnAbove() {
    while (this.topY > -K.HEIGHT * 0.6) {
      const p = this.addNextPlatform();
      const waiting = Object.keys(this.itemPending).filter(k => this.itemPending[k]);
      if (waiting.length && !this.riding
          && (p.kind === "normal" || p.kind === "moving") && !p.spring) {
        const kind = choice(waiting.sort());
        this.itemPending[kind]--;
        this.items.push(new Item(p, kind));
      }
      if (this.progress > 1500 && Math.random() < 0.055) {
        this.monsters.push(new Monster(rnd(K.WIDTH - 60, 10), this.topY - 70));
      }
    }
  }

  // ---- Weltall-Hintergrund

  initBackground() {
    const span = K.HEIGHT + 2 * K.BG_MARGIN;
    this.bgStars = [];
    for (let i = 0; i < 90; i++) {
      this.bgStars.push([rnd(K.WIDTH + K.BG_MARGIN, -K.BG_MARGIN),
                         rnd(K.HEIGHT + K.BG_MARGIN, -K.BG_MARGIN),
                         rnd(1.9, 0.5), rnd(1.0, 0.3), rnd(TAU),
                         choice([0.10, 0.17, 0.26, 0.36])]);
    }
    this.bgNebulae = [];
    for (let i = 0; i < 4; i++) this.bgNebulae.push(this.newNebula(rnd(K.HEIGHT, -K.BG_MARGIN)));
    this.bgPlanet = null;
    this.shooting = [];
    this.bgSpan = span;
  }
  newNebula(y) {
    return [rnd(K.WIDTH), y, rnd(165, 80), choice(K.NEBULA_COLORS), rnd(0.12, 0.05)];
  }
  newPlanet() {
    const [col, shade] = choice(K.PLANET_COLORS);
    const r = rnd(58, 26);
    return [rnd(K.WIDTH - r, r), -K.BG_MARGIN - r * 2.2, r, col, shade,
            Math.random() < 0.45, rnd(0.22, 0.14)];
  }
  scrollBackground(dy) {
    const span = this.bgSpan;
    for (const st of this.bgStars) {
      st[1] += dy * st[5];
      if (st[1] > K.HEIGHT + K.BG_MARGIN) {
        st[1] -= span; st[0] = rnd(K.WIDTH + K.BG_MARGIN, -K.BG_MARGIN);
      }
    }
    for (let i = 0; i < this.bgNebulae.length; i++) {
      const n = this.bgNebulae[i];
      n[1] += dy * n[4];
      if (n[1] - n[2] > K.HEIGHT + K.BG_MARGIN) {
        this.bgNebulae[i] = this.newNebula(-K.BG_MARGIN - n[2]);
      }
    }
    if (this.bgPlanet) {
      this.bgPlanet[1] += dy * this.bgPlanet[6];
      if (this.bgPlanet[1] - this.bgPlanet[2] * 2 > K.HEIGHT + K.BG_MARGIN) this.bgPlanet = null;
    } else if (Math.random() < Math.min(0.02, dy * 0.0012)) {
      this.bgPlanet = this.newPlanet();
    }
  }
  updateShootingStars() {
    if (this.shooting.length < 2 && Math.random() < 0.005) {
      const side = choice([-1, 1]);
      this.shooting.push([rnd(K.WIDTH) - side * 60, rnd(K.HEIGHT * 0.6, -20),
                          side * rnd(11, 7), rnd(5, 2.2), 46]);
    }
    for (const sh of this.shooting) { sh[0] += sh[2]; sh[1] += sh[3]; sh[4]--; }
    this.shooting = this.shooting.filter(sh =>
      sh[4] > 0 && sh[0] > -120 && sh[0] < K.WIDTH + 120 && sh[1] < K.HEIGHT + 40);
  }
  skyColors() {
    const t = this.heightClimbed / K.PALETTE_SPAN;
    const n = K.SPACE_PALETTES.length;
    const i = ((Math.floor(t) % n) + n) % n, j = (i + 1) % n;
    let f = t - Math.floor(t);
    f = f * f * (3 - 2 * f);
    let top = mix(K.SPACE_PALETTES[i][0], K.SPACE_PALETTES[j][0], f);
    let bot = mix(K.SPACE_PALETTES[i][1], K.SPACE_PALETTES[j][1], f);
    if (this.rocketFx > 0.01) {
      top = mix(top, K.C_ROCKET_SKY_TOP, this.rocketFx);
      bot = mix(bot, K.C_ROCKET_SKY_BOT, this.rocketFx);
    }
    if (this.holeFx > 0.01) {
      top = mix(top, "#000000", 0.85 * this.holeFx);
      bot = mix(bot, "#170a22", 0.85 * this.holeFx);
    }
    return [top, bot];
  }
  updateStarfield() {
    if (this.rocketFx > 0.05 || this.holeStreak) {
      for (let i = 0; i < 3; i++) {
        this.speedlines.push([rnd(K.WIDTH + 10, -10), -40, rnd(70, 18), rnd(46, 22)]);
      }
    }
    const push = Math.max(this.rocketFx, this.holeStreak ? 1.6 : 0);
    for (const ln of this.speedlines) ln[1] += ln[3] * (0.4 + push);
    this.speedlines = this.speedlines.filter(ln => ln[1] < K.HEIGHT + 60);
  }

  // ------------------------------------------------------------- Logik

  step() {
    if (this.mode !== "play") this.updateMenu();
    else if (!this.paused && !this.gameOver) this.update();
  }

  steerTo(targetX) {
    let d = targetX - (this.px + K.PLAYER_W / 2);
    if (d > K.WIDTH / 2) d -= K.WIDTH;
    else if (d < -K.WIDTH / 2) d += K.WIDTH;
    let want = clamp(d * 0.40, -this.maxSpeed, this.maxSpeed);
    if (Math.abs(d) < 2) want = 0;
    const stepv = this.accel * (this.rocketActive ? 0.9 : 1.7);
    this.vx += clamp(want - this.vx, -stepv, stepv);
    if (Math.abs(this.vx) > 0.4) this.facing = this.vx > 0 ? 1 : -1;
  }

  update() {
    this.frame++;
    for (const a of ["shootTimer", "shootAnim", "rocketFlash", "squash",
                     "flash", "shield", "holeSuck"]) {
      if (this[a] > 0) this[a]--;
    }
    this.rocketFx += clamp((this.rocketActive ? 1 : 0) - this.rocketFx, -0.045, 0.09);
    const htar = (this.holeActive || this.holeSuck > 0) ? 1 : 0;
    this.holeFx += clamp(htar - this.holeFx, -1 / K.HOLE_OUT, 0.16);
    const span = 1 - K.HOLE_MIN_SCALE;
    if (this.holeSuck > 0) this.holeScale = K.HOLE_MIN_SCALE + span * (this.holeSuck / K.HOLE_SUCK);
    else if (this.holeActive) this.holeScale = K.HOLE_MIN_SCALE;
    else if (this.holeScale < 1) this.holeScale = Math.min(1, this.holeScale + span / K.HOLE_OUT);
    if (this.itemFlash) {
      this.itemFlash[0]--;
      if (this.itemFlash[0] <= 0) this.itemFlash = null;
    }
    if (this.shield === 1) {
      this.burst(this.px + K.PLAYER_W / 2, this.py + K.PLAYER_H / 2, K.C_SHIELD, 18);
    }

    // --- seitwaerts
    const accel = this.accel * (this.rocketActive ? 0.55 : 1);
    if (this.pointerCtrl && this.pointerX !== null && !(this.left || this.right)) {
      this.steerTo(this.pointerX);
    } else if (this.tiltOn && Math.abs(this.tilt) > 0.04 && !(this.left || this.right)) {
      this.vx += accel * clamp(this.tilt * 1.8, -1.6, 1.6);
      if (Math.abs(this.vx) > 0.4) this.facing = this.vx > 0 ? 1 : -1;
    } else if (this.left && !this.right) { this.vx -= accel; this.facing = -1; }
    else if (this.right && !this.left) { this.vx += accel; this.facing = 1; }
    else {
      this.vx *= K.MOVE_FRICTION;
      if (Math.abs(this.vx) < 0.05) this.vx = 0;
    }
    this.vx = clamp(this.vx, -this.maxSpeed, this.maxSpeed);
    this.px += this.vx;
    if (this.px + K.PLAYER_W < 0) this.px = K.WIDTH;
    else if (this.px > K.WIDTH) this.px = -K.PLAYER_W;

    // --- hoch und runter
    if (this.holeSuck > 0) { this.vy = 0; this.holeSwirl(); }
    else if (this.holeActive) {
      this.vy = -Math.min(K.HOLE_SPEED, this.holeLeft); this.holeSwirl();
    } else if (this.rocketActive) {
      this.rocketV = Math.min(K.ROCKET_SPEED, this.rocketV + K.ROCKET_ACCEL);
      this.vy = -Math.min(this.rocketV, this.rocketLeft);
      this.rocketTrail();
    } else {
      this.vy = Math.min(this.vy + K.GRAVITY, K.MAX_FALL);
    }
    this.py += this.vy;

    for (const p of this.platforms) p.update();
    for (const it of this.items) it.update();

    // --- Landung
    if (this.vy > 0 && !this.riding && this.holeSuck <= 0) {
      const feetPrev = this.py + K.PLAYER_H - this.vy;
      const feetNow = this.py + K.PLAYER_H;
      for (const p of this.platforms) {
        if (p.broken || p.used) continue;
        if (!(this.px + K.PLAYER_W - 8 > p.x && this.px + 8 < p.x + K.PLAT_W)) continue;
        if (feetPrev <= p.y + 2 && p.y + 2 <= feetNow + 2) { this.landOn(p); break; }
      }
    }

    // --- Items einsammeln
    for (const it of this.items) {
      if (!it.alive || !this.overlaps(it.x, it.y, it.w, it.h, 6)) continue;
      if (it.kind !== "shield" && this.riding) continue;
      it.taken = true;
      this.pickUp(it);
    }

    for (const b of this.bullets) b.update();
    this.bullets = this.bullets.filter(b => b.y > -20);
    for (const m of this.monsters) m.update();

    for (const b of [...this.bullets]) {
      for (const m of this.monsters) {
        if (!m.dead && m.x < b.x && b.x < m.x + m.w && m.y < b.y && b.y < m.y + m.h) {
          m.dead = true;
          this.addBonus(300);
          this.burst(m.cx, m.cy, "#ff9f43");
          const i = this.bullets.indexOf(b);
          if (i >= 0) this.bullets.splice(i, 1);
          break;
        }
      }
    }

    const pcx = this.px + K.PLAYER_W / 2, pcy = this.py + K.PLAYER_H / 2;
    for (const m of this.monsters) {
      if (m.dead) continue;
      if (this.holeActive || this.holeSuck > 0) {
        const d = Math.hypot(m.cx - pcx, m.cy - pcy);
        if (d < K.HOLE_PULL_R) {
          m.x += (pcx - m.cx) * K.HOLE_PULL;
          m.y += (pcy - m.cy) * K.HOLE_PULL;
          if (d < K.HOLE_EAT_R) {
            m.dead = true; this.addBonus(100);
            this.burst(m.cx, m.cy, K.C_HOLE_RIM, 14);
          }
        }
        continue;
      }
      if (this.rocketActive) {
        if (Math.hypot(m.cx - pcx, m.cy - pcy) < K.ROCKET_BLAST_R) {
          m.dead = true; this.addBonus(100);
          this.burst(m.cx, m.cy, K.C_ASTRAL, 18);
          this.rings.push(new Ring(m.cx, m.cy, 70, K.C_ASTRAL_L, 4));
        }
        continue;
      }
      if (!this.overlaps(m.x, m.y, m.w, m.h, -10)) continue;
      if (this.vy > 0 && this.py + K.PLAYER_H - this.vy <= m.y + 12) {
        m.dead = true; this.vy = K.STOMP_V; this.squash = 8;
        this.addBonus(200); this.burst(m.cx, m.cy, "#ff9f43");
      } else if (this.shield > 0) {
        m.dead = true; this.addBonus(50);
        this.burst(m.cx, m.cy, K.C_SHIELD, 20);
        this.rings.push(new Ring(pcx, pcy, 120, K.C_SHIELD, 5));
      } else { this.endGame(); return; }
    }

    // --- Kamera
    if (this.py < K.SCROLL_LINE) {
      const dy = K.SCROLL_LINE - this.py;
      this.py = K.SCROLL_LINE;
      this.heightClimbed += dy;
      this.score = this.heightClimbed + this.bonus;
      this.checkUnlocks();
      if (this.rocketActive) {
        this.rocketLeft -= dy;
        if (this.rocketLeft <= 0) this.endRocket();
      } else if (this.holeActive) {
        this.holeLeft -= dy;
        if (this.holeLeft <= 0) this.endHole();
      } else this.progress += dy;
      for (const group of [this.platforms, this.monsters, this.bullets, this.rings]) {
        for (const o of group) o.y += dy;
      }
      for (const q of this.particles) q[1] += dy;
      this.topY += dy;
      this.scrollBackground(dy);
      this.spawnAbove();
    }

    this.platforms = this.platforms.filter(p => p.alive);
    this.items = this.items.filter(it => it.alive);
    this.monsters = this.monsters.filter(m => !m.dead && m.y < K.HEIGHT + 80);
    for (const r of this.rings) r.update();
    this.rings = this.rings.filter(r => r.alive);
    for (const q of this.particles) {
      q[0] += q[2]; q[1] += q[3]; q[3] += 0.35; q[4]--;
    }
    this.particles = this.particles.filter(q => q[4] > 0);
    this.updateStarfield();
    this.updateShootingStars();
    if (this.toast) {
      this.toast[3]--;
      if (this.toast[3] <= 0) this.toast = null;
    }
    if (this.py > K.HEIGHT + 40) this.endGame();
  }

  overlaps(x, y, w, h, pad = 0) {
    return this.px + K.PLAYER_W - pad > x && this.px + pad < x + w
        && this.py + K.PLAYER_H - pad > y && this.py + pad < y + h;
  }
  checkUnlocks() {
    for (const sk of SKINS) {
      if (sk.unlock !== null && this.score >= sk.unlock && !this.owned.has(sk.key)) {
        this.owned.add(sk.key);
        this.toast = [`SKIN FREIGESCHALTET: ${sk.name.toUpperCase()}`,
                      `${sk.unlock} Punkte erreicht`, K.RARITY.score[1], 170];
        this.burst(this.px + K.PLAYER_W / 2, this.py + K.PLAYER_H / 2, K.RARITY.score[1], 30);
        this.rings.push(new Ring(this.px + K.PLAYER_W / 2, this.py + K.PLAYER_H / 2,
                                 260, K.RARITY.score[1], 6));
        this.save();
      }
    }
  }
  addBonus(points) {
    this.bonus += points;
    this.score = this.heightClimbed + this.bonus;
  }

  pickUp(it) {
    const cx = it.x + it.w / 2, cy = it.y + it.h / 2;
    if (it.kind === "rocket") {
      this.rocketLeft = this.rocketTotal; this.rocketV = 12;
      this.rocketFlash = 55; this.flash = 11; this.vy = -this.rocketV;
      this.burst(cx, cy, K.C_ASTRAL, 34);
      [[150, K.C_ASTRAL_L, 7], [260, K.C_ASTRAL, 6], [380, "#ffffff", 5]]
        .forEach(([r, c, w]) => this.rings.push(new Ring(cx, cy, r, c, w)));
    } else if (it.kind === "shield") {
      this.shield = Math.round(K.SHIELD_FRAMES * this.itemBoost);
      this.itemFlash = [55, "SCHUTZSCHILD", K.C_SHIELD];
      this.burst(cx, cy, K.C_SHIELD, 26);
      this.rings.push(new Ring(cx, cy, 200, K.C_SHIELD, 6));
    } else {
      this.holeLeft = this.holeTotal; this.holeSuck = K.HOLE_SUCK;
      this.itemFlash = [55, "SCHWARZES LOCH", K.C_HOLE_RIM];
      this.vy = 0;
      this.burst(cx, cy, K.C_HOLE_RIM, 30);
      this.rings.push(new Ring(cx, cy, 240, K.C_HOLE_RIM, 6));
    }
  }
  endRocket() {
    this.rocketLeft = 0; this.rocketV = 0; this.vy = -6;
    const cx = this.px + K.PLAYER_W / 2, cy = this.py + K.PLAYER_H / 2;
    this.burst(cx, cy, K.C_ASTRAL, 26);
    this.rings.push(new Ring(cx, cy, 240, K.C_ASTRAL_L, 6));
  }
  endHole() {
    this.holeLeft = 0; this.vy = -7; this.squash = 7;
    const cx = this.px + K.PLAYER_W / 2, cy = this.py + K.PLAYER_H / 2;
    this.burst(cx, cy, K.C_HOLE_RIM, 26);
    this.rings.push(new Ring(cx, cy, 220, K.C_HOLE_RIM, 6));
  }
  holeSwirl() {
    const cx = this.px + K.PLAYER_W / 2, cy = this.py + K.PLAYER_H / 2;
    if (this.holeStreak) {
      for (let i = 0; i < 5; i++) {
        this.particles.push([cx + rnd(5, -5), cy, rnd(1.2, -1.2), rnd(9, 3),
                             rndInt(8, 18),
                             choice([K.C_HOLE_RIM, "#ffd166", "#ffffff", K.C_ASTRAL_L])]);
      }
      return;
    }
    for (let i = 0; i < 3; i++) {
      const a = rnd(TAU), r = rnd(120, 60);
      this.particles.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r,
                           -Math.cos(a) * 2.6 - Math.sin(a) * 2.2,
                           -Math.sin(a) * 2.6 + Math.cos(a) * 2.2,
                           rndInt(10, 22),
                           choice([K.C_HOLE_RIM, "#ffd166", K.C_ASTRAL_L, "#ffffff"])]);
    }
  }
  rocketTrail() {
    const cx = this.px + K.PLAYER_W / 2, cy = this.py + K.PLAYER_H;
    for (let i = 0; i < 10; i++) {
      this.particles.push([cx + rnd(17, -17), cy, rnd(2.8, -2.8), rnd(7.5, 2),
                           rndInt(16, 38), choice(K.C_FLAME)]);
    }
    if (this.frame % 5 === 0) this.rings.push(new Ring(cx, cy - 6, 130, K.C_ASTRAL, 4));
  }
  landOn(p) {
    if (p.kind === "breakable") {
      p.broken = true;
      this.py = p.y - K.PLAYER_H;
      this.vy = this.jumpV * K.BREAK_JUMP;
      this.squash = 6;
      this.burst(p.x + K.PLAT_W / 2, p.y, K.C_BROWN, 14);
      return;
    }
    this.py = p.y - K.PLAYER_H;
    this.squash = 8;
    if (p.spring) {
      this.vy = this.springV * this.springBoost;
      this.burst(p.x + K.PLAT_W / 2, p.y, "#888888", 6);
    } else this.vy = this.jumpV;
    if (p.kind === "vanish") p.used = true;
  }
  burst(x, y, color, n = 10) {
    for (let i = 0; i < n; i++) {
      this.particles.push([x, y, rnd(2.6, -2.6), rnd(-0.4, -3.4), rndInt(14, 26), color]);
    }
  }
  shoot() {
    if (this.shootTimer > 0 || this.rocketActive) return;
    this.shootTimer = K.SHOOT_COOLDOWN;
    this.shootAnim = K.SHOOT_ANIM;
    const { tip } = snoutPoints(1);
    this.bullets.push(new Bullet(this.px + K.PLAYER_W / 2 + tip[0] * this.facing,
                                 this.py + K.PLAYER_H + tip[1]));
  }
  endGame() {
    this.gameOver = true;
    this.runActive = false;
    this.rocketLeft = 0;
    this.earned = Math.floor(this.score / K.COINS_PER_SCORE);
    this.coins += this.earned;
    if (Math.floor(this.score) > this.highscore) this.highscore = Math.floor(this.score);
    this.save();
  }

  // ---- Gluecksrad

  spin() {
    if (this.wheelSpinning || this.coins < K.SPIN_COST) return;
    this.coins -= K.SPIN_COST;
    this.spins++;
    this.wheelResult = null;
    let r = Math.random(), acc = 0, idx = K.WHEEL.length - 1;
    for (let i = 0; i < K.WHEEL.length; i++) {
      acc += K.WHEEL[i][1];
      if (r < acc) { idx = i; break; }
    }
    this.wheelIdx = idx;
    const cand = WHEEL_SLICES.filter(s => s[0] === idx);
    const [, st, w] = choice(cand);
    const u = st + w * rnd(0.78, 0.22);
    this.wheelFrom = ((this.wheelRot % 360) + 360) % 360;
    this.wheelTo = u * 360 + 360 * 7;
    while (this.wheelTo < this.wheelFrom + 360 * 5) this.wheelTo += 360;
    this.wheelT = 0;
    this.wheelSpinning = true;
    this.save();
  }
  wheelPayout() {
    const kind = K.WHEEL[this.wheelIdx][0], col = K.WHEEL[this.wheelIdx][3];
    if (kind === "coins") {
      const amount = rndInt(K.COIN_PRIZE[0], K.COIN_PRIZE[1]);
      this.coins += amount;
      this.wheelResult = ["Muenzen", `+${amount}`, col, null, 0];
      this.winGlow = 34; this.save();
      return;
    }
    const key = choice(POOLS[kind]);
    const before = this.stars(key);
    let note;
    if (!this.owned.has(key)) {
      this.owned.add(key);
      if (this.copies[key] === undefined) this.copies[key] = 0;
      note = "NEU!";
    } else if (this.isMaxed(key)) {
      this.coins += K.MAXED_COINS;
      note = `voll ausgebaut   +${K.MAXED_COINS} Muenzen`;
    } else {
      this.copies[key] = (this.copies[key] || 0) + 1;
      const now = this.stars(key);
      if (now > before) note = `EVOLVIERT   ${now} ${now === 1 ? "Stern" : "Sterne"}`;
      else {
        const [got, need] = this.starProgress(key);
        note = `Kopie   ${got}/${need} bis ${now + 1} Sterne`;
      }
    }
    this.wheelResult = [SKIN_BY_KEY[key].name, note, col, key, this.stars(key)];
    if (key === this.skinKey) this.applyStats();
    this.winGlow = 34; this.save();
  }
  updateMenu() {
    this.frame++;
    if (this.mode === "menu") { this.scrollBackground(1.4); this.updateShootingStars(); }
    if (this.winGlow > 0) this.winGlow--;
    if (this.wheelSpinning) {
      this.wheelT = Math.min(1, this.wheelT + 1 / 165);
      const e = 1 - Math.pow(1 - this.wheelT, 3.4);
      this.wheelRot = this.wheelFrom + (this.wheelTo - this.wheelFrom) * e;
      if (this.wheelT >= 1) { this.wheelSpinning = false; this.wheelPayout(); }
    }
  }

  // ----------------------------------------------------------- Zeichnen

  draw() {
    const c = this.ctx, d = this.d;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    c.fillStyle = K.C_LETTERBOX;
    c.fillRect(0, 0, this.sw, this.sh);

    const amp = 6 * this.rocketFx * this.scale;
    const shx = amp > 0.3 ? rnd(amp, -amp) : 0;
    const shy = amp > 0.3 ? rnd(amp, -amp) : 0;
    c.save();
    c.beginPath();
    c.rect(this.ox, this.oy, K.WIDTH * this.scale, K.HEIGHT * this.scale);
    c.clip();
    c.translate(this.ox + shx, this.oy + shy);
    c.scale(this.scale, this.scale);
    if (this.mode === "menu") this.drawSpace(); else this.drawWorld();
    c.restore();
    this.drawLetterbox();

    if (this.mode !== "play") {
      // Menues sind fuer 640 Hoehe gebaut - auf hohen Schirmen mittig setzen
      c.save();
      c.translate(0, this.mo * this.scale);
      if (this.mode === "menu") this.drawMainMenu();
      else if (this.mode === "skins") this.drawSkins();
      else this.drawGacha();
      c.restore();
    } else {
      this.drawHud();
      if (this.paused) this.overlay("PAUSE", "Tippen = weiter");
      else if (this.gameOver) {
        this.overlay("GAME OVER",
          `Score ${Math.floor(this.score)}   -   Best ${this.highscore}\n` +
          `+${this.earned} Muenzen   (gesamt ${this.coins})\n\n` +
          "Tippen fuer ein neues Spiel");
      }
    }
    if (this.showFps) {
      d.tx(8, this.sh - 10, `${this.fps.toFixed(0)} FPS`,
           { size: this.fs(10), fill: "#5a6390", anchor: "w" });
    }
  }

  fs(size) { return Math.max(7, Math.round(size * this.scale)); }
  toX(x) { return this.ox + x * this.scale; }   // virtuell -> Bildschirm
  toY(y) { return this.oy + y * this.scale; }
  panel(x0, y0, x1, y1, fill, outline = "", width = 2) {
    this.d.rc(this.toX(x0), this.toY(y0), this.toX(x1), this.toY(y1),
              { fill, outline, width: Math.max(1, width * this.scale) });
  }
  vtext(x, y, text, size = 12, fill = "#fff", bold = true, anchor = "center") {
    this.d.tx(this.toX(x), this.toY(y), text,
              { size: this.fs(size), fill, bold, anchor });
  }

  drawLetterbox() {
    const d = this.d;
    const x0 = this.ox, y0 = this.oy;
    const x1 = this.ox + K.WIDTH * this.scale, y1 = this.oy + K.HEIGHT * this.scale;
    if (x0 > 0) {
      d.rc(-1, -1, x0, this.sh + 1, { fill: K.C_LETTERBOX });
      d.rc(x1, -1, this.sw + 1, this.sh + 1, { fill: K.C_LETTERBOX });
    }
    if (y0 > 0) {
      d.rc(-1, -1, this.sw + 1, y0, { fill: K.C_LETTERBOX });
      d.rc(-1, y1, this.sw + 1, this.sh + 1, { fill: K.C_LETTERBOX });
    }
    if (x0 > 0 || y0 > 0) {
      d.rc(x0, y0, x1, y1, { outline: mix("#2b435c", K.C_ASTRAL, this.rocketFx),
                             width: 2 + 3 * this.rocketFx });
    }
  }

  drawWorld() {
    const d = this.d;
    const fx = this.rocketFx;
    this.drawSpace();
    const bot = this._skyBot;
    const lfx = Math.max(fx, this.holeStreak ? this.holeFx : 0);
    for (const st of this.speedlines) {
      d.ln([st[0], st[1], st[0], st[1] + st[2]],
           { fill: mix(bot, "#ffffff", 0.35 + 0.65 * lfx), width: 1 + 2 * lfx });
    }
    for (const r of this.rings) this.drawRing(r);
    for (const p of this.platforms) this.drawPlatform(p);
    for (const it of this.items) this.drawItem(it);
    for (const m of this.monsters) this.drawMonster(m);
    for (const b of this.bullets) {
      d.ov(b.x - 5, b.y - 5, b.x + 5, b.y + 5,
           { fill: "#ffffff", outline: "#7a8a99", width: 2 });
    }
    for (const q of this.particles) {
      const s = Math.max(1.5, q[4] / 6);
      d.ov(q[0] - s, q[1] - s, q[0] + s, q[1] + s, { fill: q[5] });
    }
    this.drawPlayer();
    if (this.flash > 0) {
      const lv = Math.min(3, Math.floor((11 - this.flash) / 3));
      d.rc(-K.BG_MARGIN, -K.BG_MARGIN, K.WIDTH + K.BG_MARGIN, K.HEIGHT + K.BG_MARGIN,
           { fill: "#ffffff", stipple: ["gray75", "gray50", "gray25", "gray12"][lv] });
    }
  }

  drawSpace() {
    const d = this.d;
    const [top, bot] = this.skyColors();
    this._skyBot = bot;
    const m = K.BG_MARGIN, span = K.HEIGHT + 2 * m;
    const grad = this.ctx.createLinearGradient(0, -m, 0, -m + span);
    grad.addColorStop(0, top); grad.addColorStop(1, bot);
    this.ctx.fillStyle = grad;
    this.ctx.fillRect(-m, -m, K.WIDTH + 2 * m, span);

    for (let [nx, ny, nr, ncol] of this.bgNebulae) {
      if (this.holeFx > 0.01) ncol = mix(ncol, bot, 0.85 * this.holeFx);
      for (const [f, st] of [[1, "gray12"], [0.87, "gray12"], [0.74, "gray12"],
                             [0.61, "gray12"], [0.48, "gray12"], [0.35, "gray25"],
                             [0.20, "gray25"]]) {
        const r = nr * f;
        d.ov(nx - r, ny - r * 0.66, nx + r, ny + r * 0.66, { fill: ncol, stipple: st });
      }
    }
    if (this.bgPlanet) this.drawPlanet(...this.bgPlanet);

    for (const [x, y, r, br, ph] of this.bgStars) {
      const tw = br * (0.68 + 0.32 * Math.sin(this.frame * 0.05 + ph));
      const col = mix(bot, "#ffffff", clamp(0.35 + 0.65 * tw, 0, 1));
      d.ov(x - r, y - r, x + r, y + r, { fill: col });
      if (r > 1.45 && tw > 0.72) {
        const g = r * (2.4 + 1.4 * tw), q = r * 0.42;
        d.pg([x, y - g, x + q, y - q, x + g, y, x + q, y + q,
              x, y + g, x - q, y + q, x - g, y, x - q, y - q],
             { fill: mix(bot, col, 0.75) });
      }
    }
    for (const [sx, sy, dx, dy, life] of this.shooting) {
      const n = Math.hypot(dx, dy) || 1;
      const ln = 34 * Math.min(1, life / 26);
      d.ln([sx, sy, sx - dx / n * ln, sy - dy / n * ln],
           { fill: mix(bot, "#dfe9ff", 0.85), width: 2 });
      d.ov(sx - 1.8, sy - 1.8, sx + 1.8, sy + 1.8, { fill: "#ffffff" });
    }
  }

  drawPlanet(x, y, r, col, shade, ring) {
    const d = this.d;
    if (ring) {
      d.arc(x - r * 1.9, y - r * 0.52, x + r * 1.9, y + r * 0.52, 0, 360,
            { style: "arc", outline: mix(col, "#ffffff", 0.35),
              width: Math.max(2, r * 0.10) });
    }
    d.ov(x - r, y - r, x + r, y + r, { fill: col });
    d.ov(x - r * 0.96, y - r * 0.9, x + r * 0.5, y + r * 0.6,
         { fill: mix(col, "#ffffff", 0.18) });
    d.ov(x - r * 0.2, y - r * 0.55, x + r, y + r, { fill: shade, stipple: "gray50" });
    for (let i = 0; i < 3; i++) {
      const ry = y - r * 0.45 + i * r * 0.45, rw = r * (0.72 - 0.12 * i);
      d.ov(x - rw, ry - r * 0.09, x - rw + r * 0.7, ry + r * 0.09,
           { fill: mix(col, shade, 0.55) });
    }
    if (ring) {
      d.arc(x - r * 1.9, y - r * 0.52, x + r * 1.9, y + r * 0.52, 180, 180,
            { style: "arc", outline: mix(col, "#ffffff", 0.5),
              width: Math.max(2, r * 0.10) });
    }
  }

  drawRing(r) {
    const t = r.r / r.rmax;
    this.d.ov(r.x - r.r, r.y - r.r * 0.72, r.x + r.r, r.y + r.r * 0.72,
              { outline: mix(r.color, this._skyBot, t),
                width: Math.max(1, r.width * (1 - t)) });
  }

  drawPlatform(p) {
    const d = this.d;
    let top, bot;
    if (p.kind === "moving") [top, bot] = [K.C_BLUE, K.C_BLUE_D];
    else if (p.kind === "breakable") [top, bot] = [K.C_BROWN, K.C_BROWN_D];
    else if (p.kind === "vanish") [top, bot] = [K.C_WHITE, K.C_WHITE_D];
    else [top, bot] = [K.C_GREEN, K.C_GREEN_D];
    if (p.spring) {
      const sx = p.x + K.PLAT_W / 2 - 7, sy = p.y - 12;
      d.rc(sx, sy, sx + 14, p.y, { fill: "#d9d9d9", outline: "#6b6b6b" });
      d.ln([sx, sy + 4, sx + 14, sy + 8], { fill: "#6b6b6b", width: 2 });
      d.ln([sx, sy + 8, sx + 14, sy + 12], { fill: "#6b6b6b", width: 2 });
    }
    d.rc(p.x, p.y + 4, p.x + K.PLAT_W, p.y + K.PLAT_H, { fill: bot });
    d.rc(p.x, p.y, p.x + K.PLAT_W, p.y + K.PLAT_H - 5, { fill: top });
    d.ln([p.x + 1, p.y + 1, p.x + K.PLAT_W - 1, p.y + 1],
         { fill: mix(top, "#ffffff", 0.45) });
    if (p.kind === "breakable") {
      const mx = p.x + K.PLAT_W / 2;
      d.ln([mx, p.y, mx - 4, p.y + K.PLAT_H], { fill: K.C_BROWN_D, width: 2 });
    }
  }

  drawItem(it) {
    if (it.kind === "rocket") this.drawItemRocket(it);
    else if (it.kind === "shield") this.drawItemShield(it);
    else this.drawItemHole(it);
  }
  drawItemShield(it) {
    const d = this.d;
    const { x, y, w, h } = it, cx = x + w / 2, cy = y + h / 2;
    const pulse = 0.5 + 0.5 * Math.sin(it.phase * 1.7);
    [[20, K.C_SHIELD_D, "gray12"], [13, K.C_SHIELD, "gray25"], [7, "#ffffff", "gray50"]]
      .forEach(([gl, col, st]) => {
        const g = gl + 4 * pulse;
        d.ov(cx - g, cy - g * 1.1, cx + g, cy + g * 1.1, { fill: col, stipple: st });
      });
    d.pg([cx - w / 2, y + 4, cx, y, cx + w / 2, y + 4,
          cx + w / 2, y + h * 0.52, cx, y + h, cx - w / 2, y + h * 0.52],
         { fill: K.C_SHIELD, outline: K.C_SHIELD_D, width: 2 });
    d.pg([cx - w / 2 + 4, y + 7, cx, y + 4, cx, y + h - 6, cx - w / 2 + 4, y + h * 0.5],
         { fill: mix(K.C_SHIELD, "#ffffff", 0.55) });
    d.ln([cx - 6, cy, cx - 1, cy + 6, cx + 7, cy - 7],
         { fill: "#0b3a49", width: 3, round: true });
  }
  drawItemHole(it) {
    const d = this.d;
    const cx = it.x + it.w / 2, cy = it.y + it.h / 2, r = it.w / 2;
    [[22, "gray12"], [15, "gray25"]].forEach(([g, st], i) => {
      const gg = g + 3 * Math.sin(it.phase * 1.6 + i);
      d.ov(cx - gg, cy - gg, cx + gg, cy + gg, { fill: K.C_HOLE_RIM, stipple: st });
    });
    for (let i = 0; i < 3; i++) {
      const a = -it.phase * 2 - i * 2.1;
      const rr = r + 9 + 5 * Math.sin(it.phase * 1.3 + i);
      d.arc(cx - rr * 1.55, cy - rr * 0.5, cx + rr * 1.55, cy + rr * 0.5,
            a * 180 / Math.PI, 150,
            { style: "arc", outline: mix(K.C_HOLE_RIM, "#ffffff", i * 0.3),
              width: 3 - i * 0.6 });
    }
    d.ov(cx - r, cy - r, cx + r, cy + r, { fill: K.C_HOLE, outline: K.C_HOLE_RIM, width: 2 });
    d.ov(cx - r * 0.62, cy - r * 0.62, cx + r * 0.62, cy + r * 0.62, { fill: "#000000" });
  }
  drawItemRocket(rk) {
    const d = this.d;
    const { x, y, w, h } = rk, cx = x + w / 2, cy = y + h / 2;
    const pulse = 0.5 + 0.5 * Math.sin(rk.phase * 1.7);
    [[22, K.C_ASTRAL, "gray12"], [14, K.C_ASTRAL_L, "gray25"], [8, "#ffffff", "gray50"]]
      .forEach(([gl, col, st]) => {
        const g = gl + 4 * pulse;
        d.ov(cx - g, cy - g * 1.15, cx + g, cy + g * 1.15, { fill: col, stipple: st });
      });
    for (let i = 0; i < 6; i++) {
      const a = rk.phase * 1.3 + i * TAU / 6;
      const sx = cx + Math.cos(a) * 22, sy = cy + Math.sin(a) * 15;
      const s = 2.2 + 1.2 * Math.sin(rk.phase * 3 + i);
      d.ov(sx - s, sy - s, sx + s, sy + s, { fill: K.C_ASTRAL_L });
    }
    d.pg([cx, y, x + w, y + h * 0.42, x + w, y + h * 0.82, x, y + h * 0.82, x, y + h * 0.42],
         { fill: K.C_ROCKET, outline: K.C_ROCKET_D, width: 2 });
    d.pg([cx, y, cx + 3, y + h * 0.45, cx - 3, y + h * 0.45], { fill: K.C_ROCKET_L });
    d.pg([x, y + h * 0.6, x - 8, y + h * 0.95, x, y + h * 0.82], { fill: K.C_ROCKET_D });
    d.pg([x + w, y + h * 0.6, x + w + 8, y + h * 0.95, x + w, y + h * 0.82],
         { fill: K.C_ROCKET_D });
    d.ov(cx - 5, y + h * 0.38, cx + 5, y + h * 0.62,
         { fill: "#bfe9ff", outline: K.C_ROCKET_D, width: 2 });
    const fl = 8 + 6 * pulse;
    d.pg([cx - 7, y + h * 0.82, cx + 7, y + h * 0.82, cx, y + h * 0.82 + fl],
         { fill: "#ff8c42" });
    d.pg([cx - 3.5, y + h * 0.82, cx + 3.5, y + h * 0.82, cx, y + h * 0.82 + fl * 0.6],
         { fill: "#fff3b0" });
  }

  drawMonster(m) {
    const d = this.d;
    d.ov(m.x, m.y, m.x + m.w, m.y + m.h,
         { fill: "#8e44ad", outline: "#5e2d73", width: 2 });
    for (let i = 0; i < 4; i++) {
      const lx = m.x + 8 + i * 10;
      d.ln([lx, m.y + m.h - 4, lx, m.y + m.h + 7], { fill: "#5e2d73", width: 3 });
    }
    for (const ex of [m.x + 14, m.x + 32]) {
      d.ov(ex - 6, m.y + 10, ex + 6, m.y + 22, { fill: "white", outline: "#5e2d73" });
      d.ov(ex - 2, m.y + 15, ex + 3, m.y + 20, { fill: "black" });
    }
    d.ln([m.x + 14, m.y + 30, m.x + 34, m.y + 30], { fill: "#3c1b4d", width: 2 });
  }

  // ---- Die Figur

  drawPlayer() {
    const f = this.facing;
    const cx = this.px + K.PLAYER_W / 2, base = this.py + K.PLAYER_H;
    let fxs, fys;
    if (this.squash > 0) {
      const t = this.squash / 8;
      fxs = 1 + 0.26 * t; fys = 1 - 0.26 * t;
    } else {
      let e = clamp(Math.abs(this.vy) / 20, 0, 1) * 0.16;
      if (this.rocketActive) e = 0.24;
      fxs = 1 - e * 0.8; fys = 1 + e;
    }
    if (this.rocketActive) this.drawStrappedRocket(cx, base, fys);

    const w = this.holeFx;
    if (w > 0.01) {
      const cy = base - 21 * fys;
      if (this.holeScale < 0.3) {
        this.drawHoleSpark(cx, cy);
        this.drawHoleDisk(cx, cy, w * 0.5, false);
      } else {
        this.drawHoleDisk(cx, cy, w, true);
        const sc = this.holeScale;
        const ang = this.frame * (0.06 + 0.30 * w) + (1 - sc) * 9;
        const c = this.ctx;
        c.save();
        c.translate(cx, cy); c.rotate(ang);
        c.scale((1 - 0.55 * w) * sc, (1 + 0.85 * w) * sc);
        c.translate(-cx, -cy);
        this.drawDoodler(cx, base, this.skin,
                         { f, fxs, fys, look: this.shootAnim / K.SHOOT_ANIM });
        c.restore();
        this.drawHoleDisk(cx, cy, w, false);
      }
    } else {
      this.drawDoodler(cx, base, this.skin,
        { f, fxs, fys, look: this.shootAnim / K.SHOOT_ANIM,
          moving: Math.abs(this.vy) > 1 });
    }
    if (this.shield > 0) this.drawShieldBubble(cx, base - 21 * fys);
  }

  drawHoleSpark(cx, cy) {
    const d = this.d;
    [[13, K.C_HOLE_RIM, "gray25"], [8, "#ffd166", "gray50"], [4, "#ffffff", null]]
      .forEach(([r, col, st], i) => {
        const rr = r + 2 * Math.sin(this.frame * 0.5 + i);
        d.ov(cx - rr, cy - rr, cx + rr, cy + rr, { fill: col, stipple: st });
      });
    d.ln([cx, cy + 4, cx, cy + 54], { fill: K.C_HOLE_RIM, width: 3 });
    d.ln([cx, cy + 4, cx, cy + 30], { fill: "#ffffff", width: 1 });
  }
  drawHoleDisk(cx, cy, w, back) {
    const d = this.d;
    if (back) {
      let r = 52 * w;
      d.ov(cx - r, cy - r, cx + r, cy + r, { fill: K.C_HOLE, stipple: "gray50" });
      r *= 0.62;
      d.ov(cx - r, cy - r, cx + r, cy + r, { fill: "#000000" });
    }
    for (let i = 0; i < 4; i++) {
      const rr = (30 + i * 10) * w;
      const a0 = -((this.frame * 3.4 + i * 47) % 360);
      d.arc(cx - rr * 1.8, cy - rr * 0.5, cx + rr * 1.8, cy + rr * 0.5,
            a0, back ? 150 : -150,
            { style: "arc", outline: mix(K.C_HOLE_RIM, "#ffffff", i * 0.22),
              width: Math.max(1, (4 - i * 0.7) * w) });
    }
  }
  drawShieldBubble(cx, cy) {
    if (this.shield < 90 && Math.floor(this.shield / 4) % 2 === 0) return;
    const d = this.d, ph = this.frame * 0.07;
    const r = 37 + 2 * Math.sin(ph * 2);
    d.ov(cx - r, cy - r, cx + r, cy + r,
         { fill: K.C_SHIELD, stipple: "gray12", outline: K.C_SHIELD, width: 2 });
    d.ov(cx - r + 4, cy - r + 4, cx + r - 4, cy + r - 4,
         { outline: mix(K.C_SHIELD, "#ffffff", 0.5), width: 1 });
    for (let i = 0; i < 3; i++) {
      const a = (ph * 1.4 + i * 2.1) * 180 / Math.PI % 360;
      d.arc(cx - r, cy - r, cx + r, cy + r, a, 34,
            { style: "arc", outline: "#ffffff", width: 2 });
    }
  }
  drawStrappedRocket(cx, base, fys) {
    const d = this.d, ph = this.frame * 0.5;
    [[64, K.C_ASTRAL, "gray25"], [46, K.C_ASTRAL_L, "gray25"], [30, "#ffffff", "gray50"]]
      .forEach(([g, col, st]) => {
        const gg = g + 7 * Math.sin(ph);
        d.ov(cx - gg, base - 34 - gg, cx + gg, base + gg * 0.5, { fill: col, stipple: st });
      });
    const top = base - 78 * fys;
    d.pg([cx, top, cx + 18, top + 34, cx + 18, base - 2, cx - 18, base - 2,
          cx - 18, top + 34], { fill: K.C_ROCKET, outline: K.C_ROCKET_D, width: 2 });
    d.pg([cx, top, cx + 4, top + 36, cx - 4, top + 36], { fill: K.C_ROCKET_L });
    d.pg([cx - 18, base - 26, cx - 32, base + 8, cx - 18, base - 2], { fill: K.C_ROCKET_D });
    d.pg([cx + 18, base - 26, cx + 32, base + 8, cx + 18, base - 2], { fill: K.C_ROCKET_D });
    [[28, 132, K.C_ASTRAL], [21, 108, "#ff8c42"], [14, 82, "#ffd166"], [7, 54, "#ffffff"]]
      .forEach(([w, ln, col], i) => {
        const j = ln * (0.78 + 0.22 * Math.sin(ph * 2.3 + i));
        d.pg([cx - w, base - 4, cx + w, base - 4, cx + w * 0.35, base + j * 0.55,
              cx, base + j, cx - w * 0.35, base + j * 0.55], { fill: col });
      });
  }
  miniPlanet(x, y, r, light, dark) {
    const d = this.d;
    d.arc(x - r * 2, y - r * 0.5, x + r * 2, y + r * 0.5, 0, 360,
          { style: "arc", outline: mix(light, "#ffffff", 0.4), width: 2 });
    d.ov(x - r, y - r, x + r, y + r, { fill: light, outline: dark, width: 1 });
    d.ov(x - r * 0.2, y - r * 0.55, x + r, y + r, { fill: dark, stipple: "gray50" });
    d.arc(x - r * 2, y - r * 0.5, x + r * 2, y + r * 0.5, 180, 180,
          { style: "arc", outline: mix(light, "#ffffff", 0.65), width: 2 });
  }
  orb(x, y, light, dark) {
    const d = this.d;
    d.ov(x - 7, y - 7, x + 7, y + 7, { fill: light, stipple: "gray50" });
    d.ov(x - 4, y - 4, x + 4, y + 4, { fill: light, outline: dark });
  }
  skinColors(sk) {
    if (sk.fx.includes("rainbow")) {
      const h = (this.frame * 0.006) % 1;
      return [hsvHex(h, 0.72, 1), hsvHex(h + 0.08, 0.35, 1), hsvHex(h, 0.95, 0.48)];
    }
    return [sk.body, sk.light, sk.dark];
  }

  drawDoodler(cx, base, sk, opt = {}) {
    const d = this.d;
    const f = opt.f ?? 1, fxs = opt.fxs ?? 1, fys = opt.fys ?? 1;
    const look = opt.look ?? 0, moving = opt.moving ?? false;
    const fx = sk.fx;
    const [body, light, dark] = this.skinColors(sk);
    const ph = this.frame * 0.06;
    const X = dx => cx + dx * fxs, Y = dy => base + dy * fys;
    const ov = (x0, y0, x1, y1, o) => d.ov(X(x0), Y(y0), X(x1), Y(y1), o);

    if (fx.includes("rays")) {
      for (let i = 0; i < 12; i++) {
        const a = ph * 0.5 + i * TAU / 12;
        const nx = Math.cos(a), ny = Math.sin(a);
        const r0 = 20, r1 = 46 + 10 * Math.sin(ph * 2 + i);
        const bx = -ny * 5.5, by = nx * 5.5;
        d.pg([X(nx * r0 + bx), Y(-21 + ny * r0 + by), X(nx * r0 - bx), Y(-21 + ny * r0 - by),
              X(nx * r1), Y(-21 + ny * r1)], { fill: light, stipple: "gray50" });
        d.pg([X(nx * r0 + bx * 0.4), Y(-21 + ny * r0 + by * 0.4),
              X(nx * r0 - bx * 0.4), Y(-21 + ny * r0 - by * 0.4),
              X(nx * r1 * 0.82), Y(-21 + ny * r1 * 0.82)], { fill: light });
      }
    }
    if (fx.includes("bigaura")) {
      [[50, dark, "gray12"], [41, body, "gray12"], [33, light, "gray25"],
       [25, body, "gray25"], [18, "#ffffff", "gray25"]].forEach(([g, col, st], i) => {
        const gg = g + 4 * Math.sin(ph * 1.3 + i * 0.7);
        ov(-gg, -21 - gg, gg, -21 + gg, { fill: col, stipple: st });
      });
    } else if (fx.includes("aura")) {
      [dark, body, light].forEach((col, i) => {
        const gg = [34, 26, 19][i] + 3 * Math.sin(ph + i);
        ov(-gg, -21 - gg, gg, -21 + gg, { fill: col, stipple: "gray25" });
      });
    }
    if (fx.includes("ring")) {
      for (const [r, w] of [[40, 3], [33, 2]]) {
        d.arc(X(-r), Y(-21 - r * 0.34), X(r), Y(-21 + r * 0.34), 0, 180,
              { style: "arc", outline: mix(sk.eye, "#ffffff", 0.3), width: w });
      }
    }
    if (fx.includes("trail") && moving) {
      ["gray12", "gray25"].forEach((st, i) => {
        const off = (i + 1) * 9;
        ov(-19, -38 + off, 19, -4 + off, { fill: body, stipple: st });
      });
    }
    const orbiters = front => {
      if (fx.includes("orbit")) {
        for (let i = 0; i < 3; i++) {
          const a = ph * 1.6 + i * TAU / 3;
          if ((Math.sin(a) >= 0) === front) {
            this.orb(X(Math.cos(a) * 30), Y(-21 + Math.sin(a) * 12), light, dark);
          }
        }
      }
      if (fx.includes("planet")) {
        const a = ph * 0.85;
        if ((Math.sin(a) >= 0) === front) {
          this.miniPlanet(X(Math.cos(a) * 34), Y(-21 + Math.sin(a) * 14), 8, light, dark);
        }
      }
      if (fx.includes("comet")) {
        const a = -ph * 1.25 + 1;
        if ((Math.sin(a) >= 0) === front) {
          for (let k = 0; k < 4; k++) {
            const b = a + 0.17 * (k + 1), r = 4.2 - k * 0.95;
            const tx = Math.cos(b) * 37, ty = -21 + Math.sin(b) * 15;
            ov(tx - r, ty - r, tx + r, ty + r,
               { fill: mix(light, "#ffffff", 0.45 - k * 0.1) });
          }
          const hx = Math.cos(a) * 37, hy = -21 + Math.sin(a) * 15;
          ov(hx - 4.5, hy - 4.5, hx + 4.5, hy + 4.5, { fill: "#ffffff" });
        }
      }
    };
    orbiters(false);

    for (const [lx, ly, fw] of [[-15, -2, 0], [13, -2, 0], [-19, 1, 1], [17, 1, 1]]) {
      const col = fw === 0 ? dark : mix(dark, body, 0.35);
      const ex = lx + (lx > 0 ? 2 : -2);
      d.ln([X(lx), Y(-10), X(ex), Y(ly)], { fill: col, width: 4, round: true });
      ov(ex - 4, ly - 3, ex + 4, ly + 3, { fill: col });
    }

    ov(-21, -40, 21, -2, { fill: body, outline: dark, width: 2 });
    if (fx.includes("bands")) {
      const n = 9;
      for (let i = 0; i < n; i++) {
        const y0 = -40 + 38 * i / n, y1 = -40 + 38 * (i + 1) / n;
        const t = Math.max(Math.abs((y0 + 21) / 19), Math.abs((y1 + 21) / 19));
        const hw = 21 * Math.sqrt(Math.max(0, 1 - t * t));
        if (hw < 1.5) continue;
        d.rc(X(-hw), Y(y0), X(hw), Y(y1),
             { fill: hsvHex(this.frame * 0.007 + i * 0.075, 0.8, 1) });
      }
      ov(-21, -40, 21, -2, { outline: dark, width: 2 });
    }
    if (fx.includes("galaxy")) {
      const gc = -14;
      for (const [r_, st] of [[17, "gray25"], [12, "gray25"], [7, "gray50"]]) {
        ov(-r_, gc - r_ * 0.75, r_, gc + r_ * 0.75, { fill: light, stipple: st });
      }
      for (const arm of [0, Math.PI]) {
        for (let i = 0; i < 16; i++) {
          const t = i / 15;
          const a = arm + t * 3.4 + ph * 0.55, r = 2 + t * 16;
          const gx = Math.cos(a) * r, gy = gc + Math.sin(a) * r * 0.78;
          const q = 2.7 - 2 * t;
          const col = t < 0.45 ? mix("#ffffff", "#9fd8ff", Math.min(1, t * 2.2))
                               : mix("#9fd8ff", "#ff8ad8", (t - 0.45) / 0.55);
          ov(gx - q, gy - q, gx + q, gy + q, { fill: col });
        }
      }
      for (const [r_, col] of [[8, mix(light, "#ffffff", 0.4)], [5, "#dff0ff"], [2.6, "#ffffff"]]) {
        ov(-r_, gc - r_ * 0.8, r_, gc + r_ * 0.8, { fill: col });
      }
      d.arc(X(-21), Y(-40), X(21), Y(-2), 95, 120,
            { style: "arc", outline: mix(light, "#ffffff", 0.55), width: 2 });
    }
    if (fx.includes("stars")) {
      for (let i = 0; i < 14; i++) {
        const a = i * 2.399 + ph * 0.15;
        const rr = 17 * Math.sqrt((i + 0.5) / 14);
        const sx = Math.cos(a) * rr, sy = -21 + Math.sin(a) * rr * 0.92;
        const tw = 0.5 + 0.5 * Math.sin(ph * 2.2 + i);
        const r = 0.9 + 1.1 * tw;
        ov(sx - r, sy - r, sx + r, sy + r,
           { fill: mix(body, "#ffffff", 0.35 + 0.65 * tw) });
      }
    } else if (!fx.includes("bands") && !fx.includes("galaxy")) {
      ov(-15, -36, 2, -22, { fill: light });
    }
    if (fx.includes("cracks")) {
      const glow = mix(light, "#ffffff", 0.3 + 0.3 * Math.sin(ph * 1.7));
      for (const [a, b_, cc] of [[[-12, -30], [-4, -22], [-9, -14]],
                                 [[6, -33], [11, -24], [5, -17]],
                                 [[-2, -12], [3, -8], [-1, -5]]]) {
        d.ln([X(a[0]), Y(a[1]), X(b_[0]), Y(b_[1]), X(cc[0]), Y(cc[1])],
             { fill: glow, width: 2, round: true, smooth: true });
      }
    }
    if (fx.includes("shards")) {
      for (const dx0 of [-13, 0, 12]) {
        d.pg([X(dx0 - 4), Y(-38), X(dx0), Y(-50), X(dx0 + 4), Y(-38)],
             { fill: light, outline: dark, width: 1 });
      }
    }
    if (fx.includes("bolt")) {
      d.pg([X(2), Y(-34), X(-7), Y(-20), X(-1), Y(-20), X(-5), Y(-7),
            X(8), Y(-23), X(1), Y(-23)],
           { fill: mix(light, "#ffffff", 0.5), outline: dark });
    }

    const { pts: spts, tip, nostril } = snoutPoints(look);
    const flat = [];
    for (const [dx, dy] of spts) flat.push(X(dx * f), Y(dy));
    const drawSnout = () => {
      d.pg(flat, { fill: body });
      d.ln(flat, { fill: dark, width: 2, round: true, smooth: true });
      ov(nostril[0] * f - 2, nostril[1] - 2, nostril[0] * f + 2, nostril[1] + 2,
         { fill: dark });
    };
    drawSnout();

    if (fx.includes("visor")) {
      const lens = mix(dark, "#000000", 0.45), by = -32;
      d.ln([X(-2), Y(by - 1), X(2), Y(by - 1)], { fill: dark, width: 3 });
      d.ln([X(-17), Y(by - 3), X(-11), Y(by - 2)], { fill: dark, width: 3 });
      d.ln([X(17), Y(by - 3), X(11), Y(by - 2)], { fill: dark, width: 3 });
      for (const dx of [-8, 8]) {
        ov(dx - 8, by - 7, dx + 8, by + 7,
           { fill: lens, outline: mix(light, "#ffffff", 0.35), width: 2 });
        d.ln([X(dx - 5), Y(by + 3), X(dx + 2), Y(by - 4)],
             { fill: mix(light, "#ffffff", 0.75), width: 2 });
        d.ln([X(dx + 1), Y(by + 4), X(dx + 4), Y(by + 1)],
             { fill: mix(light, "#ffffff", 0.45), width: 1 });
      }
    } else {
      for (const dx of [-8, 7]) {
        ov(dx - 8, -40, dx + 8, -24, { fill: "white", outline: dark, width: 2 });
        const px_ = dx + 3.2 * f * (1 - 0.75 * look);
        const py_ = -31.5 - 3 * look;
        ov(px_ - 3.4, py_ - 3.5, px_ + 3.4, py_ + 3.5, { fill: sk.eye });
        ov(px_ - 3, py_ - 3, px_ - 0.6, py_ - 0.5, { fill: "white" });
        d.arc(X(dx - 8), Y(-41), X(dx + 8), Y(-25), 20, 140,
              { style: "arc", outline: dark, width: 2 });
      }
    }
    if (look > 0.2) drawSnout();
    d.arc(X(-7), Y(-20), X(7), Y(-9), 200, 140,
          { style: "arc", outline: dark, width: 2 });

    if (fx.includes("cap")) {
      const capc = dark, capd = mix(dark, "#000000", 0.3);
      d.arc(X(-17), Y(-56), X(17), Y(-28), 0, 180,
            { style: "pieslice", fill: capc, outline: capd, width: 2 });
      d.pg([X(2 * f), Y(-46), X(28 * f), Y(-44), X(26 * f), Y(-38), X(2 * f), Y(-40)],
           { fill: capd });
      ov(-3, -60, 3, -54, { fill: capd });
    }
    if (fx.includes("crystal")) {
      [-15, -7.5, 0, 7.5, 15].forEach((dx0, i) => {
        const hgt = 13 + 8 * Math.abs(Math.sin(ph * 1.3 + i * 0.9));
        const col = hsvHex(this.frame * 0.009 + i * 0.13, 0.5, 1);
        d.pg([X(dx0 - 4.5), Y(-37), X(dx0 + 4.5), Y(-37), X(dx0 + 1), Y(-37 - hgt)],
             { fill: col, outline: "#ffffff", width: 1 });
        d.pg([X(dx0 - 4.5), Y(-37), X(dx0 - 1), Y(-37), X(dx0 + 1), Y(-37 - hgt)],
             { fill: mix(col, "#ffffff", 0.55) });
      });
    }
    if (fx.includes("crown")) {
      d.pg([X(-13), Y(-40), X(-13), Y(-53), X(-6), Y(-46), X(0), Y(-56),
            X(6), Y(-46), X(13), Y(-53), X(13), Y(-40)],
           { fill: "#ffd54a", outline: "#a87b10", width: 2 });
      for (const gx of [-9, 0, 9]) ov(gx - 2, -44, gx + 2, -40, { fill: "#ff5d7a" });
    }
    if (fx.includes("flames")) {
      [-11, 0, 11].forEach((dx0, i) => {
        const h = 16 + 7 * Math.sin(ph * 2.4 + i * 1.7);
        d.pg([X(dx0 - 6), Y(-38), X(dx0 + 6), Y(-38), X(dx0 + 1), Y(-38 - h)],
             { fill: mix("#ff8c42", light, 0.2) });
        d.pg([X(dx0 - 3), Y(-38), X(dx0 + 3), Y(-38), X(dx0), Y(-38 - h * 0.6)],
             { fill: "#fff3b0" });
      });
    }
    if (fx.includes("halo")) {
      const hy = -54 + 2 * Math.sin(ph);
      d.ov(X(-15), Y(hy - 4), X(15), Y(hy + 4),
           { outline: mix(light, "#ffffff", 0.5), width: 3 });
    }

    if (fx.includes("ring")) {
      for (const [r, w] of [[40, 3], [33, 2]]) {
        d.arc(X(-r), Y(-21 - r * 0.34), X(r), Y(-21 + r * 0.34), 180, 180,
              { style: "arc", outline: sk.eye, width: w });
      }
    }
    orbiters(true);
    if (fx.includes("glow")) {
      ov(-23, -42, 23, 0, { outline: mix(light, "#ffffff", 0.4), width: 2 });
    }
    if (fx.includes("sparkle")) {
      for (let i = 0; i < 4; i++) {
        const t = (ph * 0.6 + i * 0.25) % 1;
        if (t > 0.72) continue;
        const a = i * 1.9 + ph * 0.3, r = 24 + 10 * t;
        const sx = Math.cos(a) * r, sy = -21 + Math.sin(a) * r * 0.9;
        const q = (1 - t / 0.72) * 5;
        d.pg([X(sx), Y(sy - q), X(sx + q * 0.34), Y(sy - q * 0.34), X(sx + q), Y(sy),
              X(sx + q * 0.34), Y(sy + q * 0.34), X(sx), Y(sy + q),
              X(sx - q * 0.34), Y(sy + q * 0.34), X(sx - q), Y(sy),
              X(sx - q * 0.34), Y(sy - q * 0.34)], { fill: "#ffffff" });
      }
    }
    if (look > 0) {
      const tx = tip[0] * f, ty = tip[1];
      const burst = [];
      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI / 6 + 0.26;
        const r = (i % 2 === 0 ? 15 : 7) * (0.45 + 0.55 * look);
        burst.push(X(tx + Math.cos(a) * r), Y(ty + Math.sin(a) * r));
      }
      d.pg(burst, { fill: "#ffd166" });
      ov(tx - 4.5, ty - 4.5, tx + 4.5, ty + 4.5, { fill: "#fff8d6" });
    }
  }

  // -------------------------------------------------------- HUD und Menues

  coinChip(x, y, amount, size = 13) {
    const d = this.d, r = 7 * this.scale;
    const cx = this.toX(x), cy = this.toY(y);
    d.ov(cx - r, cy - r, cx + r, cy + r,
         { fill: "#f2c14e", outline: "#a87b10", width: Math.max(1, 2 * this.scale) });
    d.tx(cx, cy, "M", { size: this.fs(size - 3), fill: "#7d5a06" });
    d.tx(cx + r + 6 * this.scale, cy, String(amount),
         { anchor: "w", fill: "#ffe9a8", size: this.fs(size) });
  }

  drawHud() {
    const d = this.d;
    const bar = Math.max(44, 44 * this.scale);
    this.barH = bar;
    d.rc(0, 0, this.sw, bar, { fill: "#0b1030" });
    d.ln([0, bar, this.sw, bar],
         { fill: mix("#39407e", K.C_ASTRAL, this.rocketFx), width: 2 });
    d.tx(14, bar / 2, `Score  ${Math.floor(this.score)}`,
         { anchor: "w", size: this.fs(16), fill: K.C_TEXT });
    d.tx(this.sw / 2, bar / 2, `M ${this.coins}`,
         { size: this.fs(12), fill: "#f2c14e" });
    d.tx(this.sw - 54 * this.scale, bar / 2, `Best ${this.highscore}`,
         { anchor: "e", size: this.fs(12), fill: "#8b93c7" });
    // Menue-Knopf oben rechts
    const bx = this.sw - 24 * this.scale;
    for (let i = 0; i < 3; i++) {
      d.rc(bx - 9 * this.scale, bar / 2 - 7 * this.scale + i * 6 * this.scale,
           bx + 9 * this.scale, bar / 2 - 5 * this.scale + i * 6 * this.scale,
           { fill: "#c9d3f5" });
    }

    if (this.toast) {
      const [txt, sub, col, life] = this.toast;
      const t = Math.min(1, life / 30);
      const yy = bar + 40 * this.scale;
      d.rc(0, yy - 22 * this.scale, this.sw, yy + 26 * this.scale,
           { fill: "#0b1026", stipple: "gray50" });
      d.tx(this.sw / 2, yy - 4 * this.scale, txt,
           { size: this.fs(15), fill: mix("#ffffff", col, t) });
      d.tx(this.sw / 2, yy + 15 * this.scale, sub,
           { size: this.fs(10), fill: "#c9d3f5", bold: false });
    }

    if (this.rocketActive) {
      this.drawGauge(bar, 1 - this.rocketLeft / this.rocketTotal, "ASTRAL RAKETE",
                     K.C_ASTRAL, this.rocketTotal - this.rocketLeft, this.rocketTotal);
    } else if (this.holeActive || this.holeSuck > 0) {
      this.drawGauge(bar, 1 - this.holeLeft / this.holeTotal, "SCHWARZES LOCH",
                     K.C_HOLE_RIM, this.holeTotal - this.holeLeft, this.holeTotal);
    } else if (this.rocketFlash > 0) {
      const t = this.rocketFlash / 55;
      d.tx(this.sw / 2, bar + this.fs(30), "ASTRAL RAKETE",
           { size: this.fs(26 + Math.floor(10 * t)), fill: mix("#ffffff", K.C_ASTRAL, t) });
    } else if (this.itemFlash) {
      const [life, label, col] = this.itemFlash;
      const t = life / 55;
      d.tx(this.sw / 2, bar + this.fs(30), label,
           { size: this.fs(22 + Math.floor(8 * t)), fill: mix("#ffffff", col, t) });
    }
    if (this.shield > 0) this.drawShieldChip(bar);
  }

  drawGauge(bar, done, label, col, got, total) {
    const d = this.d;
    const w = Math.min(this.sw - 40, 360 * this.scale);
    const x0 = (this.sw - w) / 2, y0 = bar + 14 * this.scale;
    const h = Math.max(14, 20 * this.scale);
    const pulse = 0.5 + 0.5 * Math.sin(this.frame * 0.25);
    const dark = mix(col, "#000000", 0.72);
    d.rc(x0 - 4, y0 - 4, x0 + w + 4, y0 + h + 4,
         { fill: mix(dark, col, 0.25 * pulse), outline: mix(col, "#ffffff", 0.4),
           width: Math.max(1, 2 * this.scale) });
    d.rc(x0, y0, x0 + w, y0 + h, { fill: "#120a26" });
    const fw = Math.max(0, w * clamp(done, 0, 1));
    for (let i = 0; i * 26 < fw; i++) {
      const sx = x0 + i * 26, ex = Math.min(sx + 23, x0 + fw);
      if (ex <= sx) break;
      d.rc(sx + 2, y0 + 2, ex, y0 + h - 2, { fill: mix(col, "#ffffff", 0.35 * pulse) });
    }
    d.tx(this.sw / 2, y0 + h / 2, `${Math.floor(done * 100)} %`,
         { size: this.fs(12), fill: "#ffffff" });
    d.tx(this.sw / 2, y0 + h + this.fs(16),
         `${label}   +${Math.floor(got)} / ${Math.floor(total)}`,
         { size: this.fs(14), fill: mix(col, "#ffffff", pulse) });
  }
  drawShieldChip(bar) {
    const d = this.d, secs = this.shield / K.FPS;
    const w = 104 * this.scale, h = 26 * this.scale;
    const x0 = this.sw / 2 - w / 2;
    let y0 = bar + 8 * this.scale;
    if (this.rocketActive || this.holeActive || this.holeSuck > 0) y0 = bar + 74 * this.scale;
    d.rc(x0, y0, x0 + w, y0 + h,
         { fill: "#07222b", outline: K.C_SHIELD, width: Math.max(1, 2 * this.scale) });
    const fw = (w - 6) * clamp(secs / K.SHIELD_TIME, 0, 1);
    d.rc(x0 + 3, y0 + h - 6 * this.scale, x0 + 3 + fw, y0 + h - 3 * this.scale,
         { fill: K.C_SHIELD });
    d.tx(x0 + w / 2, y0 + h / 2 - 2 * this.scale, `SCHILD  ${secs.toFixed(1)} s`,
         { size: this.fs(11), fill: K.C_SHIELD });
  }
  overlay(title, subtitle) {
    const d = this.d;
    d.rc(0, 0, this.sw, this.sh, { fill: "#0b1b2b", stipple: "gray50" });
    d.tx(this.sw / 2, this.sh / 2 - 40 * this.scale, title,
         { size: this.fs(34), fill: "white" });
    d.tx(this.sw / 2, this.sh / 2 + 46 * this.scale, subtitle,
         { size: this.fs(14), fill: "#dbe7f3", bold: false });
  }

  // ---- Startmenue

  drawMainMenu() {
    const d = this.d;
    d.rc(0, 0, this.sw, this.sh, { fill: "#050817", stipple: "gray50" });
    const t = this.frame * 0.045;
    this.vtext(K.WIDTH / 2, 84, "DOODLE", 42, "#ffffff");
    this.vtext(K.WIDTH / 2, 130, "JUMP", 42, K.C_ASTRAL_L);
    this.vtext(K.WIDTH / 2, 162, "ins Weltall", 12, "#8b93c7", false);
    const bob = Math.sin(t * 1.6) * 9;
    this.drawDoodler(this.toX(K.WIDTH / 2), this.toY(250 + bob), this.skin,
                     { fxs: 1.35 * this.scale, fys: 1.35 * this.scale });
    const st = this.stars(this.skinKey);
    this.vtext(K.WIDTH / 2, 272, this.skin.name + (st ? `   ${st}*` : ""), 11,
               K.RARITY[this.skin.rarity][1]);
    MENU_ITEMS.forEach(([key, text], i) => {
      if (key === "play" && this.runActive && !this.gameOver) text = "WEITER";
      if (key === "tilt") text = `NEIGUNG: ${this.tiltOn ? "AN" : "AUS"}`;
      this.drawMenuButton(316 + i * 52, text, i === this.menuCursor);
    });
    this.vtext(K.WIDTH / 2, 640 - 54, `Bestleistung   ${this.highscore}`, 12, "#c9d3f5");
    this.coinChip(K.WIDTH / 2 - 34, 640 - 33, this.coins, 12);
    this.vtext(K.WIDTH / 2, 640 - 13,
               "Tippen zum Waehlen   -   ziehen lenkt, tippen schiesst",
               9, "#6a7398", false);
  }
  drawMenuButton(y, text, selected) {
    const w = 232, x0 = (K.WIDTH - w) / 2;
    const pulse = 0.5 + 0.5 * Math.sin(this.frame * 0.12);
    if (selected) {
      this.panel(x0 - 4, y - 22, x0 + w + 4, y + 22,
                 mix("#1b2246", K.C_ASTRAL, 0.30 + 0.18 * pulse),
                 mix(K.C_ASTRAL_L, "#ffffff", pulse), 2);
      this.vtext(x0 + 16, y, ">", 15, "#ffffff", true, "w");
      this.vtext(x0 + w - 16, y, "<", 15, "#ffffff", true, "e");
    } else {
      this.panel(x0, y - 19, x0 + w, y + 19, "#101838", "#2a3255", 1);
    }
