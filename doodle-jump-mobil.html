      c.restore();
    } else {
      this.drawHud();
      if (this.paused) this.overlay("PAUSE", "Tippen = weiter");
      else if (this.gameOver) this.drawSummary();
    }
    if (this.showFps) {
      d.tx(8, this.sh - 10, `${this.fps.toFixed(0)} FPS`,
           { size: this.fs(10), fill: "#5a6390", anchor: "w" });
    }
  }

  fs(size) { return Math.max(7, Math.round(size * this.scale)); }
  toX(x) { return this.ox + x * this.scale; }   // virtuell -> Bildschirm
  toY(y) { return this.oy + y * this.scale; }
  rrect(x0, y0, x1, y1, r, { fill = "", outline = "", width = 1.5,
                             stipple = null } = {}) {
    // Abgerundetes Rechteck als EIN Polygon - sonst verdoppelt sich das
    // Stipple-Muster an den Ecken.
    const d = this.d, X = v => this.toX(v), Y = v => this.toY(v);
    if (fill) {
      const pts = [];
      for (const [cx, cy, a0] of [[x1 - r, y0 + r, -90], [x1 - r, y1 - r, 0],
                                  [x0 + r, y1 - r, 90], [x0 + r, y0 + r, 180]]) {
        for (let k = 0; k < 7; k++) {
          const a = (a0 + k * 15) * Math.PI / 180;
          pts.push(X(cx + Math.cos(a) * r), Y(cy + Math.sin(a) * r));
        }
      }
      d.pg(pts, { fill, stipple });
    }
    if (outline) {
      const w = Math.max(1, width * this.scale);
      for (const [a, b] of [[[x0 + r, y0], [x1 - r, y0]], [[x0 + r, y1], [x1 - r, y1]],
                            [[x0, y0 + r], [x0, y1 - r]], [[x1, y0 + r], [x1, y1 - r]]]) {
        d.ln([X(a[0]), Y(a[1]), X(b[0]), Y(b[1])], { fill: outline, width: w });
      }
      for (const [[cx, cy], st] of [[[x0 + r, y0 + r], 90], [[x1 - r, y0 + r], 0],
                                    [[x1 - r, y1 - r], 270], [[x0 + r, y1 - r], 180]]) {
        d.arc(X(cx - r), Y(cy - r), X(cx + r), Y(cy + r), st, 90,
              { style: "arc", outline, width: w });
      }
    }
  }
  // Tuerkiser Schein um das gewaehlte Feld: Ringe nach aussen, satte Fuellung
  glowRect(x0, y0, x1, y1, r, pulse = 1, col = C_GLOW) {
    ["gray12", "gray25", "gray50"].forEach((sp, i) => {
      const g = (3 - i) * 3 * pulse;
      this.rrect(x0 - g, y0 - g, x1 + g, y1 + g, r + g,
                 { fill: col, stipple: sp });
    });
    this.rrect(x0, y0, x1, y1, r, { fill: mix(C_CARD, col, 0.30) });
    this.rrect(x0, y0, x1, y1, r, { outline: col, width: 1.6 });
  }
  chevron(x, y, col, size = 5) {
    this.d.ln([this.toX(x - size * 0.5), this.toY(y - size),
               this.toX(x + size * 0.5), this.toY(y),
               this.toX(x - size * 0.5), this.toY(y + size)],
              { fill: col, width: Math.max(1, 2 * this.scale), round: true });
  }

  panel(x0, y0, x1, y1, fill, outline = "", width = 2) {
    this.d.rc(this.toX(x0), this.toY(y0), this.toX(x1), this.toY(y1),
              { fill, outline, width: Math.max(1, width * this.scale) });
  }
  vtext(x, y, text, size = 12, fill = "#fff", bold = true, anchor = "center") {
    this.d.tx(this.toX(x), this.toY(y), text,
              { size: this.fs(size), fill, bold, anchor });
  }

  drawLetterbox() {
    const d = this.d;
    const x0 = this.ox, y0 = this.oy;
    const x1 = this.ox + K.WIDTH * this.scale, y1 = this.oy + K.HEIGHT * this.scale;
    if (x0 > 0) {
      d.rc(-1, -1, x0, this.sh + 1, { fill: K.C_LETTERBOX });
      d.rc(x1, -1, this.sw + 1, this.sh + 1, { fill: K.C_LETTERBOX });
    }
    if (y0 > 0) {
      d.rc(-1, -1, this.sw + 1, y0, { fill: K.C_LETTERBOX });
      d.rc(-1, y1, this.sw + 1, this.sh + 1, { fill: K.C_LETTERBOX });
    }
    if (x0 > 0 || y0 > 0) {
      d.rc(x0, y0, x1, y1, { outline: mix("#2b435c", K.C_ASTRAL, this.rocketFx),
                             width: 2 + 3 * this.rocketFx });
    }
  }

  drawWorld() {
    const d = this.d;
    const fx = this.rocketFx;
    this.drawSpace();
    const bot = this._skyBot;
    const lfx = Math.max(fx, this.holeStreak ? this.holeFx : 0);
    for (const st of this.speedlines) {
      d.ln([st[0], st[1], st[0], st[1] + st[2]],
           { fill: mix(bot, "#ffffff", 0.35 + 0.65 * lfx), width: 1 + 2 * lfx });
    }
    // Was ausserhalb des Bildes liegt, muss nicht gezeichnet werden
    const oben = -90, unten = K.HEIGHT + 90;
    for (const r of this.rings) this.drawRing(r);
    for (const p of this.platforms) {
      if (p.y > oben && p.y < unten) this.drawPlatform(p);
    }
    for (const it of this.items) {
      if (it.y > oben && it.y < unten) this.drawItem(it);
    }
    for (const m of this.monsters) {
      if (m.y > oben && m.y < unten) this.drawMonster(m);
    }
    for (const b of this.bullets) {
      d.ov(b.x - 5, b.y - 5, b.x + 5, b.y + 5,
           { fill: "#ffffff", outline: "#7a8a99", width: 2 });
    }
    for (const q of this.particles) {
      const s = Math.max(1.5, q[4] / 6);
      d.ov(q[0] - s, q[1] - s, q[0] + s, q[1] + s, { fill: q[5] });
    }
    this.drawComet();
    this.drawRecordLine();
    this.drawMonsterWarnings();
    this.drawPlayer();
    if (this.flash > 0) {
      const lv = Math.min(3, Math.floor((11 - this.flash) / 3));
      d.rc(-K.BG_MARGIN, -K.BG_MARGIN, K.WIDTH + K.BG_MARGIN, K.HEIGHT + K.BG_MARGIN,
           { fill: "#ffffff", stipple: ["gray75", "gray50", "gray25", "gray12"][lv] });
    }
  }

  // Die eigene Bestmarke als gestrichelte Linie im Bild
  drawRecordLine() {
    if (this.record <= 0 || this.recordHit || this.gameOver) return;
    const fehlt = this.record - this.score;
    if (fehlt > K.RECORD_SHOW) return;
    const y = this.yOfScore(this.record);
    if (y < 58) { this.recordNear = Math.round(fehlt); return; }
    if (y > K.HEIGHT + 20) return;
    this.recordNear = 0;
    const nah = Math.max(0, 1 - fehlt / K.RECORD_SHOW);
    const col = mix("#6a7398", "#ffd54a", 0.35 + 0.65 * nah);
    for (let x = 0; x < K.WIDTH; x += 16) {
      this.d.ln([x, y, x + 9, y], { fill: col, width: 2 });
    }
    this.vtext(K.WIDTH - 16, y - 11, `BEST ${this.record}`, 10, col, true, "e");
  }

  drawComet() {
    if (!this.comet) return;
    const d = this.d;
    const [x, y, vx, vy] = this.comet;
    const n = Math.hypot(vx, vy) || 1;
    const nx = -vx / n, ny = -vy / n;
    const schweif = 54;
    [[1, "gray25"], [0.62, "gray50"], [0.3, null]].forEach(([f, stip]) => {
      const r = 15 * (0.5 + 0.5 * f);
      d.pg([x + ny * r * 0.5, y - nx * r * 0.5,
            x - ny * r * 0.5, y + nx * r * 0.5,
            x + nx * schweif * f, y + ny * schweif * f],
           { fill: K.C_COMET, stipple: stip });
    });
    const puls = 1 + 0.12 * Math.sin(this.frame * 0.3);
    d.ov(x - 15 * puls, y - 15 * puls, x + 15 * puls, y + 15 * puls,
         { fill: "#fff3b0", outline: K.C_COMET, width: 2 });
    d.ov(x - 7, y - 7, x + 7, y + 7, { fill: "#ffffff" });
  }

  // Das Spiel misst seine Bildzeit und nimmt Zierrat heraus, wenn das
  // Geraet nicht mitkommt - lieber weniger Sterne als Ruckeln.
  regelDetail(dtMs) {
    if (!(dtMs > 0 && dtMs < 500)) return;
    this.frameMs = 0.9 * (this.frameMs || 16.7) + 0.1 * dtMs;
    if (this.frameMs > K.DETAIL_DOWN) {
      this.detail = Math.max(K.DETAIL_MIN, this.detail - K.DETAIL_RATE);
    } else if (this.frameMs < K.DETAIL_UP && this.detail < 1) {
      this.detail = Math.min(1, this.detail + K.DETAIL_RATE * 0.3);
    }
  }

  drawSpace() {
    const d = this.d;
    const [top, bot] = this.skyColors();
    this._skyBot = bot;
    const m = K.BG_MARGIN, span = K.HEIGHT + 2 * m;
    const grad = this.ctx.createLinearGradient(0, -m, 0, -m + span);
    grad.addColorStop(0, top); grad.addColorStop(1, bot);
    this.ctx.fillStyle = grad;
    this.ctx.fillRect(-m, -m, K.WIDTH + 2 * m, span);

    for (let [nx, ny, nr, ncol] of this.bgNebulae) {
      if (this.holeFx > 0.01) ncol = mix(ncol, bot, 0.85 * this.holeFx);
      for (const [f, st] of [[1, "gray12"], [0.87, "gray12"], [0.74, "gray12"],
                             [0.61, "gray12"], [0.48, "gray12"], [0.35, "gray25"],
                             [0.20, "gray25"]]) {
        const r = nr * f;
        d.ov(nx - r, ny - r * 0.66, nx + r, ny + r * 0.66, { fill: ncol, stipple: st });
      }
    }
    if (this.bgPlanet) this.drawPlanet(...this.bgPlanet);

    const sichtbar = this.detail >= 1 ? this.bgStars
      : this.bgStars.slice(0, Math.round(this.bgStars.length * this.detail));
    for (const [x, y, r, br, ph] of sichtbar) {
      const tw = br * (0.68 + 0.32 * Math.sin(this.frame * 0.05 + ph));
      const col = mix(bot, "#ffffff", clamp(0.35 + 0.65 * tw, 0, 1));
      d.ov(x - r, y - r, x + r, y + r, { fill: col });
      if (r > 1.45 && tw > 0.72) {
        const g = r * (2.4 + 1.4 * tw), q = r * 0.42;
        d.pg([x, y - g, x + q, y - q, x + g, y, x + q, y + q,
              x, y + g, x - q, y + q, x - g, y, x - q, y - q],
             { fill: mix(bot, col, 0.75) });
      }
    }
    for (const [sx, sy, dx, dy, life] of this.shooting) {
      const n = Math.hypot(dx, dy) || 1;
      const ln = 34 * Math.min(1, life / 26);
      d.ln([sx, sy, sx - dx / n * ln, sy - dy / n * ln],
           { fill: mix(bot, "#dfe9ff", 0.85), width: 2 });
      d.ov(sx - 1.8, sy - 1.8, sx + 1.8, sy + 1.8, { fill: "#ffffff" });
    }
  }

  drawPlanet(x, y, r, col, shade, ring) {
    const d = this.d;
    if (ring) {
      d.arc(x - r * 1.9, y - r * 0.52, x + r * 1.9, y + r * 0.52, 0, 360,
            { style: "arc", outline: mix(col, "#ffffff", 0.35),
              width: Math.max(2, r * 0.10) });
    }
    d.ov(x - r, y - r, x + r, y + r, { fill: col });
    d.ov(x - r * 0.96, y - r * 0.9, x + r * 0.5, y + r * 0.6,
         { fill: mix(col, "#ffffff", 0.18) });
    d.ov(x - r * 0.2, y - r * 0.55, x + r, y + r, { fill: shade, stipple: "gray50" });
    for (let i = 0; i < 3; i++) {
      const ry = y - r * 0.45 + i * r * 0.45, rw = r * (0.72 - 0.12 * i);
      d.ov(x - rw, ry - r * 0.09, x - rw + r * 0.7, ry + r * 0.09,
           { fill: mix(col, shade, 0.55) });
    }
    if (ring) {
      d.arc(x - r * 1.9, y - r * 0.52, x + r * 1.9, y + r * 0.52, 180, 180,
            { style: "arc", outline: mix(col, "#ffffff", 0.5),
              width: Math.max(2, r * 0.10) });
    }
  }

  drawRing(r) {
    const t = r.r / r.rmax;
    this.d.ov(r.x - r.r, r.y - r.r * 0.72, r.x + r.r, r.y + r.r * 0.72,
              { outline: mix(r.color, this._skyBot, t),
                width: Math.max(1, r.width * (1 - t)) });
  }

  drawPlatform(p) {
    // Fliegende Untertassen. Das Landedeck liegt flach auf p.y - genau dort
    // setzt die Figur auf; Kuppel, Lichter und Duesen haengen darunter.
    const d = this.d;
    let top, bot;
    if (p.kind === "moving") [top, bot] = [K.C_BLUE, K.C_BLUE_D];
    else if (p.kind === "breakable") [top, bot] = [K.C_BROWN, K.C_BROWN_D];
    else if (p.kind === "vanish") [top, bot] = [K.C_WHITE, K.C_WHITE_D];
    else [top, bot] = [K.C_GREEN, K.C_GREEN_D];
    const light = mix(top, "#ffffff", 0.55), dark = mix(bot, "#000000", 0.35);
    const x0 = p.x, x1 = p.x + K.PLAT_W;
    const cx = p.x + K.PLAT_W / 2, y = p.y;
    const ph = this.frame * 0.08 + p.x * 0.05;

    if (p.spring) {
      const sx = cx - 7, sy = y - 12;
      d.rc(sx, sy, sx + 14, y, { fill: "#d9d9d9", outline: "#6b6b6b" });
      d.ln([sx, sy + 4, sx + 14, sy + 8], { fill: "#6b6b6b", width: 2 });
      d.ln([sx, sy + 8, sx + 14, sy + 12], { fill: "#6b6b6b", width: 2 });
    }
    if (p.kind !== "breakable") {
      const gl = 15 + 3 * Math.sin(ph);
      d.ov(cx - gl * 2.1, y + K.PLAT_H - 2, cx + gl * 2.1, y + K.PLAT_H + gl,
           { fill: top, stipple: "gray12" });
    }
    d.ov(x0 - 1, y + 5, x1 + 1, y + K.PLAT_H + 9, { fill: bot, outline: dark });
    d.arc(x0 - 1, y + 5, x1 + 1, y + K.PLAT_H + 9, 200, 140,
          { style: "arc", outline: dark, width: 2 });

    const deck = [x0 + 5, y + 3, x0 + 15, y, x1 - 15, y, x1 - 5, y + 3,
                  x1, y + 8, x1 - 12, y + 12, x0 + 12, y + 12, x0, y + 8];
    d.pg(deck, { fill: top, outline: dark, width: 2 });
    d.ln([x0 + 15, y + 1, x1 - 15, y + 1], { fill: light, width: 2 });

    const dx = x0 + 13;
    d.arc(dx - 9, y - 3, dx + 9, y + 11, 0, 180,
          { style: "pieslice", fill: mix(light, "#ffffff", 0.35),
            outline: dark, width: 1 });
    d.arc(dx - 5, y - 1, dx + 4, y + 8, 25, 110,
          { style: "arc", outline: "#ffffff", width: 2 });

    [-16, 0, 16].forEach((ox, i) => {
      const on = Math.sin(ph * 1.6 + i * 2.1) > -0.2;
      const r = on ? 2.6 : 1.8;
      d.ov(cx + ox - r, y + K.PLAT_H + 1 - r, cx + ox + r, y + K.PLAT_H + 1 + r,
           { fill: on ? light : dark });
    });

    if (p.kind === "moving") {
      const side = p.dx > 0 ? 1 : -1;
      const bx = cx - side * (K.PLAT_W / 2 + 2);
      const fl = 7 + 4 * Math.abs(Math.sin(ph * 2.2));
      d.pg([bx, y + 6, bx, y + 12, bx - side * fl, y + 9], { fill: "#ffd166" });
      d.pg([bx, y + 7.5, bx, y + 10.5, bx - side * fl * 0.55, y + 9],
           { fill: "#ffffff" });
    } else if (p.kind === "breakable") {
      d.ln([cx + 4, y, cx - 2, y + 12], { fill: dark, width: 2 });
      d.ln([cx - 14, y + 2, cx - 10, y + 12], { fill: dark, width: 1 });
      d.ln([cx + 16, y + 1, cx + 12, y + 12], { fill: dark, width: 1 });
      if ((Math.floor(this.frame / 7) + Math.floor(p.x)) % 5 === 0) {
        d.ov(cx + 18, y + 9, cx + 22, y + 13, { fill: "#ffd166" });
      }
    } else if (p.kind === "vanish") {
      for (let i = 0; i < 3; i++) {
        const rr = K.PLAT_W / 2 + 4 + i * 5;
        d.arc(cx - rr, y - 4 + i * 2, cx + rr, y + K.PLAT_H + 8 + i * 2, 205, 130,
              { style: "arc", outline: mix(top, K.C_ASTRAL_L, 0.3 + 0.2 * i),
                width: 1 });
      }
      if (Math.floor(this.frame / 6) % 4 === 0) {
        d.pg(deck, { fill: "#ffffff", stipple: "gray50" });
      }
    } else {
      const ax = x1 - 13;
      d.ln([ax, y + 1, ax + 3, y - 8], { fill: dark, width: 2 });
      const blink = Math.sin(ph * 2.4) > 0 ? "#ff5d5d" : dark;
      d.ov(ax + 1, y - 11, ax + 6, y - 6, { fill: blink });
    }
  }

  drawItem(it) {
    if (it.kind === "rocket") this.drawItemRocket(it);
    else if (it.kind === "shield") this.drawItemShield(it);
    else this.drawItemHole(it);
  }
  drawItemShield(it) {
    const d = this.d;
    const { x, y, w, h } = it, cx = x + w / 2, cy = y + h / 2;
    const pulse = 0.5 + 0.5 * Math.sin(it.phase * 1.7);
    [[20, K.C_SHIELD_D, "gray12"], [13, K.C_SHIELD, "gray25"], [7, "#ffffff", "gray50"]]
      .forEach(([gl, col, st]) => {
        const g = gl + 4 * pulse;
        d.ov(cx - g, cy - g * 1.1, cx + g, cy + g * 1.1, { fill: col, stipple: st });
      });
    d.pg([cx - w / 2, y + 4, cx, y, cx + w / 2, y + 4,
          cx + w / 2, y + h * 0.52, cx, y + h, cx - w / 2, y + h * 0.52],
         { fill: K.C_SHIELD, outline: K.C_SHIELD_D, width: 2 });
    d.pg([cx - w / 2 + 4, y + 7, cx, y + 4, cx, y + h - 6, cx - w / 2 + 4, y + h * 0.5],
         { fill: mix(K.C_SHIELD, "#ffffff", 0.55) });
    d.ln([cx - 6, cy, cx - 1, cy + 6, cx + 7, cy - 7],
         { fill: "#0b3a49", width: 3, round: true });
  }
  drawItemHole(it) {
    const d = this.d;
    const cx = it.x + it.w / 2, cy = it.y + it.h / 2, r = it.w / 2;
    [[22, "gray12"], [15, "gray25"]].forEach(([g, st], i) => {
      const gg = g + 3 * Math.sin(it.phase * 1.6 + i);
      d.ov(cx - gg, cy - gg, cx + gg, cy + gg, { fill: K.C_HOLE_RIM, stipple: st });
    });
    for (let i = 0; i < 3; i++) {
      const a = -it.phase * 2 - i * 2.1;
      const rr = r + 9 + 5 * Math.sin(it.phase * 1.3 + i);
      d.arc(cx - rr * 1.55, cy - rr * 0.5, cx + rr * 1.55, cy + rr * 0.5,
            a * 180 / Math.PI, 150,
            { style: "arc", outline: mix(K.C_HOLE_RIM, "#ffffff", i * 0.3),
              width: 3 - i * 0.6 });
    }
    d.ov(cx - r, cy - r, cx + r, cy + r, { fill: K.C_HOLE, outline: K.C_HOLE_RIM, width: 2 });
    d.ov(cx - r * 0.62, cy - r * 0.62, cx + r * 0.62, cy + r * 0.62, { fill: "#000000" });
  }
  drawItemRocket(rk) {
    const d = this.d;
    const { x, y, w, h } = rk, cx = x + w / 2, cy = y + h / 2;
    const pulse = 0.5 + 0.5 * Math.sin(rk.phase * 1.7);
    [[22, K.C_ASTRAL, "gray12"], [14, K.C_ASTRAL_L, "gray25"], [8, "#ffffff", "gray50"]]
      .forEach(([gl, col, st]) => {
        const g = gl + 4 * pulse;
        d.ov(cx - g, cy - g * 1.15, cx + g, cy + g * 1.15, { fill: col, stipple: st });
      });
    for (let i = 0; i < 6; i++) {
      const a = rk.phase * 1.3 + i * TAU / 6;
      const sx = cx + Math.cos(a) * 22, sy = cy + Math.sin(a) * 15;
      const s = 2.2 + 1.2 * Math.sin(rk.phase * 3 + i);
      d.ov(sx - s, sy - s, sx + s, sy + s, { fill: K.C_ASTRAL_L });
    }
    d.pg([cx, y, x + w, y + h * 0.42, x + w, y + h * 0.82, x, y + h * 0.82, x, y + h * 0.42],
         { fill: K.C_ROCKET, outline: K.C_ROCKET_D, width: 2 });
    d.pg([cx, y, cx + 3, y + h * 0.45, cx - 3, y + h * 0.45], { fill: K.C_ROCKET_L });
    d.pg([x, y + h * 0.6, x - 8, y + h * 0.95, x, y + h * 0.82], { fill: K.C_ROCKET_D });
    d.pg([x + w, y + h * 0.6, x + w + 8, y + h * 0.95, x + w, y + h * 0.82],
         { fill: K.C_ROCKET_D });
    d.ov(cx - 5, y + h * 0.38, cx + 5, y + h * 0.62,
         { fill: "#bfe9ff", outline: K.C_ROCKET_D, width: 2 });
    const fl = 8 + 6 * pulse;
    d.pg([cx - 7, y + h * 0.82, cx + 7, y + h * 0.82, cx, y + h * 0.82 + fl],
         { fill: "#ff8c42" });
    d.pg([cx - 3.5, y + h * 0.82, cx + 3.5, y + h * 0.82, cx, y + h * 0.82 + fl * 0.6],
         { fill: "#fff3b0" });
  }

  drawMonsterWarnings() {
    // Monster, die gleich von oben ins Bild kommen, kuendigen sich an
    const d = this.d;
    for (const m of this.monsters) {
      const above = -(m.y + m.h);
      if (above <= 0 || above > K.MONSTER_WARN_DIST) continue;
      const t = 1 - above / K.MONSTER_WARN_DIST;
      const col = m.kind === "thanos" ? K.C_TITAN : K.C_MOB;
      const x = clamp(m.cx, 16, K.WIDTH - 16);
      const barV = Math.max(44 / Math.max(this.scale, 0.01), 44);
      const y = barV + 12 + 5 * (1 - t);
      const blink = 0.55 + 0.45 * Math.sin(this.frame * (0.18 + 0.22 * t));
      const w = 9 + 5 * t;
      d.pg([x - w, y, x + w, y, x, y + 9 + 5 * t],
           { fill: mix(col, "#ffffff", 0.35 * blink), outline: "#0a0a14", width: 1 });
      const r = 3.5 + 2 * t;
      d.ov(x - r, y - r - 3, x + r, y + r - 3, { fill: col, outline: "#0a0a14" });
    }
  }

  drawMonster(m) {
    const d = this.d;
    const titan = m.kind === "thanos";
    const body = titan ? K.C_TITAN : K.C_MOB;
    const dark = titan ? K.C_TITAN_D : K.C_MOB_D;
    const light = titan ? K.C_TITAN_L : K.C_MOB_L;
    const cx = m.cx, cy = m.cy, rx = m.w / 2, ry = m.h / 2;
    const ph = m.phase, bob = Math.sin(ph * 1.6) * 1.5;

    for (const g of [1.42, 1.26]) {            // Schattenriss
      d.ov(cx - rx * g, cy - ry * g + bob, cx + rx * g, cy + ry * g + bob,
           { fill: "#05060f", stipple: "gray50" });
    }
    const pulse = 0.5 + 0.5 * Math.sin(ph * 2.6);
    [[1.30, body, "gray25"], [1.14, light, "gray50"]].forEach(([g, col, st]) => {
      const gg = g + 0.05 * pulse;
      d.ov(cx - rx * gg, cy - ry * gg + bob, cx + rx * gg, cy + ry * gg + bob,
           { fill: col, stipple: st });
    });
    for (let i = 0; i < 4; i++) {              // Tentakel
      const tx = cx - rx * 0.66 + i * rx * 0.44;
      const sw = Math.sin(ph * 2.2 + i * 1.3) * 4;
      const ty = cy + ry * 0.8 + bob;
      d.ln([tx, ty, tx + sw * 0.5, ty + ry * 0.45, tx + sw, ty + ry * 0.8],
           { fill: dark, width: 4, round: true, smooth: true });
      d.ov(tx + sw - 3, ty + ry * 0.8 - 3, tx + sw + 3, ty + ry * 0.8 + 3,
           { fill: light });
    }
    d.ov(cx - rx, cy - ry + bob, cx + rx, cy + ry + bob,
         { fill: body, outline: "#0a0a14", width: 3 });
    d.arc(cx - rx * 0.97, cy - ry * 0.97 + bob, cx + rx * 0.97, cy + ry * 0.97 + bob,
          55, 150, { style: "arc", outline: mix(light, "#ffffff", 0.45), width: 2 });
    d.ov(cx - rx * 0.72, cy - ry * 0.82 + bob, cx - rx * 0.05, cy - ry * 0.18 + bob,
         { fill: mix(body, "#ffffff", 0.28) });
    for (let i = 0; i < 5; i++) {              // Sternenflecken
      const a = i * 2.399 + ph * 0.3;
      const rr = 0.62 * Math.sqrt((i + 0.5) / 5);
      const sx = cx + Math.cos(a) * rx * rr, sy = cy + Math.sin(a) * ry * rr + bob;
      const q = 1.1 + 0.7 * Math.sin(ph * 2.4 + i);
      d.ov(sx - q, sy - q, sx + q, sy + q, { fill: mix(body, "#ffffff", 0.55) });
    }

    let eyeY, eyeDx, eyeR;
    if (titan) {
      const hw = Math.max(3, rx * 0.26);
      d.arc(cx - rx * 0.99, cy - ry * 0.99 + bob, cx + rx * 0.99, cy + ry * 0.55 + bob,
            18, 144, { style: "arc", outline: K.C_GAUNTLET, width: hw });
      d.arc(cx - rx * 0.99, cy - ry * 0.99 + bob, cx + rx * 0.99, cy + ry * 0.55 + bob,
            60, 50, { style: "arc", outline: mix(K.C_GAUNTLET, "#ffffff", 0.5),
                      width: hw * 0.35 });
      for (const k of [-0.62, -0.21, 0.21, 0.62]) {
        const a = (90 - k * 62) * Math.PI / 180;
        d.ln([cx + Math.cos(a) * rx * 0.99, cy + bob - Math.sin(a) * ry * 0.77,
              cx + Math.cos(a) * rx * 0.72, cy + bob - Math.sin(a) * ry * 0.45],
             { fill: mix(K.C_GAUNTLET, "#000000", 0.4), width: 2 });
      }
      const chy = cy + ry * 0.42 + bob;
      for (const k of [-1, 1]) {
        d.ov(cx + k * rx * 0.30 - rx * 0.32, chy - ry * 0.22,
             cx + k * rx * 0.30 + rx * 0.32, chy + ry * 0.42,
             { fill: mix(body, "#ffffff", 0.12), outline: dark });
      }
      d.ln([cx, chy - ry * 0.12, cx, chy + ry * 0.34], { fill: dark, width: 2 });
      d.ln([cx - rx * 0.34, chy - ry * 0.30, cx + rx * 0.34, chy - ry * 0.30],
           { fill: dark, width: 3, round: true });
      const gx = cx + rx * 1.02, gy = cy + ry * 0.30 + bob;
      d.ov(gx - 9, gy - 8, gx + 9, gy + 9,
           { fill: K.C_GAUNTLET, outline: mix(K.C_GAUNTLET, "#000000", 0.45), width: 2 });
      K.C_GEMS.forEach((col, i) => {
        const a = ph * 0.8 + i * TAU / 6;
        const sx = gx + Math.cos(a) * 5.5, sy = gy + Math.sin(a) * 5.5;
        d.ov(sx - 1.9, sy - 1.9, sx + 1.9, sy + 1.9, { fill: col });
      });
      d.ov(gx - 2.6, gy - 2.6, gx + 2.6, gy + 2.6,
           { fill: mix(K.C_GAUNTLET, "#ffffff", 0.5) });
      eyeY = cy - ry * 0.20 + bob; eyeDx = rx * 0.34; eyeR = rx * 0.24;
    } else {
      for (const k of [-1, 1]) {               // Glut-Hoerner
        d.pg([cx + k * rx * 0.62, cy - ry * 0.55 + bob,
              cx + k * rx * 0.92, cy - ry * 1.35 + bob,
              cx + k * rx * 0.30, cy - ry * 0.85 + bob],
             { fill: light, outline: dark, width: 1 });
      }
      const my = cy + ry * 0.46 + bob;         // Zackenmaul
      const zig = [cx - rx * 0.46, my];
      for (let i = 0; i < 6; i++) {
        zig.push(cx - rx * 0.46 + rx * 0.92 * (i + 1) / 6,
                 my + (i % 2 === 0 ? ry * 0.20 : 0));
      }
      d.ln(zig, { fill: dark, width: 2 });
      eyeY = cy - ry * 0.12 + bob; eyeDx = rx * 0.33; eyeR = rx * 0.26;
    }

    for (const k of [-1, 1]) {
      const ex = cx + k * eyeDx;
      d.ov(ex - eyeR * 1.5, eyeY - eyeR * 1.5, ex + eyeR * 1.5, eyeY + eyeR * 1.5,
           { fill: light, stipple: "gray25" });
      d.ov(ex - eyeR, eyeY - eyeR * 0.9, ex + eyeR, eyeY + eyeR * 0.9,
           { fill: "#ffffff", outline: dark });
      const pu = eyeR * 0.5;
      d.ov(ex - pu, eyeY - pu, ex + pu, eyeY + pu, { fill: dark });
      d.ov(ex - pu * 0.8, eyeY - pu * 0.8, ex - pu * 0.1, eyeY - pu * 0.1,
           { fill: "#ffffff" });
    }
    d.ln([cx - eyeDx - eyeR, eyeY - eyeR * 1.5, cx - eyeDx * 0.2, eyeY - eyeR * 0.8],
         { fill: dark, width: 3, round: true });
    d.ln([cx + eyeDx + eyeR, eyeY - eyeR * 1.5, cx + eyeDx * 0.2, eyeY - eyeR * 0.8],
         { fill: dark, width: 3, round: true });
    for (let i = 0; i < 2; i++) {
      const a = ph * 1.4 + i * Math.PI;
      const sx = cx + Math.cos(a) * rx * 1.45, sy = cy + Math.sin(a) * ry * 1.15 + bob;
      const q = 2.2 + 0.8 * Math.sin(ph * 3 + i);
      d.ov(sx - q, sy - q, sx + q, sy + q, { fill: light });
    }
  }

  // ---- Die Figur

  drawPlayer() {
    const f = this.facing;
    const cx = this.px + K.PLAYER_W / 2, base = this.py + K.PLAYER_H;
    let fxs, fys;
    if (this.squash > 0) {
      const t = this.squash / 8;
      fxs = 1 + 0.26 * t; fys = 1 - 0.26 * t;
    } else {
      let e = clamp(Math.abs(this.vy) / 20, 0, 1) * 0.16;
      if (this.rocketActive) e = 0.24;
      fxs = 1 - e * 0.8; fys = 1 + e;
    }
    if (this.abilityFx > 0.02 && this.ability !== null) {
      this.drawAbilityEffect(cx, base - 21 * fys, this.abilityFx);
    }
    if (this.rocketActive) this.drawStrappedRocket(cx, base, fys);

    const w = this.holeFx;
    if (w > 0.01) {
      const cy = base - 21 * fys;
      if (this.holeScale < 0.3) {
        this.drawHoleSpark(cx, cy);
        this.drawHoleDisk(cx, cy, w * 0.5, false);
      } else {
        this.drawHoleDisk(cx, cy, w, true);
        const sc = this.holeScale;
        const ang = this.frame * (0.06 + 0.30 * w) + (1 - sc) * 9;
        const c = this.ctx;
        c.save();
        c.translate(cx, cy); c.rotate(ang);
        c.scale((1 - 0.55 * w) * sc, (1 + 0.85 * w) * sc);
        c.translate(-cx, -cy);
        this.drawDoodler(cx, base, this.skin,
                         { f, fxs, fys, look: this.shootAnim / K.SHOOT_ANIM });
        c.restore();
        this.drawHoleDisk(cx, cy, w, false);
      }
    } else {
      this.drawDoodler(cx, base, this.skin,
        { f, fxs, fys, look: this.shootAnim / K.SHOOT_ANIM,
          moving: Math.abs(this.vy) > 1 });
    }
    if (this.shield > 0) this.drawShieldBubble(cx, base - 21 * fys);
  }

  drawAbilityEffect(cx, cy, w) {
    // Prisma schiesst als Lichtstrahl hoch, Kosmos reisst eine Galaxie auf
    const d = this.d, ph = this.frame * 0.11;
    if (this.skinKey === "prisma") {
      for (let i = 0; i < 9; i++) {
        const hw = (46 - i * 4.6) * w;
        d.rc(cx - hw, -K.BG_MARGIN, cx + hw, K.HEIGHT + K.BG_MARGIN,
             { fill: hsvHex(this.frame * 0.02 + i * 0.11, 0.85, 1),
               stipple: i < 6 ? "gray12" : "gray25" });
      }
      for (let i = 0; i < 7; i++) {
        const t = (ph * 0.6 + i / 7) % 1;
        const yy = cy + 200 - t * 420, q = (16 - 10 * t) * w;
        d.pg([cx - q, yy, cx, yy - q * 2.2, cx + q, yy, cx, yy + q * 2.2],
             { fill: hsvHex(t + this.frame * 0.01, 0.7, 1) });
      }
      d.ln([cx, -K.BG_MARGIN, cx, K.HEIGHT + K.BG_MARGIN],
           { fill: "#ffffff", width: Math.max(1, 3 * w) });
    } else {
      for (const [r_, st] of [[120, "gray12"], [86, "gray12"], [56, "gray25"]]) {
        const rr = r_ * w;
        d.ov(cx - rr, cy - rr * 0.52, cx + rr, cy + rr * 0.52,
             { fill: "#7fd0ff", stipple: st });
      }
      for (const arm of [0, Math.PI]) {
        for (let i = 0; i < 18; i++) {
          const t = i / 17;
          const a = arm + t * 4.2 + ph * 0.9, r = (10 + t * 112) * w;
          const gx = cx + Math.cos(a) * r, gy = cy + Math.sin(a) * r * 0.52;
          const q = (4.2 - 3.2 * t) * w;
          const col = t < 0.45 ? mix("#ffffff", "#9fd8ff", Math.min(1, t * 2.2))
                               : mix("#9fd8ff", "#c9b8ff", (t - 0.45) / 0.55);
          d.ov(gx - q, gy - q, gx + q, gy + q, { fill: col });
        }
      }
      [[22, "#9fd8ff", "gray50"], [14, "#dff0ff", null], [8, "#ffffff", null]]
        .forEach(([r_, col, st], i) => {
          const rr = r_ * w * (1 + 0.08 * Math.sin(ph * 2 + i));
          d.ov(cx - rr, cy - rr, cx + rr, cy + rr, { fill: col, stipple: st });
        });
    }
  }

  drawHoleSpark(cx, cy) {
    const d = this.d;
    [[13, K.C_HOLE_RIM, "gray25"], [8, "#ffd166", "gray50"], [4, "#ffffff", null]]
      .forEach(([r, col, st], i) => {
        const rr = r + 2 * Math.sin(this.frame * 0.5 + i);
        d.ov(cx - rr, cy - rr, cx + rr, cy + rr, { fill: col, stipple: st });
      });
    d.ln([cx, cy + 4, cx, cy + 54], { fill: K.C_HOLE_RIM, width: 3 });
    d.ln([cx, cy + 4, cx, cy + 30], { fill: "#ffffff", width: 1 });
  }
  drawHoleDisk(cx, cy, w, back) {
    const d = this.d;
    if (back) {
      let r = 52 * w;
      d.ov(cx - r, cy - r, cx + r, cy + r, { fill: K.C_HOLE, stipple: "gray50" });
      r *= 0.62;
      d.ov(cx - r, cy - r, cx + r, cy + r, { fill: "#000000" });
    }
    for (let i = 0; i < 4; i++) {
      const rr = (30 + i * 10) * w;
      const a0 = -((this.frame * 3.4 + i * 47) % 360);
      d.arc(cx - rr * 1.8, cy - rr * 0.5, cx + rr * 1.8, cy + rr * 0.5,
            a0, back ? 150 : -150,
            { style: "arc", outline: mix(K.C_HOLE_RIM, "#ffffff", i * 0.22),
              width: Math.max(1, (4 - i * 0.7) * w) });
    }
  }
  drawShieldBubble(cx, cy) {
    if (this.shield < 90 && Math.floor(this.shield / 4) % 2 === 0) return;
    const d = this.d, ph = this.frame * 0.07;
    const r = 37 + 2 * Math.sin(ph * 2);
    d.ov(cx - r, cy - r, cx + r, cy + r,
         { fill: K.C_SHIELD, stipple: "gray12", outline: K.C_SHIELD, width: 2 });
    d.ov(cx - r + 4, cy - r + 4, cx + r - 4, cy + r - 4,
         { outline: mix(K.C_SHIELD, "#ffffff", 0.5), width: 1 });
    for (let i = 0; i < 3; i++) {
      const a = (ph * 1.4 + i * 2.1) * 180 / Math.PI % 360;
      d.arc(cx - r, cy - r, cx + r, cy + r, a, 34,
            { style: "arc", outline: "#ffffff", width: 2 });
    }
  }
  drawStrappedRocket(cx, base, fys) {
    const d = this.d, ph = this.frame * 0.5;
    [[64, K.C_ASTRAL, "gray25"], [46, K.C_ASTRAL_L, "gray25"], [30, "#ffffff", "gray50"]]
      .forEach(([g, col, st]) => {
        const gg = g + 7 * Math.sin(ph);
        d.ov(cx - gg, base - 34 - gg, cx + gg, base + gg * 0.5, { fill: col, stipple: st });
      });
    const top = base - 78 * fys;
    d.pg([cx, top, cx + 18, top + 34, cx + 18, base - 2, cx - 18, base - 2,
          cx - 18, top + 34], { fill: K.C_ROCKET, outline: K.C_ROCKET_D, width: 2 });
    d.pg([cx, top, cx + 4, top + 36, cx - 4, top + 36], { fill: K.C_ROCKET_L });
    d.pg([cx - 18, base - 26, cx - 32, base + 8, cx - 18, base - 2], { fill: K.C_ROCKET_D });
    d.pg([cx + 18, base - 26, cx + 32, base + 8, cx + 18, base - 2], { fill: K.C_ROCKET_D });
    [[28, 132, K.C_ASTRAL], [21, 108, "#ff8c42"], [14, 82, "#ffd166"], [7, 54, "#ffffff"]]
      .forEach(([w, ln, col], i) => {
        const j = ln * (0.78 + 0.22 * Math.sin(ph * 2.3 + i));
        d.pg([cx - w, base - 4, cx + w, base - 4, cx + w * 0.35, base + j * 0.55,
              cx, base + j, cx - w * 0.35, base + j * 0.55], { fill: col });
      });
  }
  miniPlanet(x, y, r, light, dark) {
    const d = this.d;
    d.arc(x - r * 2, y - r * 0.5, x + r * 2, y + r * 0.5, 0, 360,
          { style: "arc", outline: mix(light, "#ffffff", 0.4), width: 2 });
    d.ov(x - r, y - r, x + r, y + r, { fill: light, outline: dark, width: 1 });
    d.ov(x - r * 0.2, y - r * 0.55, x + r, y + r, { fill: dark, stipple: "gray50" });
    d.arc(x - r * 2, y - r * 0.5, x + r * 2, y + r * 0.5, 180, 180,
          { style: "arc", outline: mix(light, "#ffffff", 0.65), width: 2 });
  }
  orb(x, y, light, dark) {
    const d = this.d;
    d.ov(x - 7, y - 7, x + 7, y + 7, { fill: light, stipple: "gray50" });
    d.ov(x - 4, y - 4, x + 4, y + 4, { fill: light, outline: dark });
  }
  skinColors(sk) {
    if (sk.fx.includes("rainbow")) {
      const h = (this.frame * 0.006) % 1;
      return [hsvHex(h, 0.72, 1), hsvHex(h + 0.08, 0.35, 1), hsvHex(h, 0.95, 0.48)];
    }
    return [sk.body, sk.light, sk.dark];
  }

  drawDoodler(cx, base, sk, opt = {}) {
    const d = this.d;
    const f = opt.f ?? 1, fxs = opt.fxs ?? 1, fys = opt.fys ?? 1;
    const look = opt.look ?? 0, moving = opt.moving ?? false;
    const fx = sk.fx;
    const [body, light, dark] = this.skinColors(sk);
    const ph = this.frame * 0.06;
    const X = dx => cx + dx * fxs, Y = dy => base + dy * fys;
    const ov = (x0, y0, x1, y1, o) => d.ov(X(x0), Y(y0), X(x1), Y(y1), o);

    if (fx.includes("bigbang")) {          // nach aussen laufende Wellen
      for (let i = 0; i < 3; i++) {
        const t = (this.frame * 0.011 + i / 3) % 1;
        const r = 20 + 52 * t;
        ov(-r, -21 - r, r, -21 + r,
           { outline: mix("#ffffff", light, t), width: Math.max(1, 3.5 * (1 - t)) });
      }
    }
    if (fx.includes("rays")) {
      for (let i = 0; i < 12; i++) {
        const a = ph * 0.5 + i * TAU / 12;
        const nx = Math.cos(a), ny = Math.sin(a);
        const r0 = 20, r1 = 46 + 10 * Math.sin(ph * 2 + i);
        const bx = -ny * 5.5, by = nx * 5.5;
        d.pg([X(nx * r0 + bx), Y(-21 + ny * r0 + by), X(nx * r0 - bx), Y(-21 + ny * r0 - by),
              X(nx * r1), Y(-21 + ny * r1)], { fill: light, stipple: "gray50" });
        d.pg([X(nx * r0 + bx * 0.4), Y(-21 + ny * r0 + by * 0.4),
              X(nx * r0 - bx * 0.4), Y(-21 + ny * r0 - by * 0.4),
              X(nx * r1 * 0.82), Y(-21 + ny * r1 * 0.82)], { fill: light });
      }
    }
    if (fx.includes("bigaura")) {
      [[50, dark, "gray12"], [41, body, "gray12"], [33, light, "gray25"],
       [25, body, "gray25"], [18, "#ffffff", "gray25"]].forEach(([g, col, st], i) => {
        const gg = g + 4 * Math.sin(ph * 1.3 + i * 0.7);
        ov(-gg, -21 - gg, gg, -21 + gg, { fill: col, stipple: st });
      });
    } else if (fx.includes("aura")) {
      [dark, body, light].forEach((col, i) => {
        const gg = [34, 26, 19][i] + 3 * Math.sin(ph + i);
        ov(-gg, -21 - gg, gg, -21 + gg, { fill: col, stipple: "gray25" });
      });
    }
    if (fx.includes("ring")) {
      for (const [r, w] of [[40, 3], [33, 2]]) {
        d.arc(X(-r), Y(-21 - r * 0.34), X(r), Y(-21 + r * 0.34), 0, 180,
              { style: "arc", outline: mix(sk.eye, "#ffffff", 0.3), width: w });
      }
    }
    if (fx.includes("trail") && moving) {
      ["gray12", "gray25"].forEach((st, i) => {
        const off = (i + 1) * 9;
        ov(-19, -38 + off, 19, -4 + off, { fill: body, stipple: st });
      });
    }
    const orbiters = front => {
      if (fx.includes("orbit")) {
        for (let i = 0; i < 3; i++) {
          const a = ph * 1.6 + i * TAU / 3;
          if ((Math.sin(a) >= 0) === front) {
            this.orb(X(Math.cos(a) * 30), Y(-21 + Math.sin(a) * 12), light, dark);
          }
        }
      }
      if (fx.includes("planet")) {
        const a = ph * 0.85;
        if ((Math.sin(a) >= 0) === front) {
          this.miniPlanet(X(Math.cos(a) * 34), Y(-21 + Math.sin(a) * 14), 8, light, dark);
        }
      }
      if (fx.includes("comet")) {
        const a = -ph * 1.25 + 1;
        if ((Math.sin(a) >= 0) === front) {
          for (let k = 0; k < 4; k++) {
            const b = a + 0.17 * (k + 1), r = 4.2 - k * 0.95;
            const tx = Math.cos(b) * 37, ty = -21 + Math.sin(b) * 15;
            ov(tx - r, ty - r, tx + r, ty + r,
               { fill: mix(light, "#ffffff", 0.45 - k * 0.1) });
          }
          const hx = Math.cos(a) * 37, hy = -21 + Math.sin(a) * 15;
          ov(hx - 4.5, hy - 4.5, hx + 4.5, hy + 4.5, { fill: "#ffffff" });
        }
      }
    };
    orbiters(false);

    for (const [lx, ly, fw] of [[-15, -2, 0], [13, -2, 0], [-19, 1, 1], [17, 1, 1]]) {
      const col = fw === 0 ? dark : mix(dark, body, 0.35);
      const ex = lx + (lx > 0 ? 2 : -2);
      d.ln([X(lx), Y(-10), X(ex), Y(ly)], { fill: col, width: 4, round: true });
      ov(ex - 4, ly - 3, ex + 4, ly + 3, { fill: col });
    }

    ov(-21, -40, 21, -2, { fill: body, outline: dark, width: 2 });
    if (fx.includes("bands")) {
      const n = 9;
      for (let i = 0; i < n; i++) {
        const y0 = -40 + 38 * i / n, y1 = -40 + 38 * (i + 1) / n;
        const t = Math.max(Math.abs((y0 + 21) / 19), Math.abs((y1 + 21) / 19));
        const hw = 21 * Math.sqrt(Math.max(0, 1 - t * t));
        if (hw < 1.5) continue;
        d.rc(X(-hw), Y(y0), X(hw), Y(y1),
             { fill: hsvHex(this.frame * 0.007 + i * 0.075, 0.8, 1) });
      }
      ov(-21, -40, 21, -2, { outline: dark, width: 2 });
    }
    if (fx.includes("bigbang")) {          // kleiner, weissgluehender Kern
      const k = 4.2 + 1.4 * Math.sin(ph * 2.2), ky = -13;
      [[k * 1.8, light, "gray50"], [k * 1.15, "#fff3c0", null],
       [k * 0.6, "#ffffff", null]].forEach(([r_, col, st]) => {
        ov(-r_, ky - r_, r_, ky + r_, { fill: col, stipple: st });
      });
    }
    if (fx.includes("galaxy")) {
      const gc = -14;
      for (const [r_, st] of [[17, "gray25"], [12, "gray25"], [7, "gray50"]]) {
        ov(-r_, gc - r_ * 0.75, r_, gc + r_ * 0.75, { fill: light, stipple: st });
      }
      for (const arm of [0, Math.PI]) {
        for (let i = 0; i < 16; i++) {
          const t = i / 15;
          const a = arm + t * 3.4 + ph * 0.55, r = 2 + t * 16;
          const gx = Math.cos(a) * r, gy = gc + Math.sin(a) * r * 0.78;
          const q = 2.7 - 2 * t;
          const col = t < 0.45 ? mix("#ffffff", "#9fd8ff", Math.min(1, t * 2.2))
                               : mix("#9fd8ff", "#ff8ad8", (t - 0.45) / 0.55);
          ov(gx - q, gy - q, gx + q, gy + q, { fill: col });
        }
      }
      for (const [r_, col] of [[8, mix(light, "#ffffff", 0.4)], [5, "#dff0ff"], [2.6, "#ffffff"]]) {
        ov(-r_, gc - r_ * 0.8, r_, gc + r_ * 0.8, { fill: col });
      }
      d.arc(X(-21), Y(-40), X(21), Y(-2), 95, 120,
            { style: "arc", outline: mix(light, "#ffffff", 0.55), width: 2 });
    }
    if (fx.includes("stars")) {
      for (let i = 0; i < 14; i++) {
        const a = i * 2.399 + ph * 0.15;
        const rr = 17 * Math.sqrt((i + 0.5) / 14);
        const sx = Math.cos(a) * rr, sy = -21 + Math.sin(a) * rr * 0.92;
        const tw = 0.5 + 0.5 * Math.sin(ph * 2.2 + i);
        const r = 0.9 + 1.1 * tw;
        ov(sx - r, sy - r, sx + r, sy + r,
           { fill: mix(body, "#ffffff", 0.35 + 0.65 * tw) });
      }
    } else if (!fx.includes("bands") && !fx.includes("galaxy")) {
      ov(-15, -36, 2, -22, { fill: light });
    }
    if (fx.includes("cracks")) {
      const glow = mix(light, "#ffffff", 0.3 + 0.3 * Math.sin(ph * 1.7));
      for (const [a, b_, cc] of [[[-12, -30], [-4, -22], [-9, -14]],
                                 [[6, -33], [11, -24], [5, -17]],
                                 [[-2, -12], [3, -8], [-1, -5]]]) {
        d.ln([X(a[0]), Y(a[1]), X(b_[0]), Y(b_[1]), X(cc[0]), Y(cc[1])],
             { fill: glow, width: 2, round: true, smooth: true });
      }
    }
    if (fx.includes("shards")) {
      for (const dx0 of [-13, 0, 12]) {
        d.pg([X(dx0 - 4), Y(-38), X(dx0), Y(-50), X(dx0 + 4), Y(-38)],
             { fill: light, outline: dark, width: 1 });
      }
    }
    if (fx.includes("bolt")) {
      d.pg([X(2), Y(-34), X(-7), Y(-20), X(-1), Y(-20), X(-5), Y(-7),
            X(8), Y(-23), X(1), Y(-23)],
           { fill: mix(light, "#ffffff", 0.5), outline: dark });
    }

    const { pts: spts, tip, nostril } = snoutPoints(look);
    const flat = [];
    for (const [dx, dy] of spts) flat.push(X(dx * f), Y(dy));
    const drawSnout = () => {
      d.pg(flat, { fill: body });
      d.ln(flat, { fill: dark, width: 2, round: true, smooth: true });
      ov(nostril[0] * f - 2, nostril[1] - 2, nostril[0] * f + 2, nostril[1] + 2,
         { fill: dark });
    };
    drawSnout();

    if (fx.includes("visor")) {
      const lens = mix(dark, "#000000", 0.45), by = -32;
      d.ln([X(-2), Y(by - 1), X(2), Y(by - 1)], { fill: dark, width: 3 });
      d.ln([X(-17), Y(by - 3), X(-11), Y(by - 2)], { fill: dark, width: 3 });
      d.ln([X(17), Y(by - 3), X(11), Y(by - 2)], { fill: dark, width: 3 });
      for (const dx of [-8, 8]) {
        ov(dx - 8, by - 7, dx + 8, by + 7,
           { fill: lens, outline: mix(light, "#ffffff", 0.35), width: 2 });
        d.ln([X(dx - 5), Y(by + 3), X(dx + 2), Y(by - 4)],
             { fill: mix(light, "#ffffff", 0.75), width: 2 });
        d.ln([X(dx + 1), Y(by + 4), X(dx + 4), Y(by + 1)],
             { fill: mix(light, "#ffffff", 0.45), width: 1 });
      }
    } else {
      for (const dx of [-8, 7]) {
        ov(dx - 8, -40, dx + 8, -24, { fill: "white", outline: dark, width: 2 });
        const px_ = dx + 3.2 * f * (1 - 0.75 * look);
        const py_ = -31.5 - 3 * look;
        ov(px_ - 3.4, py_ - 3.5, px_ + 3.4, py_ + 3.5, { fill: sk.eye });
        ov(px_ - 3, py_ - 3, px_ - 0.6, py_ - 0.5, { fill: "white" });
        d.arc(X(dx - 8), Y(-41), X(dx + 8), Y(-25), 20, 140,
              { style: "arc", outline: dark, width: 2 });
      }
    }
    if (look > 0.2) drawSnout();
    d.arc(X(-7), Y(-20), X(7), Y(-9), 200, 140,
          { style: "arc", outline: dark, width: 2 });

    if (fx.includes("cap")) {
      const capc = dark, capd = mix(dark, "#000000", 0.3);
      d.arc(X(-17), Y(-56), X(17), Y(-28), 0, 180,
            { style: "pieslice", fill: capc, outline: capd, width: 2 });
      d.pg([X(2 * f), Y(-46), X(28 * f), Y(-44), X(26 * f), Y(-38), X(2 * f), Y(-40)],
           { fill: capd });
      ov(-3, -60, 3, -54, { fill: capd });
    }
    if (fx.includes("crystal")) {
      [-15, -7.5, 0, 7.5, 15].forEach((dx0, i) => {
        const hgt = 13 + 8 * Math.abs(Math.sin(ph * 1.3 + i * 0.9));
        const col = hsvHex(this.frame * 0.009 + i * 0.13, 0.5, 1);
        d.pg([X(dx0 - 4.5), Y(-37), X(dx0 + 4.5), Y(-37), X(dx0 + 1), Y(-37 - hgt)],
             { fill: col, outline: "#ffffff", width: 1 });
        d.pg([X(dx0 - 4.5), Y(-37), X(dx0 - 1), Y(-37), X(dx0 + 1), Y(-37 - hgt)],
             { fill: mix(col, "#ffffff", 0.55) });
      });
    }
    if (fx.includes("crown")) {
      d.pg([X(-13), Y(-40), X(-13), Y(-53), X(-6), Y(-46), X(0), Y(-56),
            X(6), Y(-46), X(13), Y(-53), X(13), Y(-40)],
           { fill: "#ffd54a", outline: "#a87b10", width: 2 });
      for (const gx of [-9, 0, 9]) ov(gx - 2, -44, gx + 2, -40, { fill: "#ff5d7a" });
    }
    if (fx.includes("flames")) {
      [-11, 0, 11].forEach((dx0, i) => {
        const h = 16 + 7 * Math.sin(ph * 2.4 + i * 1.7);
        d.pg([X(dx0 - 6), Y(-38), X(dx0 + 6), Y(-38), X(dx0 + 1), Y(-38 - h)],
             { fill: mix("#ff8c42", light, 0.2) });
        d.pg([X(dx0 - 3), Y(-38), X(dx0 + 3), Y(-38), X(dx0), Y(-38 - h * 0.6)],
             { fill: "#fff3b0" });
      });
    }
    if (fx.includes("halo")) {
      const hy = -54 + 2 * Math.sin(ph);
      d.ov(X(-15), Y(hy - 4), X(15), Y(hy + 4),
           { outline: mix(light, "#ffffff", 0.5), width: 3 });
    }

    if (fx.includes("ring")) {
      for (const [r, w] of [[40, 3], [33, 2]]) {
        d.arc(X(-r), Y(-21 - r * 0.34), X(r), Y(-21 + r * 0.34), 180, 180,
              { style: "arc", outline: sk.eye, width: w });
      }
    }
    orbiters(true);
    if (fx.includes("glow")) {
      ov(-23, -42, 23, 0, { outline: mix(light, "#ffffff", 0.4), width: 2 });
    }
    if (fx.includes("sparkle")) {
      for (let i = 0; i < 4; i++) {
        const t = (ph * 0.6 + i * 0.25) % 1;
        if (t > 0.72) continue;
        const a = i * 1.9 + ph * 0.3, r = 24 + 10 * t;
        const sx = Math.cos(a) * r, sy = -21 + Math.sin(a) * r * 0.9;
        const q = (1 - t / 0.72) * 5;
        d.pg([X(sx), Y(sy - q), X(sx + q * 0.34), Y(sy - q * 0.34), X(sx + q), Y(sy),
              X(sx + q * 0.34), Y(sy + q * 0.34), X(sx), Y(sy + q),
              X(sx - q * 0.34), Y(sy + q * 0.34), X(sx - q), Y(sy),
              X(sx - q * 0.34), Y(sy - q * 0.34)], { fill: "#ffffff" });
      }
    }
    if (look > 0) {
      const tx = tip[0] * f, ty = tip[1];
      const burst = [];
      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI / 6 + 0.26;
        const r = (i % 2 === 0 ? 15 : 7) * (0.45 + 0.55 * look);
        burst.push(X(tx + Math.cos(a) * r), Y(ty + Math.sin(a) * r));
      }
      d.pg(burst, { fill: "#ffd166" });
      ov(tx - 4.5, ty - 4.5, tx + 4.5, ty + 4.5, { fill: "#fff8d6" });
    }
  }

  // -------------------------------------------------------- HUD und Menues

  coinChip(x, y, amount, size = 13) {
    const d = this.d, r = 7 * this.scale;
    const cx = this.toX(x), cy = this.toY(y);
    d.ov(cx - r, cy - r, cx + r, cy + r,
         { fill: "#f2c14e", outline: "#a87b10", width: Math.max(1, 2 * this.scale) });
    d.tx(cx, cy, "M", { size: this.fs(size - 3), fill: "#7d5a06" });
    d.tx(cx + r + 6 * this.scale, cy, String(amount),
         { anchor: "w", fill: "#ffe9a8", size: this.fs(size) });
  }

  drawHud() {
    const d = this.d;
    const bar = Math.max(44, 44 * this.scale);
    this.barH = bar;
    d.rc(0, 0, this.sw, bar, { fill: "#0b1030" });
    d.ln([0, bar, this.sw, bar],
         { fill: mix("#39407e", K.C_ASTRAL, this.rocketFx), width: 2 });
    d.tx(14, bar / 2, `Score  ${Math.floor(this.score)}`,
         { anchor: "w", size: this.fs(16), fill: K.C_TEXT });
    d.tx(this.sw / 2, bar / 2, `M ${this.coins}`,
         { size: this.fs(12), fill: "#f2c14e" });
    const modeLabel = this.difficulty === "normal"
      ? `Best ${this.highscore}`
      : `${K.MODE_NAMES[this.difficulty]} - Best ${this.highscore}`;
    d.tx(this.sw - 54 * this.scale, bar / 2, modeLabel,
         { anchor: "e", size: this.fs(12), fill: K.MODE_COLORS[this.difficulty] });
    // Menue-Knopf oben rechts
    const bx = this.sw - 24 * this.scale;
    for (let i = 0; i < 3; i++) {
      d.rc(bx - 9 * this.scale, bar / 2 - 7 * this.scale + i * 6 * this.scale,
           bx + 9 * this.scale, bar / 2 - 5 * this.scale + i * 6 * this.scale,
           { fill: "#c9d3f5" });
    }

    if (this.recordNear && !this.recordHit) {
      d.tx(this.sw / 2, bar + 16 * this.scale,
           `noch ${this.recordNear} bis zum Rekord`,
           { size: this.fs(10), fill: "#ffd54a" });
    }
    if (this.mult > 1) this.drawMult(bar);
    if (this.milestoneNote > 0) {
      const t = this.milestoneNote / (1.6 * K.FPS);
      d.tx(this.sw / 2, bar + 74 * this.scale,
           `${this.milestoneVal}   +${K.MILESTONE_COINS} Muenzen`,
           { size: this.fs(15), fill: mix("#ffffff", "#f2c14e", Math.min(1, t * 1.6)) });
    }
    if (this.recordFlash > 0) this.drawRecordNote(bar);

    if (this.toast) {
      const [txt, sub, col, life] = this.toast;
      const t = Math.min(1, life / 30);
      const yy = bar + 40 * this.scale;
      d.rc(0, yy - 22 * this.scale, this.sw, yy + 26 * this.scale,
           { fill: "#0b1026", stipple: "gray50" });
      d.tx(this.sw / 2, yy - 4 * this.scale, txt,
           { size: this.fs(15), fill: mix("#ffffff", col, t) });
      d.tx(this.sw / 2, yy + 15 * this.scale, sub,
           { size: this.fs(10), fill: "#c9d3f5", bold: false });
    }

    if (this.rocketActive) {
      this.drawGauge(bar, 1 - this.rocketLeft / this.rocketTotal, "ASTRAL RAKETE",
                     K.C_ASTRAL, this.rocketTotal - this.rocketLeft, this.rocketTotal);
    } else if (this.holeActive || this.holeSuck > 0) {
      this.drawGauge(bar, 1 - this.holeLeft / this.holeTotal, "SCHWARZES LOCH",
                     K.C_HOLE_RIM, this.holeTotal - this.holeLeft, this.holeTotal);
    } else if (this.abilityActive) {
      this.drawGauge(bar, 1 - this.abilityLeft / K.ABILITY_DIST,
                     this.ability.name, this.ability.col,
                     K.ABILITY_DIST - this.abilityLeft, K.ABILITY_DIST);
    } else if (this.rocketFlash > 0) {
      const t = this.rocketFlash / 55;
      d.tx(this.sw / 2, bar + this.fs(30), "ASTRAL RAKETE",
           { size: this.fs(26 + Math.floor(10 * t)), fill: mix("#ffffff", K.C_ASTRAL, t) });
    } else if (this.itemFlash) {
      const [life, label, col] = this.itemFlash;
      const t = life / 55;
      d.tx(this.sw / 2, bar + this.fs(30), label,
           { size: this.fs(22 + Math.floor(8 * t)), fill: mix("#ffffff", col, t) });
    }
    if (this.shield > 0) this.drawShieldChip(bar);
    if (!this.paused && !this.gameOver) {
      this.drawShootButton();
      this.drawAbilityButton();
    }
    if (this.abilityFlash > 0 && this.ability !== null && !this.abilityActive) {
      const t = this.abilityFlash / 60;
      d.tx(this.sw / 2, bar + this.fs(30), this.ability.name,
           { size: this.fs(22 + Math.floor(10 * t)),
             fill: mix("#ffffff", this.ability.col, t) });
    }
  }

  // ---- Knoepfe am Rand: schiessen links, Faehigkeit rechts
  btnGeom(side) {
    const r = K.BTN_R * this.scale;
    const y = this.sh * 0.52;
    const x = side === "left" ? r + 16 * this.scale : this.sw - r - 16 * this.scale;
    return [x, y, r];
  }
  inButton(sx, sy, side) {
    const [x, y, r] = this.btnGeom(side);
    return (sx - x) ** 2 + (sy - y) ** 2 <= (r * 1.15) ** 2;
  }
  drawShootButton() {
    const d = this.d;
    const [x, y, r] = this.btnGeom("left");
    const ready = this.shootTimer <= 0 && !this.rocketActive;
    const col = ready ? "#ffd166" : "#6a7398";
    d.ov(x - r, y - r, x + r, y + r,
         { fill: col, stipple: "gray12", outline: col,
           width: Math.max(1, 2 * this.scale) });
    if (ready) {
      const g = r * (1.06 + 0.05 * Math.sin(this.frame * 0.12));
      d.ov(x - g, y - g, x + g, y + g, { outline: col, width: Math.max(1, this.scale) });
    } else {
      const t = 1 - this.shootTimer / this.shootCd;
      d.arc(x - r, y - r, x + r, y + r, 90, -360 * t,
            { style: "arc", outline: "#ffd166", width: Math.max(2, 3 * this.scale) });
    }
    const s2 = r * 0.42;
    d.ov(x - s2 * 0.5, y - s2 * 0.9, x + s2 * 0.5, y + s2 * 0.1, { fill: col });
    for (const dx of [-0.55, 0, 0.55]) {
      d.ln([x + dx * s2, y + s2 * 0.45, x + dx * s2, y + s2 * 1.1],
           { fill: col, width: Math.max(1, 2 * this.scale) });
    }
  }
  drawAbilityButton() {
    const ab = this.ability;
    if (ab === null) return;
    const d = this.d;
    const [x, y, r] = this.btnGeom("right");
    const t = Math.min(1, this.charge / K.ABILITY_CHARGE);
    const col = ab.col;
    d.ov(x - r, y - r, x + r, y + r,
         { fill: t >= 1 ? col : "#6a7398", stipple: "gray12",
           outline: t >= 1 ? col : "#6a7398", width: Math.max(1, 2 * this.scale) });
    d.arc(x - r, y - r, x + r, y + r, 90, -360 * t,
          { style: "arc", outline: col, width: Math.max(2, 4 * this.scale) });
    if (t >= 1) {
      const g = r * (1.08 + 0.07 * Math.sin(this.frame * 0.16));
      d.ov(x - g, y - g, x + g, y + g, { outline: col, width: Math.max(1, 2 * this.scale) });
      const pts = [];
      for (let i = 0; i < 10; i++) {
        const a = this.frame * 0.04 - Math.PI / 2 + i * TAU / 10;
        const rr = r * (i % 2 === 0 ? 0.60 : 0.26);
        pts.push(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      d.pg(pts, { fill: "#ffffff" });
    } else {
      d.tx(x, y, `${Math.floor(t * 100)}%`, { size: this.fs(12), fill: "#c9d3f5" });
    }
  }

  drawGauge(bar, done, label, col, got, total) {
    const d = this.d;
    const w = Math.min(this.sw - 40, 360 * this.scale);
    const x0 = (this.sw - w) / 2, y0 = bar + 14 * this.scale;
    const h = Math.max(14, 20 * this.scale);
    const pulse = 0.5 + 0.5 * Math.sin(this.frame * 0.25);
    const dark = mix(col, "#000000", 0.72);
    d.rc(x0 - 4, y0 - 4, x0 + w + 4, y0 + h + 4,
         { fill: mix(dark, col, 0.25 * pulse), outline: mix(col, "#ffffff", 0.4),
           width: Math.max(1, 2 * this.scale) });
    d.rc(x0, y0, x0 + w, y0 + h, { fill: "#120a26" });
    const fw = Math.max(0, w * clamp(done, 0, 1));
    for (let i = 0; i * 26 < fw; i++) {
      const sx = x0 + i * 26, ex = Math.min(sx + 23, x0 + fw);
      if (ex <= sx) break;
      d.rc(sx + 2, y0 + 2, ex, y0 + h - 2, { fill: mix(col, "#ffffff", 0.35 * pulse) });
    }
    d.tx(this.sw / 2, y0 + h / 2, `${Math.floor(done * 100)} %`,
         { size: this.fs(12), fill: "#ffffff" });
    d.tx(this.sw / 2, y0 + h + this.fs(16),
         `${label}   +${Math.floor(got)} / ${Math.floor(total)}`,
         { size: this.fs(14), fill: mix(col, "#ffffff", pulse) });
  }
  // Punktefaktor des Durchgangs mit Fortschrittsbalken
  drawMult(bar) {
    const d = this.d;
    const x = this.sw - 16 * this.scale, y = bar + 26 * this.scale;
    const voll = this.mult >= K.MULT_MAX - 1e-9;
    const t = (this.mult - 1) / (K.MULT_MAX - 1);
    let col = voll ? "#ff9f43" : "#ffd54a";
    if (this.multFlash > 0) {
      col = mix(col, "#ffffff", this.multFlash / (0.8 * K.FPS));
    }
    d.tx(x, y, `x${this.mult.toFixed(1)}`,
         { anchor: "e", size: this.fs(18), fill: col });
    const w = 56 * this.scale;
    d.rc(x - w, y + 13 * this.scale, x, y + 17 * this.scale, { fill: "#2b2358" });
    d.rc(x - w * t, y + 13 * this.scale, x, y + 17 * this.scale, { fill: col });
    d.tx(x - w - 6 * this.scale, y, voll ? "Faktor voll" : `${this.kills} Monster`,
         { anchor: "e", size: this.fs(9), fill: "#8b93c7", bold: false });
  }

  drawRecordNote(bar) {
    const d = this.d;
    const t = this.recordFlash / (2.2 * K.FPS);
    const y = this.sh * 0.34, h = 30 * this.scale;
    const stip = ["gray75", "gray50", "gray25"][Math.min(2, Math.floor((1 - t) * 3))];
    d.rc(0, y - h, this.sw, y + h, { fill: "#3a2a05", stipple: stip });
    d.tx(this.sw / 2, y - 6 * this.scale, "NEUER REKORD",
         { size: this.fs(24), fill: "#ffd54a" });
    d.tx(this.sw / 2, y + 18 * this.scale, "alles ab hier ist neues Land",
         { size: this.fs(10), fill: "#ffe9a8", bold: false });
  }

  drawShieldChip(bar) {
    const d = this.d, secs = this.shield / K.FPS;
    const w = 104 * this.scale, h = 26 * this.scale;
    const x0 = this.sw / 2 - w / 2;
    let y0 = bar + 8 * this.scale;
    if (this.rocketActive || this.holeActive || this.holeSuck > 0) y0 = bar + 74 * this.scale;
    d.rc(x0, y0, x0 + w, y0 + h,
         { fill: "#07222b", outline: K.C_SHIELD, width: Math.max(1, 2 * this.scale) });
    const fw = (w - 6) * clamp(secs / K.SHIELD_TIME, 0, 1);
    d.rc(x0 + 3, y0 + h - 6 * this.scale, x0 + 3 + fw, y0 + h - 3 * this.scale,
         { fill: K.C_SHIELD });
    d.tx(x0 + w / 2, y0 + h / 2 - 2 * this.scale, `SCHILD  ${secs.toFixed(1)} s`,
         { size: this.fs(11), fill: K.C_SHIELD });
  }
  // Zusammenfassung nach dem Lauf. Unter SHORT_RUN Punkten nur eine
  // schmale Leiste - nach einem missglueckten Start soll man sofort
  // weiterspielen koennen, nicht erst lesen.
  drawSummary() {
    const d = this.d;
    const score = Math.floor(this.score);
    if (score < K.SHORT_RUN) { this.drawQuickOver(score); return; }
    d.rc(0, 0, this.sw, this.sh, { fill: "#05060f", stipple: "gray50" });
    const rekord = score > (this.bestBefore | 0);
    const ein = Math.min(1, this.overT / 8);
    const heben = (1 - ein) ** 2 * 90;
    const c = this.d.c;
    c.save();
    c.translate(0, this.mo * this.scale);
    const top = 92 + heben;
    const defs = this.questDefs();
    const bot = top + 298 + 16 + 20 * Math.max(1, defs.length) + 46;
    this.rrect(20, top, K.WIDTH - 20, bot, 20, { fill: C_CARD });
    this.rrect(20, top, K.WIDTH - 20, bot, 20, { outline: C_EDGE, width: 1.4 });
    this.vtext(K.WIDTH / 2, top + 30, "LAUF BEENDET", 13, C_MUTED);
    this.vtext(K.WIDTH / 2, top + 68, `${score}`, 40,
               rekord ? "#ffd54a" : "#ffffff");
    this.vtext(K.WIDTH / 2, top + 96,
               rekord ? "neuer Rekord!" : `Bestwert ${this.highscore}`, 11,
               rekord ? "#ffd54a" : C_MUTED, false);

    let y = top + 128;
    this.rrect(36, y - 20, K.WIDTH - 36, y + 20, 14, { fill: C_CARD_HI });
    this.coinChip(58, y, this.earned, 13);
    this.vtext(K.WIDTH - 52, y, `gesamt ${this.coins}`, 10, C_MUTED, false, "e");
    this.vtext(K.WIDTH / 2 + 6, y,
               this.difficulty === "easy" ? "einfacher Modus zahlt nicht"
                 : `x${K.MODE_COINS[this.difficulty]} Muenzen`, 9,
               K.MODE_COLORS[this.difficulty], false);

    y += 44;
    this.vtext(40, y, "IM LAUF", 9, "#6a7398", true, "w");
    const zeilen = [[this.runShot, "abgeschossen"], [this.runStomp, "plattgesprungen"],
                    [this.runItems, "Items"], [this.runSprings, "Federn"]];
    let bx = (K.WIDTH - zeilen.length * 68 + 4) / 2;
    for (const [wert, label] of zeilen) {
      this.rrect(bx, y + 12, bx + 64, y + 58, 12, { fill: C_CARD_HI });
      this.vtext(bx + 32, y + 28, String(wert), 16, C_LABEL);
      this.vtext(bx + 32, y + 47, label, 7, C_MUTED, false);
      bx += 68;
    }

    y += 76;
    const anteil = clamp(this.xp / Math.max(1, this.rankNeed), 0, 1);
    this.vtext(40, y, `RANG ${this.rank}`, 9, K.C_RANK, true, "w");
    this.vtext(K.WIDTH - 40, y, `+${this.xpGain} Erfahrung`, 9,
               this.xpGain ? K.C_RANK : C_MUTED, false, "e");
    this.rrect(40, y + 10, K.WIDTH - 40, y + 20, 5, { fill: "#2b2358" });
    this.rrect(40, y + 10, 40 + (K.WIDTH - 80) * anteil, y + 20, 5,
               { fill: K.C_RANK });
    this.vtext(K.WIDTH / 2, y + 32,
               this.ranksUp.length
                 ? `RANG ${this.ranksUp[this.ranksUp.length - 1][0]}: `
                   + this.ranksUp[this.ranksUp.length - 1][1]
                 : `Rang ${this.rank + 1} in ${this.rankNeed - this.xp} Erfahrung`,
               9, this.ranksUp.length ? "#38e0b0" : C_MUTED, false);

    y += 50;
    const done = defs.filter(([k, , g]) => (this.quests[k] | 0) >= g).length;
    this.vtext(40, y, "TAGESAUFGABEN", 9, "#6a7398", true, "w");
    this.vtext(K.WIDTH - 40, y, `${done} von ${defs.length}`, 9,
               done === defs.length ? "#38e0b0" : C_MUTED, false, "e");
    let yy = y + 16;
    for (const [key, text, goal] of defs) {
      const have = Math.min(goal, this.quests[key] | 0);
      const fertig = have >= goal;
      this.vtext(40, yy + 6, text, 9, fertig ? "#38e0b0" : "#c9d3f5", false, "w");
      this.rrect(K.WIDTH - 150, yy + 2, K.WIDTH - 40, yy + 10, 4,
                 { fill: "#2b2358" });
      this.rrect(K.WIDTH - 150, yy + 2, K.WIDTH - 150 + 110 * have / goal,
                 yy + 10, 4, { fill: fertig ? "#38e0b0" : K.C_ASTRAL });
      yy += 20;
    }

    y = yy + 12;
    const offen = SKINS.filter(s => s.unlock !== null && !this.owned.has(s.key));
    let txt = "Alle Rekord-Skins gesammelt";
    if (offen.length) {
      const ziel = offen.reduce((a, b) => (a.unlock < b.unlock ? a : b));
      const fehlt = ziel.unlock - Math.max(...Object.values(this.highscores));
      txt = `Naechster Rekord-Skin: ${ziel.name} - noch ${Math.max(0, fehlt)} Punkte`;
    }
    this.vtext(K.WIDTH / 2, y + 6, txt, 9, K.C_DUST, false);
    this.vtext(K.WIDTH / 2, bot + 26, "Tippen - nochmal", 12, "#ffffff");
    c.restore();
  }

  drawQuickOver(score) {
    const d = this.d;
    const ein = Math.min(1, this.overT / 7);
    const y = this.sh - (86 * this.scale) * ein, h = 54 * this.scale;
    d.rc(0, y - h, this.sw, y + h, { fill: "#0b1026", stipple: "gray75" });
    d.ln([0, y - h, this.sw, y - h], { fill: K.C_ASTRAL, width: 2 });
    d.tx(this.sw / 2, y - 14 * this.scale,
         `Score ${score}   -   Best ${this.highscore}`,
         { size: this.fs(16), fill: "#ffffff" });
    const puls = 0.5 + 0.5 * Math.sin(this.frame * 0.12);
    d.tx(this.sw / 2, y + 14 * this.scale, "Tippen - nochmal",
         { size: this.fs(12), fill: mix("#8b93c7", "#ffffff", puls) });
  }

  overlay(title, subtitle) {
    const d = this.d;
    d.rc(0, 0, this.sw, this.sh, { fill: "#0b1b2b", stipple: "gray50" });
    d.tx(this.sw / 2, this.sh / 2 - 40 * this.scale, title,
         { size: this.fs(34), fill: "white" });
    d.tx(this.sw / 2, this.sh / 2 + 46 * this.scale, subtitle,
         { size: this.fs(14), fill: "#dbe7f3", bold: false });
  }

  // ---- Startmenue

  drawMainMenu() {
    const d = this.d;
    d.rc(0, 0, this.sw, this.sh, { fill: "#050817", stipple: "gray50" });
    const t = this.frame * 0.045;
    const accent = K.C_ASTRAL;

    this.vtext(K.WIDTH / 2, 46, "Doodle Jump", 30, "#ffffff");
    this.vtext(K.WIDTH / 2, 70, "ins Weltall", 10, C_MUTED, false);

    // --- Profilkarte mit dem angelegten Skin
    this.rrect(24, 88, K.WIDTH - 24, 158, 18, { fill: C_CARD_HI });
    this.rrect(24, 88, K.WIDTH - 24, 158, 18, { outline: C_EDGE, width: 1.2 });
    const bob = Math.sin(t * 1.6) * 3;
    this.drawDoodler(this.toX(70), this.toY(143 + bob), this.skin,
                     { fxs: 0.72 * this.scale, fys: 0.72 * this.scale });
    this.vtext(112, 110, this.skin.name, 14, C_LABEL, true, "w");
    const [rname, rcol] = K.RARITY[this.skin.rarity];
    this.vtext(112, 128, rname, 9, rcol, false, "w");
    const st = this.stars(this.skinKey);
    for (let i = 0; i < 5; i++) {
      const filled = i < Math.round(st / 2);
      const cx = this.toX(116 + i * 13), cy = this.toY(145), r = 4.2 * this.scale;
      const pts = [];
      for (let k = 0; k < 10; k++) {
        const a = -Math.PI / 2 + k * Math.PI / 5;
        const rr = k % 2 === 0 ? r : r * 0.44;
        pts.push(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
      }
      d.pg(pts, { fill: filled ? "#ffd54a" : "#3b3070" });
    }
    if (st) this.vtext(182, 145, `${st} Sterne`, 9, "#ffd54a", false, "w");
    const ab = this.ability;
    if (ab !== null) {
      const ready = this.charge >= K.ABILITY_CHARGE;
      this.rrect(K.WIDTH - 132, 100, K.WIDTH - 38, 122, 11,
                 { fill: mix(C_CARD, ab.col, 0.26) });
      this.rrect(K.WIDTH - 132, 100, K.WIDTH - 38, 122, 11,
                 { outline: ready ? ab.col : C_EDGE, width: 1.2 });
      this.vtext(K.WIDTH - 85, 111, ab.name, 8, ready ? ab.col : C_MUTED);
      this.vtext(K.WIDTH - 85, 136,
                 ready ? "bereit"
                       : `${Math.floor(this.charge / K.ABILITY_CHARGE * 100)} % geladen`,
                 8, C_MUTED, false);
    }

    // --- Primaerknopf
    {
      const [, , y0, y1] = MENU_ITEMS[0];
      let label = MENU_ITEMS[0][1];
      if (this.runActive && !this.gameOver) label = "Weiter";
      const sel = this.menuCursor === 0;
      const pulse = 0.5 + 0.5 * Math.sin(this.frame * 0.1);
      const r = (y1 - y0) / 2;
      if (sel) {                       // Schein aussen, der Knopf bleibt lila
        ["gray12", "gray25"].forEach((sp, i) => {
          const g = (2 - i) * 4 * (0.6 + 0.4 * pulse);
          this.rrect(24 - g, y0 - g, K.WIDTH - 24 + g, y1 + g, r + g,
                     { fill: C_GLOW, stipple: sp });
        });
      }
      this.rrect(24, y0, K.WIDTH - 24, y1, r,
                 { fill: mix(accent, C_GLOW, sel ? 0.18 * pulse : 0) });
      if (sel) this.rrect(24, y0, K.WIDTH - 24, y1, r,
                          { outline: C_GLOW, width: 1.8 });
      this.vtext(K.WIDTH / 2, (y0 + y1) / 2, label, 17, "#ffffff");
    }

    // --- Gruppe
    const top = MENU_ITEMS[1][2];
    const bottom = MENU_ITEMS[MENU_ITEMS.length - 1][3];
    this.rrect(24, top, K.WIDTH - 24, bottom, 16, { fill: C_CARD });
    this.rrect(24, top, K.WIDTH - 24, bottom, 16, { outline: C_EDGE, width: 1.2 });
    MENU_ITEMS.slice(1).forEach(([key, label, ry0, ry1], n) => {
      const i = n + 1, mid = (ry0 + ry1) / 2;
      const sel = this.menuCursor === i;
      if (sel) {
        const pl = 0.7 + 0.3 * (0.5 + 0.5 * Math.sin(this.frame * 0.1));
        this.glowRect(27, ry0 + 2, K.WIDTH - 27, ry1 - 2, 12, pl);
      }
      if (i > 1 && !sel) {
        d.ln([this.toX(66), this.toY(ry0), this.toX(K.WIDTH - 36), this.toY(ry0)],
             { fill: C_SEP });
      }
      this.rowIcon(key, 48, mid, sel ? C_GLOW : C_MUTED);
      this.vtext(66, mid, label, 14, sel ? "#ffffff" : C_LABEL, true, "w");
      const [val, vcol] = this.rowValue(key);
      this.vtext(K.WIDTH - 48, mid, val, 11, vcol, false, "e");
      this.chevron(K.WIDTH - 36, mid, sel ? C_GLOW : C_MUTED);
    });

    this.vtext(K.WIDTH / 2, bottom + 13, K.MODE_HINTS[this.difficulty], 9,
               K.MODE_COLORS[this.difficulty], false);

    // --- Rang
    const ry = bottom + 32;
    const anteil = clamp(this.xp / Math.max(1, this.rankNeed), 0, 1);
    this.vtext(24, ry, `RANG ${this.rank}`, 10, K.C_RANK, true, "w");
    this.vtext(K.WIDTH - 24, ry, `${this.xp} / ${this.rankNeed}`, 9, C_MUTED,
               false, "e");
    this.rrect(24, ry + 9, K.WIDTH - 24, ry + 17, 4, { fill: "#2b2358" });
    this.rrect(24, ry + 9, 24 + (K.WIDTH - 48) * anteil, ry + 17, 4,
               { fill: K.C_RANK });

    // --- Fusszeile mit den drei Waehrungen
    const py = ry + 48;
    this.rrect(24, py - 16, K.WIDTH - 24, py + 16, 16, { fill: C_CARD });
    this.rrect(24, py - 16, K.WIDTH - 24, py + 16, 16,
               { outline: C_EDGE, width: 1.2 });
    this.vtext(44, py, `Best ${this.highscore}`, 11, C_LABEL, true, "w");
    this.coinChip(K.WIDTH - 232, py, this.coins, 11);
    this.dustChip(K.WIDTH - 148, py, this.dust, 11);
    this.ticketChip(K.WIDTH - 64, py, this.tickets, 11);
    if (this.wolkeNote > 0) {                 // Antwort aus der Wolke
      const tt = Math.min(1, this.wolkeNote / 40);
      this.vtext(K.WIDTH / 2, py + 30, this.wolkeText, 10,
                 mix("#ffffff", K.C_RANK, tt), false);
    } else if (this.loginNote > 0) {
      const tt = Math.min(1, this.loginNote / 40);
      this.vtext(K.WIDTH / 2, py + 30, this.loginText || "Neuer Tag",
                 10, mix("#ffffff", K.C_TICKET, tt), false);
    }
    this.vtext(K.WIDTH / 2, py + 52,
               "Tippen waehlt   -   ziehen lenkt, tippen schiesst", 9,
               "#4b5585", false);
  }

  rowValue(key) {
    if (key === "mode") return [K.MODE_NAMES[this.difficulty],
                                K.MODE_COLORS[this.difficulty]];
    if (key === "quests") {
      const defs = this.questDefs();
      const done = defs.filter(([k, , g]) => (this.quests[k] | 0) >= g).length;
      if (this.loginReady || this.questReady) return ["abholen!", K.C_TICKET];
      if (defs.length && done === defs.length) return ["erledigt", "#38e0b0"];
      return [`${done} von ${defs.length}`, C_MUTED];
    }
    if (key === "liste") {
      if (!this.wolke || !this.wolke.eingerichtet) {
        return ["nicht eingerichtet", C_MUTED];
      }
      return ["Top 100", K.C_RANK];
    }
    if (key === "konto") {
      if (!this.wolke || !this.wolke.eingerichtet) return ["aus", C_MUTED];
      return this.wolke.angemeldet
        ? [this.wolke.name || "angemeldet", "#38e0b0"]
        : ["anmelden", K.C_TICKET];
    }
    if (key === "skins") return [`${this.owned.size} von ${SKINS.length}`, C_MUTED];
    if (key === "gacha") return [`${K.SPIN_COST} Muenzen`,
                                 this.coins < K.SPIN_COST ? C_MUTED : "#f2c14e"];
    if (key === "slots") return [this.tickets === 1 ? "1 Ticket"
                                                   : `${this.tickets} Tickets`,
                                 this.tickets ? K.C_TICKET : C_MUTED];
    if (key === "tilt") return [this.tiltOn ? "an" : "aus",
                                this.tiltOn ? "#38e0b0" : C_MUTED];
    return ["", C_MUTED];
  }

  dustChip(x, y, amount, size = 13) {
    const d = this.d;
    const cx = this.toX(x), cy = this.toY(y), r = 8.5 * this.scale;
    const pts = [];
    for (let k = 0; k < 8; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 4;
      const rr = k % 2 === 0 ? r : r * 0.32;
      pts.push(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
    }
    d.pg(pts, { fill: K.C_DUST, outline: "#2b6f86",
                width: Math.max(1, 1.2 * this.scale) });
    d.ov(cx - r * 0.2, cy - r * 0.2, cx + r * 0.2, cy + r * 0.2,
         { fill: "#ffffff" });
    d.tx(cx + r + 5 * this.scale, cy, String(amount),
         { anchor: "w", fill: "#cdeeff", size: this.fs(size) });
  }

  rowIcon(key, x, y, col) {
    const d = this.d, X = v => this.toX(v), Y = v => this.toY(v);
    const w = Math.max(1, 2 * this.scale);
    if (key === "mode") {
      [4, 7, 10].forEach((h, i) => {
        d.ln([X(x - 6 + i * 6), Y(y + 5), X(x - 6 + i * 6), Y(y + 5 - h)],
             { fill: col, width: w, round: true });
      });
    } else if (key === "quests") {
      d.ov(X(x - 8), Y(y - 8), X(x + 8), Y(y + 8), { outline: col, width: w });
      d.ln([X(x - 4), Y(y), X(x - 1), Y(y + 3.5), X(x + 4.5), Y(y - 4)],
           { fill: col, width: w, round: true });
    } else if (key === "skins") {
      for (const dx of [-4.5, 3.5]) {
        for (const dy of [-4.5, 3.5]) {
          d.rc(X(x + dx - 2.5), Y(y + dy - 2.5), X(x + dx + 2.5), Y(y + dy + 2.5),
               { outline: col, width: w });
        }
      }
    } else if (key === "gacha") {
      d.ov(X(x - 8), Y(y - 8), X(x + 8), Y(y + 8), { outline: col, width: w });
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 4 + this.frame * 0.01;
        d.ln([X(x - Math.cos(a) * 7), Y(y - Math.sin(a) * 7),
              X(x + Math.cos(a) * 7), Y(y + Math.sin(a) * 7)], { fill: col });
      }
    } else if (key === "slots") {
      for (let i = 0; i < 3; i++) {
        d.rc(X(x - 8 + i * 6), Y(y - 6), X(x - 4 + i * 6), Y(y + 6),
             { outline: col, width: w });
      }
    } else if (key === "liste") {          // Siegertreppchen
      [[-6.5, 5], [0, 9], [6.5, 3]].forEach(([dx, h]) => {
        d.rc(X(x + dx - 3), Y(y + 6 - h), X(x + dx + 3), Y(y + 6),
             { outline: col, width: w });
      });
    } else if (key === "konto") {          // Kopf und Schultern
      d.ov(X(x - 4), Y(y - 8), X(x + 4), Y(y), { outline: col, width: w });
      d.arc(X(x - 8), Y(y + 1), X(x + 8), Y(y + 14), 0, 180,
            { style: "arc", outline: col, width: w });
    } else if (key === "tilt") {
      d.pg([X(x - 5), Y(y - 8), X(x + 7), Y(y - 5), X(x + 4), Y(y + 8),
            X(x - 8), Y(y + 5)], { outline: col, width: w });
    }
  }

  // ---- Tagesaufgaben und Slotmaschine

  ticketChip(x, y, amount, size = 13) {
    const d = this.d;
    const cx = this.toX(x), cy = this.toY(y), r = 8 * this.scale;
    d.pg([cx, cy - r, cx + r * 0.75, cy + r * 0.1, cx + r * 0.35, cy + r * 0.85,
          cx - r * 0.35, cy + r * 0.85, cx - r * 0.75, cy + r * 0.1],
         { fill: K.C_TICKET, outline: "#7d2f06", width: Math.max(1, 1.5 * this.scale) });
    d.pg([cx, cy - r * 0.35, cx + r * 0.33, cy + r * 0.25, cx, cy + r * 0.7,
          cx - r * 0.33, cy + r * 0.25], { fill: "#ffd166" });
    d.tx(cx + r + 6 * this.scale, cy, String(amount),
         { anchor: "w", fill: "#ffd0a8", size: this.fs(size) });
  }

  // Bestenliste: die besten im gewaehlten Modus
  drawListe() {
    this.panel(-K.BG_MARGIN, -K.BG_MARGIN - this.mo, K.WIDTH + K.BG_MARGIN,
               640 + K.BG_MARGIN + this.mo, "#070c1e");

    this.vtext(K.WIDTH / 2, 48,
               `${K.MODE_NAMES[this.difficulty]} - oben tippen wechselt`, 9,
               K.MODE_COLORS[this.difficulty], false);
    this.modeBtn = [K.WIDTH / 2 - 90, 38, K.WIDTH / 2 + 90, 60];

    const zeilen = this.liste[this.difficulty];
    if (zeilen === undefined && this.listeFehler) {
      this.vtext(K.WIDTH / 2, 228, "Die Liste kam nicht an", 13, "#ff8a8a");
      this.vtext(K.WIDTH / 2, 250, this.listeFehler, 9, C_MUTED, false);
      this.vtext(K.WIDTH / 2, 272, "tippen versucht es noch einmal", 9,
                 "#6a7398", false);
    } else if (zeilen === undefined) {
      const p = ".".repeat(1 + Math.floor(this.frame / 10) % 3);
      this.vtext(K.WIDTH / 2, 240, `wird geholt${p}`, 13, C_MUTED);
    } else if (!zeilen.length) {
      this.vtext(K.WIDTH / 2, 230, "noch kein Eintrag", 13, C_MUTED);
      this.vtext(K.WIDTH / 2, 252, "spiel einen Lauf - er zaehlt sofort", 10,
                 "#6a7398", false);
    } else {
      let y = 74;
      for (const zeile of zeilen.slice(0, 14)) {
        const ich = this.wolke && zeile.name === this.wolke.name;
        if (ich) this.glowRect(20, y, K.WIDTH - 20, y + 30, 10, 0.7, K.C_RANK);
        else {
          this.rrect(20, y, K.WIDTH - 20, y + 30, 10, { fill: C_CARD });
          this.rrect(20, y, K.WIDTH - 20, y + 30, 10,
                     { outline: C_EDGE, width: 1 });
        }
        const platz = zeile.platz | 0;
        const farbe = platz >= 1 && platz <= 3
          ? ["#ffd54a", "#d8d8e8", "#d8a15a"][platz - 1] : C_MUTED;
        this.vtext(42, y + 15, String(platz), 13, farbe);
        this.vtext(74, y + 15, String(zeile.name || "?"), 12,
                   ich ? "#ffffff" : C_LABEL, true, "w");
        this.vtext(K.WIDTH - 40, y + 15, `${zeile.punkte | 0}`, 13, C_LABEL,
                   true, "e");
        y += 34;
      }
    }
    const platz = this.listePlatz[this.difficulty];
    const dabei = !!(this.wolke && this.wolke.angemeldet);
    this.kontoBtn = null;
    if (platz) {
      this.vtext(K.WIDTH / 2, 640 - 86, `Dein Platz: ${platz}`, 12, K.C_RANK);
    } else if (dabei) {
      this.vtext(K.WIDTH / 2, 640 - 86,
                 `noch kein Lauf ueber ${K.MELDE_AB} Punkten in diesem Modus`,
                 10, C_MUTED, false);

      this.kontoBtn = [K.WIDTH / 2 - 96, 640 - 100, K.WIDTH / 2 + 96, 640 - 72];
      const [x0, y0, x1, y1] = this.kontoBtn;
      this.rrect(x0, y0, x1, y1, 14, { fill: mix(C_CARD, K.C_TICKET, 0.28) });
      this.rrect(x0, y0, x1, y1, 14, { outline: K.C_TICKET, width: 1.2 });
      this.vtext(K.WIDTH / 2, (y0 + y1) / 2, "Konto - selbst mitspielen", 11,
                 K.C_TICKET);

  drawQuests() {

               640 + K.BG_MARGIN + this.mo, "#070c1e");
    this.vtext(K.WIDTH / 2, 26, "TAGESAUFGABEN", 19, "#ffffff");
    this.ticketChip(K.WIDTH - 58, 26, this.tickets);
    this.vtext(K.WIDTH / 2, 48,
               "taeglich neu gezogen - Tickets sind fuer die Slotmaschine",
               9, "#6a7398", false);

    // --- Anmelde-Serie: sieben Felder, eins je Tag
    const sy = 78, bw = (K.WIDTH - 48 - 6 * 6) / 7;
    this.vtext(24, sy - 14, "ANMELDE-SERIE", 9, "#6a7398", true, "w");

               `Tag ${this.streak} von ${K.LOGIN_STREAK.length}`, 9,
               this.streak ? K.C_TICKET : "#6a7398", false, "e");
    K.LOGIN_STREAK.forEach(([muenzen, tickets, skin], i) => {
      const bx = 24 + i * (bw + 6);
      const heute = i === this.streak - 1;
      const fertig = i < this.streak - 1 || (heute && this.streakClaimed);
      const col = heute ? K.C_TICKET : (fertig ? "#38e0b0" : "#2a3255");
      if (heute && this.loginReady) {
        this.glowRect(bx - 2, sy - 2, bx + bw + 2, sy + 36, 9,
                      0.6 + 0.4 * (0.5 + 0.5 * Math.sin(this.frame * 0.12)),
                      K.C_TICKET);
      }
      this.rrect(bx, sy, bx + bw, sy + 34, 8,
                 { fill: mix("#101838", col, fertig ? 0.3 : 0.12) });
      this.rrect(bx, sy, bx + bw, sy + 34, 8,
                 { outline: col, width: heute ? 1.6 : 1 });
      const mitte = bx + bw / 2;
      this.vtext(mitte, sy + 9, String(i + 1), 8,
                 fertig ? "#ffffff" : "#6a7398", false);

      else if (tickets) this.ticketChip(mitte - 8, sy + 22, tickets, 8);

    // --- Knopf fuer die Tagesbelohnung
    const [bx0, by0, bx1, by1] = STREAK_BTN;

      const puls = 0.5 + 0.5 * Math.sin(this.frame * 0.12);
      this.rrect(bx0, by0, bx1, by1, (by1 - by0) / 2,
                 { fill: mix("#101838", K.C_TICKET, 0.28 + 0.12 * puls) });
      this.rrect(bx0, by0, bx1, by1, (by1 - by0) / 2,
                 { outline: K.C_TICKET, width: 1.6 });
      this.vtext((bx0 + bx1) / 2, (by0 + by1) / 2 - 5,
                 "TAGESBELOHNUNG EINSAMMELN", 12, "#ffffff");
      this.vtext((bx0 + bx1) / 2, (by0 + by1) / 2 + 9,
                 this.streakReward(this.streak), 9, "#ffd0a8", false);
    } else {
      this.vtext(K.WIDTH / 2, (by0 + by1) / 2,
                 "Tagesbelohnung abgeholt - morgen geht die Serie weiter",
                 9, "#4b5585", false);

    let y = K.QUEST_TOP;
    for (const [key, text, goal] of this.questDefs()) {
      const have = Math.min(goal, this.quests[key] | 0);
      const done = have >= goal;

      this.panel(16, y - 22, K.WIDTH - 16, y + 26, "#101838",
                 done ? "#38e0b0" : "#2a3255", 2);

      this.panel(bx0, y + 10, bx0 + (bx1 - bx0) * have / goal, y + 19,
                 done ? "#38e0b0" : K.C_ASTRAL);
      this.vtext(K.WIDTH - 30, y + 14, done ? "geschafft" : `${have} / ${goal}`,
                 10, col, true, "e");
      if (done) this.vtext(K.WIDTH - 30, y - 6, "OK", 12, "#38e0b0", true, "e");
      y += K.QUEST_GAP;
    }
    const alle = this.questsDone();
    this.questBtn = [16, y - 10, K.WIDTH - 16, y + 58];
    if (this.questReady) {
      const puls = 0.5 + 0.5 * Math.sin(this.frame * 0.12);
      this.glowRect(16, y - 10, K.WIDTH - 16, y + 58, 14, 0.6 + 0.4 * puls,

    this.vtext(K.WIDTH / 2, y + 8,
               this.questReady ? "PRAEMIE EINSAMMELN" : "ALLE VIER GESCHAFFT", 13,
               this.questReady ? "#ffffff" : (alle ? K.C_TICKET : "#6a7398"));
    this.vtext(K.WIDTH / 2, y + 28,
               `${K.QUEST_TICKETS} Flammenticket  +  ${K.QUEST_COINS} Muenzen`,
               11, alle ? "#ffffff" : "#6a7398");
    this.vtext(K.WIDTH / 2, y + 46,
               this.questReady ? "hier tippen"
                 : (this.questClaimed ? "eingesammelt" : "erst alle vier schaffen"),
               9, this.questReady ? "#ffd0a8"
                 : (this.questClaimed ? "#38e0b0" : "#6a7398"), false);
    this.vtext(K.WIDTH / 2, 640 - 84,
               "Jeden Tag vorbeischauen fuellt die Serie oben auf",
               10, "#8b93c7", false);
    this.backButton();
    this.drawWinPop();
