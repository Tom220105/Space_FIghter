  drawConfetti() {
    const d = this.d;
    for (const [x, y, , , ang, , col, life, w, h] of this.confetti) {
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const bw = w * (0.35 + 0.65 * Math.abs(Math.cos(ang * 1.7)));
      const pts = [];
      for (const [dx, dy] of [[-bw / 2, -h / 2], [bw / 2, -h / 2],
                              [bw / 2, h / 2], [-bw / 2, h / 2]]) {
        pts.push(this.toX(x + dx * ca - dy * sa), this.toY(y + dx * sa + dy * ca));
      }
      const o = { fill: col };
      if (life < 26) o.stipple = life > 13 ? "gray50" : "gray25";
      d.pg(pts, o);
    }
  }

  drawWinPop() {
    if (!this.pop) { this.drawConfetti(); return; }
    const [t, result, col] = this.pop;
    const d = this.d;
    d.rc(0, 0, this.sw, this.sh, { fill: "#05060f", stipple: "gray50" });
    this.drawConfetti();
    if (result === null) return;        // Zehnerzug bringt sein eigenes Fenster
    const [name, note, , key, stars] = result;
    const u = Math.min(1, t / K.POP_GROW);
    const k1 = 1.70158;
    const sc = 1 + (k1 + 1) * (u - 1) ** 3 + k1 * (u - 1) ** 2;
    const cx = K.WIDTH / 2, cy = K.HEIGHT * 0.42;
    const w = 150 * sc, h = 116 * sc;
    this.rrect(cx - w, cy - h, cx + w, cy + h, 22 * sc, { fill: C_CARD });
    this.rrect(cx - w, cy - h, cx + w, cy + h, 22 * sc,
               { outline: col, width: 2 });
    if (u < 0.35) return;
    const puls = 0.5 + 0.5 * Math.sin(this.frame * 0.12);
    this.vtext(cx, cy - h + 26, "GEWONNEN", 13,
               mix(col, "#ffffff", 0.35 + 0.25 * puls));
    if (key !== null) {
      const sk = SKIN_BY_KEY[key];
      this.drawDoodler(this.toX(cx - 92), this.toY(cy + 28), sk,
                       { fxs: 0.78 * this.scale, fys: 0.78 * this.scale });
      this.vtext(cx + 26, cy - 26, name, 17, col);
      this.vtext(cx + 26, cy - 4, K.RARITY[sk.rarity][0].toUpperCase(), 9, col,
                 false);
      this.vtext(cx + 26, cy + 20, note, 9, "#ffffff", false);
      this.starRow(cx - 52, cy + 54, stars, 5.5);
    } else {
      this.coinChip(cx - 34, cy - 6, note.replace("+", ""), 22);
      this.vtext(cx, cy + 34, "Muenzen", 11, "#ffe9a8", false);
    }
    this.vtext(cx, cy + h - 16, "Tippen schliesst", 8, C_MUTED, false);
  }

  // Das Fenster des Zehnerzugs: zehn Kaestchen, die nacheinander aufklappen
  drawMulti() {
    const d = this.d;
    d.rc(0, 0, this.sw, this.sh, { fill: "#05060f", stipple: "gray75" });
    this.drawConfetti();
    const bw = 62, bh = 78, gap = 8, cols = 5;
    const gw = cols * bw + (cols - 1) * gap;
    const x0 = (K.WIDTH - gw) / 2, y0 = 176;
    const unten = y0 + 2 * bh + gap + 54;
    this.rrect(24, 118, K.WIDTH - 24, unten, 20, { fill: C_CARD });
    this.rrect(24, 118, K.WIDTH - 24, unten, 20, { outline: C_EDGE, width: 1.4 });
    this.vtext(K.WIDTH / 2, 146, `${K.MULTI_N} ZIEHUNGEN`, 15, "#ffffff");
    this.multi.forEach(([name, note, col, key], i) => {
      const t = this.multiT - 4 - i * 4;
      if (t <= 0) return;
      const u = Math.min(1, t / 9), k1 = 1.70158;
      const sc = 1 + (k1 + 1) * (u - 1) ** 3 + k1 * (u - 1) ** 2;
      const bx = x0 + (i % cols) * (bw + gap) + bw / 2;
      const by = y0 + Math.floor(i / cols) * (bh + gap) + bh / 2;
      const w = bw / 2 * sc, h = bh / 2 * sc;
      this.rrect(bx - w, by - h, bx + w, by + h, 10 * sc,
                 { fill: mix(C_CARD_HI, col, 0.18) });
      this.rrect(bx - w, by - h, bx + w, by + h, 10 * sc,
                 { outline: col, width: key ? 1.6 : 1.2 });
      if (u < 0.6) return;
      if (key !== null) {
        this.drawDoodler(this.toX(bx), this.toY(by + 12), SKIN_BY_KEY[key],
                         { fxs: 0.42 * this.scale, fys: 0.42 * this.scale });
        const kurz = name.length <= 11 ? name : name.slice(0, 10) + ".";
        this.vtext(bx, by + h - 9, kurz, 7, col, false);
      } else {
        this.coinChip(bx - 16, by - 4, note.replace("+", ""), 10);
        this.vtext(bx, by + h - 9, "Muenzen", 7, col, false);
      }
    });
    const yy = y0 + 2 * bh + gap + 22;
    const neue = this.multi.filter(r => r[1].startsWith("NEU")).length;
    const gut = this.multi.filter(r => r[3] !== null
      && ["epic", "legendary", "mythic"].includes(SKIN_BY_KEY[r[3]].rarity)).length;
    this.vtext(K.WIDTH / 2, yy, `${neue} neu   -   ${gut} episch oder besser`,
               10, C_MUTED, false);
    this.vtext(K.WIDTH / 2, yy + 20, "Tippen schliesst", 9, "#6a7398", false);
  }

  drawWheel(cx, cy, R) {
    const d = this.d;
    const scx = this.toX(cx), scy = this.toY(cy), sR = R * this.scale;
    const glow = mix("#3b477f", K.WHEEL[this.wheelIdx][3], this.winGlow ? 0.5 : 0);
    d.ov(scx - sR - 9 * this.scale, scy - sR - 9 * this.scale,
         scx + sR + 9 * this.scale, scy + sR + 9 * this.scale,
         { fill: "#1a2144", outline: glow, width: Math.max(1, 3 * this.scale) });
    WHEEL_SLICES.forEach(([idx, st, w], n) => {
      let col = K.WHEEL[idx][3];
      if (n % 2) col = mix(col, "#ffffff", 0.10);
      d.arc(scx - sR, scy - sR, scx + sR, scy + sR,
            90 + this.wheelRot - st * 360, -w * 360,
            { style: "pieslice", fill: col, outline: "#0b1026",
              width: Math.max(1, this.scale) });
    });
    const hr = 34 * this.scale;
    d.ov(scx - hr, scy - hr, scx + hr, scy + hr,
         { fill: "#101838", outline: "#3b477f", width: Math.max(1, 3 * this.scale) });
    if (this.wheelSpinning) this.vtext(cx, cy - 6, "...", 15, "#8b93c7");
    else this.vtext(cx, cy - 7, "DREHEN", 11,
                    this.coins >= K.SPIN_COST ? "#ffffff" : "#6a7398");
    this.coinChip(cx - 20, cy + 11, K.SPIN_COST, 11);
    const py0 = cy - R - 17;
    d.pg([this.toX(cx - 11), this.toY(py0), this.toX(cx + 11), this.toY(py0),
          this.toX(cx), this.toY(cy - R + 13)],
         { fill: "#ffffff", outline: "#101838", width: Math.max(1, 2 * this.scale) });
  }
  drawWheelResult() {
    const d = this.d;
    this.panel(14, 640 - 118, K.WIDTH - 14, 640 - 34, "#101838", "#2a3255", 2);
    if (this.wheelSpinning) {
      const dots = ".".repeat(1 + Math.floor(this.frame / 8) % 3);
      this.vtext(K.WIDTH / 2, 640 - 76, `dreht${dots}`, 15, "#8b93c7");
      return;
    }
    if (!this.wheelResult) { this.drawTeaser(); return; }
    const [name, note, col, key, stars] = this.wheelResult;
    if (this.winGlow > 0) {
      const gx = this.toX(key ? 52 : K.WIDTH / 2);
      const gy = this.toY(640 - (key ? 62 : 78));
      const g = (34 - this.winGlow) * 1.5 * this.scale;
      d.ov(gx - g, gy - g, gx + g, gy + g,
           { outline: col, width: Math.max(1, 3 * this.scale * this.winGlow / 34) });
    }
    if (key) {
      this.drawDoodler(this.toX(52), this.toY(640 - 62), SKIN_BY_KEY[key],
                       { fxs: 0.58 * this.scale, fys: 0.58 * this.scale });
      this.vtext(K.WIDTH / 2 + 14, 640 - 96, name, 16, col);
      this.vtext(K.WIDTH / 2 + 14, 640 - 76, note, 11, "#ffffff");
      this.vtext(K.WIDTH / 2 + 14, 640 - 60,
                 K.RARITY[SKIN_BY_KEY[key].rarity][0].toUpperCase(), 9, col);
      this.starRow(K.WIDTH / 2 - 66, 640 - 45, stars, 5);
    } else {
      this.vtext(K.WIDTH / 2, 640 - 84, note, 20, col);
      this.vtext(K.WIDTH / 2, 640 - 60, name, 12, "#ffffff");
    }
  }
  previewSkin() {
    const pool = POOLS.mythic;
    return SKIN_BY_KEY[pool[Math.floor(this.frame / 280) % pool.length]];
  }
  drawTeaser() {
    const d = this.d, sk = this.previewSkin();
    const t = (this.frame % 280) / 280;
    const pop = Math.min(1, t * 9) * Math.min(1, (1 - t) * 9);
    const col = K.RARITY.mythic[1];
    const cx = 52, cy = 640 - 62;
    [[26, col, "gray12"], [18, "#ffffff", "gray12"], [11, "#ffffff", "gray25"]]
      .forEach(([g, c2, st], i) => {
        const gg = (g + 2.5 * Math.sin(this.frame * 0.07 + i)) * pop * this.scale;
        d.ov(this.toX(cx) - gg, this.toY(cy) - gg, this.toX(cx) + gg, this.toY(cy) + gg,
             { fill: c2, stipple: st });
      });
    this.drawDoodler(this.toX(cx), this.toY(cy + 16), sk,
                     { fxs: (0.32 + 0.26 * pop) * this.scale,
                       fys: (0.32 + 0.26 * pop) * this.scale });
    this.vtext(K.WIDTH / 2 + 14, 640 - 92, "SO ETWAS STECKT DRIN", 11, col);
    this.vtext(K.WIDTH / 2 + 14, 640 - 72, sk.name, 14, "#ffffff");
    if (this.coins >= K.SPIN_COST) {
      const pulse = 0.5 + 0.5 * Math.sin(this.frame * 0.18);
      this.vtext(K.WIDTH / 2 + 14, 640 - 52, "AUFS RAD TIPPEN", 10,
                 mix("#6a7398", "#ffffff", pulse));
    } else {
      this.vtext(K.WIDTH / 2 + 14, 640 - 52,
                 `zu wenig Muenzen - ${K.COINS_PER_SCORE} Punkte = 1`, 10, "#ff7a7a");
    }
  }

  // ---- Sammlung

  drawSkins() {
    this.panel(-K.BG_MARGIN, -K.BG_MARGIN - this.mo, K.WIDTH + K.BG_MARGIN,
               640 + K.BG_MARGIN + this.mo, "#070c1e");
    this.vtext(K.WIDTH / 2, 28, "SAMMLUNG", 21, "#ffffff");
    this.vtext(14, 52, `${this.owned.size} / ${SKINS.length} Skins`, 10, "#8b93c7", true, "w");
    this.coinChip(K.WIDTH - 96, 28, this.coins);
    const tw = 98, th = 114, y0 = 68;
    const x0 = (K.WIDTH - K.GRID_COLS * tw) / 2;
    for (let idx = this.gridTop * K.GRID_COLS;
         idx < Math.min(SKINS.length, (this.gridTop + K.GRID_ROWS) * K.GRID_COLS); idx++) {
      const col = idx % K.GRID_COLS, row = Math.floor(idx / K.GRID_COLS) - this.gridTop;
      this.drawSkinTile(SKINS[idx], x0 + col * tw + 3, y0 + row * th + 3,
                        tw - 6, th - 8, idx === this.cursor);
    }
    const rows = Math.ceil(SKINS.length / K.GRID_COLS);
    if (rows > K.GRID_ROWS) {
      const gh = K.GRID_ROWS * th - 8;
      this.panel(K.WIDTH - 9, y0, K.WIDTH - 5, y0 + gh, "#1b2246");
      const fh = gh * K.GRID_ROWS / rows;
      const fy = y0 + (gh - fh) * this.gridTop / (rows - K.GRID_ROWS);
      this.panel(K.WIDTH - 9, fy, K.WIDTH - 5, fy + fh, "#5a67b8");
    }
    this.drawSkinDetail(SKINS[this.cursor]);
    this.vtext(K.WIDTH / 2, 640 - 40, "Tippen waehlt, nochmal tippen legt an",
               9, "#6a7398", false);
    this.backButton();
  }
  drawSkinTile(sk, x, y, w, h, selected) {
    const d = this.d;
    const owned = this.owned.has(sk.key);
    const rcol = K.RARITY[sk.rarity][1];
    this.panel(x, y, x + w, y + h, mix("#0e1430", rcol, owned ? 0.18 : 0.05),
               owned ? rcol : "#2a3255", selected ? 3 : 1);
    if (selected) this.panel(x - 2, y - 2, x + w + 2, y + h + 2, "", "#ffffff", 2);
    this.panel(x, y, x + w, y + 4, rcol);
    let name;
    if (owned) {
      this.drawDoodler(this.toX(x + w / 2), this.toY(y + h - 34), sk,
                       { fxs: 0.62 * this.scale, fys: 0.62 * this.scale });
      name = sk.name;
    } else {
      const cx = this.toX(x + w / 2), cy = this.toY(y + h - 48), r = 20 * this.scale;
      d.ov(cx - r, cy - r, cx + r, cy + r,
           { fill: "#1a2144", outline: "#2a3255", width: Math.max(1, 2 * this.scale) });
      d.tx(cx, cy, "?", { size: this.fs(22), fill: "#4b5585" });
      name = sk.unlock === null ? "???" : sk.name;
    }
    this.vtext(x + w / 2, y + h - 11, name, 9, owned ? "#e8edff" : "#5a6390");
    if (sk.key === this.skinKey) {
      this.panel(x + w - 26, y + 8, x + w - 6, y + 22, "#38e0b0");
      this.vtext(x + w - 16, y + 15, "AN", 8, "#04301f");
    }
    if (owned) {
      const st = this.stars(sk.key);
      if (this.isMaxed(sk.key)) {
        this.panel(x + 5, y + 8, x + 32, y + 22, "#ffd54a");
        this.vtext(x + 18, y + 15, "MAX", 8, "#5a3f00");
      } else if (st) this.vtext(x + 7, y + 15, `*${st}`, 10, "#ffd54a", true, "w");
      if (sk.unlock === null && !this.isMaxed(sk.key)) {
        const [got, need] = this.starProgress(sk.key);
        this.panel(x + 6, y + h - 21, x + w - 6, y + h - 18, "#1b2246");
        this.panel(x + 6, y + h - 21, x + 6 + (w - 12) * got / need, y + h - 18, "#ffd54a");
      }
    }
  }
  drawSkinDetail(sk) {
    const key = sk.key, owned = this.owned.has(key);
    const [rname, rcol] = K.RARITY[sk.rarity];
    const top = 412;                     // Platz fuer den Zurueck-Knopf
    this.panel(12, top, K.WIDTH - 12, 640 - 54, "#101838", rcol, 2);
    this.vtext(24, top + 18, owned ? sk.name : "Unbekannt", 15,
               owned ? "#ffffff" : "#6a7398", true, "w");
    this.vtext(24, top + 36, rname.toUpperCase(), 9, rcol, true, "w");
    this.vtext(K.WIDTH - 24, top + 18,
               key === this.skinKey ? "ANGELEGT" : (owned ? "Tippen = anlegen" : "gesperrt"),
               10, owned ? "#9fb3c8" : "#6a7398", true, "e");
    const st = this.stars(key);
    this.starRow(24, top + 56, st);
    let info;
    if (!owned) info = sk.unlock ? `Ab ${sk.unlock} Punkten` : "Am Gluecksrad zu gewinnen";
    else if (sk.unlock !== null) info = `Rekord-Skin - ${sk.blurb}`;
    else if (this.isMaxed(key)) info = `voll ausgebaut - jede Kopie gibt ${K.DUST_MAXED} Staub`;
    else {
      const [got, need] = this.starProgress(key);
      info = `${this.copies[key] || 0} Kopien - ${got}/${need} bis ${st + 1} ${st + 1 === 1 ? "Stern" : "Sterne"}`;
    }
    this.vtext(24, top + 74, info, 9, "#8b93c7", false, "w");

    // --- Kopie fuer Sternenstaub kaufen
    const kosten = owned ? this.copyCost(key) : null;
    this.buyBtn = null;
    if (kosten && !this.isMaxed(key)) {
      const reicht = this.dust >= kosten;
      const col = reicht ? K.C_DUST : "#4b4478";
      const x0 = K.WIDTH - 150, x1 = K.WIDTH - 24;
      const y0 = top + 46, y1 = top + 76;
      this.rrect(x0, y0, x1, y1, 15,
                 { fill: mix("#101838", col, reicht ? 0.32 : 0.16) });
      this.rrect(x0, y0, x1, y1, 15, { outline: col, width: 1.3 });
      this.dustChip(x0 + 18, (y0 + y1) / 2 - 5, kosten, 10);
      this.vtext((x0 + x1) / 2 + 8, y1 - 8, "Kopie kaufen", 8,
                 reicht ? K.C_DUST : "#6a7398", false);
      this.buyBtn = [x0, y0, x1, y1, key];
    }

    const base = sk.stats, eff = this.effectiveStats(key);
    this.vtext(24, top + 94, "WERTE", 9, "#6a7398", true, "w");
    if (!base.some(v => v)) {
      const perk = K.PERKS[key];
      if (perk && owned) {
        this.vtext(K.WIDTH / 2, top + 116, perk[0], 12, rcol);
        this.vtext(K.WIDTH / 2, top + 134, perk[1], 10, "#c9d3f5", false);
        this.vtext(K.WIDTH / 2, top + 150, "keine Werte - dafuer diese Eigenart",
                   8, "#6a7398", false);
      } else if (perk) {
        this.vtext(K.WIDTH / 2, top + 122, `Eigenart: ${perk[0]}`, 11, "#6a7398");
      } else {
        this.vtext(K.WIDTH / 2, top + 122, "keine Werteboni - reine Optik", 11,
                   "#6a7398");
      }
      return;
    }
    for (let i = 0; i < 4; i++) {
      const yy = top + 108 + i * 16;
      this.vtext(24, yy, K.STAT_NAMES[i], 9, base[i] ? "#c9d3f5" : "#4b5585", true, "w");
      const bx0 = 112, bx1 = K.WIDTH - 78;
      this.panel(bx0, yy - 5, bx1, yy + 5, "#1b2246");
      if (base[i]) {
        const full = (bx1 - bx0) * Math.min(1, base[i] / 6);
        this.panel(bx0, yy - 5, bx0 + full, yy + 5, rcol);
        const extra = (bx1 - bx0) * Math.min(1, eff[i] / 6) - full;
        if (extra > 0.5) this.panel(bx0 + full, yy - 5, bx0 + full + extra, yy + 5, "#ffd54a");
        const txt = "+" + (+eff[i].toFixed(2));
        this.vtext(K.WIDTH - 70, yy, txt, 9, st ? "#ffd54a" : "#e8edff", true, "w");
      } else this.vtext(K.WIDTH - 70, yy, "-", 9, "#4b5585", true, "w");
    }
    if (st) {
      this.vtext(K.WIDTH - 24, top + 94,
                 `inkl. +${(st * K.STAR_BONUS).toFixed(2)} je Wert aus ${st} Sternen`,
                 8, "#ffd54a", false, "e");
    }
  }
  backButton() {
    const y = 640 - 19;
    this.panel(K.WIDTH / 2 - 62, y - 13, K.WIDTH / 2 + 62, y + 13,
               "#1b2246", "#3b477f", 2);
    this.vtext(K.WIDTH / 2, y, "ZURUECK", 12, "#c9d3f5");
  }
  inBackButton(vx, vy) {
    return Math.abs(vx - K.WIDTH / 2) <= 64 && Math.abs(vy - (640 - 19)) <= 16;
  }

  starRow(x, y, filled, size = 6.5) {
    const d = this.d;
    for (let i = 0; i < K.MAX_STARS; i++) {
      const cx = this.toX(x + 6 + i * 15), cy = this.toY(y), r = size * this.scale;
      const pts = [];
      for (let k = 0; k < 10; k++) {
        const a = -Math.PI / 2 + k * Math.PI / 5;
        const rr = k % 2 === 0 ? r : r * 0.44;
        pts.push(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
      }
      const on = i < filled;
      d.pg(pts, { fill: on ? "#ffd54a" : "#1b2246",
                  outline: on ? "#8a6a12" : "#2a3255", width: Math.max(1, this.scale) });
    }
  }

  // -------------------------------------------------------------- Eingabe

  open(mode) {
    this.mode = mode;
    this.left = this.right = false;
    this.pointerCtrl = false;
    if (mode === "menu") this.paused = false;
    if (mode === "menu" || mode === "quests" || mode === "slots") this.newDay();
    if (mode === "skins") {
      this.cursor = Math.max(0, SKINS.findIndex(s => s.key === this.skinKey));
      this.followCursor();
    }
  }
  followCursor() {
    const row = Math.floor(this.cursor / K.GRID_COLS);
    this.gridTop = clamp(this.gridTop, row - K.GRID_ROWS + 1, row);
    this.gridTop = Math.max(0, this.gridTop);
  }
  menuChoose(what) {
    this.sound("click");
    if (what === "quests" || what === "slots") { this.open(what); return; }
    if (what === "liste") {
      this.open("liste");
      this.listeHolen();
      return;
    }
    if (what === "konto") { this.kontoFenster(); return; }
    if (what === "mode") {                   // Modus wechseln, Lauf verwerfen
      const i = (K.MODES.indexOf(this.difficulty) + 1) % K.MODES.length;
      this.difficulty = K.MODES[i];
      this.runActive = false;
      this.gameOver = false;
      this.save();
      return;
    }
    if (what === "play") {
      if (!this.runActive || this.gameOver) this.reset();
      this.mode = "play";
    } else if (what === "tilt") {
      this.enableTilt();
    } else this.open(what);
  }
  equipCursor() {
    const sk = SKINS[this.cursor];
    if (this.owned.has(sk.key)) {
      this.skinKey = sk.key;
      this.winGlow = 22;
      this.applyStats();
      this.save();
    }
  }

  // Ein Tipp/Klick an der Stelle (Bildschirmkoordinaten)
  tap(sx, sy) {
    KLANG.wecken();                     // Ton darf erst nach Beruehrung
    const vx = (sx - this.ox) / this.scale;
    const vy = (sy - this.oy) / this.scale
             - (this.mode === "play" ? 0 : this.mo);
    if (this.tipsOpen) {                // Einfuehrung wegtippen
      this.tipsOpen = false;
      this.tipsSeen = true;
      this.save();
      return;
    }
    if (this.closeMulti() || this.closePop()) return;
    if (this.mode === "play") {
      if (sx > this.sw - 52 * this.scale && sy < (this.barH || 44)) {
        this.open("menu"); return;
      }
      if (sy < (this.barH || 44)) return;
      if (this.gameOver) { this.reset(); this.mode = "play"; return; }
      if (this.paused) { this.paused = false; return; }
      if (this.inButton(sx, sy, "left")) { this.shoot(); return; }
      if (this.ability !== null && this.inButton(sx, sy, "right")) {
        this.useAbility(); return;
      }
      this.shoot();
      return;
    }
    if (this.mode === "menu") {
      for (let i = 0; i < MENU_ITEMS.length; i++) {
        const [key, , ry0, ry1] = MENU_ITEMS[i];
        if (vy >= ry0 - 2 && vy <= ry1 + 2 && vx >= 24 && vx <= K.WIDTH - 24) {
          this.menuCursor = i;
          this.menuChoose(key);
          return;
        }
      }
      return;
    }
    if (this.inBackButton(vx, vy)) {
      this.open(this.runActive ? "play" : "menu");
      return;
    }
    if (this.mode === "liste") {
      if (this.listeFehler && vy > 100 && vy < 400) {   // nochmal versuchen
        this.listeFehler = "";
        this.listeWartet = false;
        this.listeHolen();
        return;
      }
      const kb = this.kontoBtn;
      if (kb && vx >= kb[0] && vx <= kb[2] && vy >= kb[1] && vy <= kb[3]) {
        this.kontoFenster();
        return;
      }
      const b = this.modeBtn;
      if (b && vx >= b[0] && vx <= b[2] && vy >= b[1] && vy <= b[3]) {
        const i = (K.MODES.indexOf(this.difficulty) + 1) % K.MODES.length;
        this.difficulty = K.MODES[i];
        this.save();
        this.listeHolen();
      }
      return;
    }
    if (this.mode === "gacha") {
      if (this.wheelSpinning) { this.wheelT = 1; return; }   // abkuerzen
      const [mx0, my0, mx1, my1] = this.multiGeom();
      if (vx >= mx0 && vx <= mx1 && vy >= my0 && vy <= my1) {
        this.multiSpin();
      } else if (vy < 350) {
        this.spin();
      }
      return;
    }
    if (this.mode === "slots") {
      if (this.slotState === "spinning") {          // Walzen abkuerzen
        this.slotT = K.SLOT_STOP[K.SLOT_REELS - 1] + 6;
      } else if (vy < 380) this.slotSpin();
      return;
    }
    if (this.mode === "quests") {
      const [bx0, by0, bx1, by1] = STREAK_BTN;
      const [qx0, qy0, qx1, qy1] = this.questBtn;
      if (vx >= bx0 && vx <= bx1 && vy >= by0 && vy <= by1) this.collectLogin();
      else if (vx >= qx0 && vx <= qx1 && vy >= qy0 && vy <= qy1) {
        this.collectQuests();
      }
      return;
    }
    if (this.mode === "skins") {
      if (this.buyBtn) {                       // Kopie fuer Staub
        const [x0, y0b, x1, y1b, key] = this.buyBtn;
        if (vx >= x0 && vx <= x1 && vy >= y0b && vy <= y1b) {
          this.buyCopy(key);
          return;
        }
      }
      const tw = 98, th = 114, y0 = 68;
      const x0 = (K.WIDTH - K.GRID_COLS * tw) / 2;
      const col = Math.floor((vx - x0) / tw), row = Math.floor((vy - y0) / th);
      if (col >= 0 && col < K.GRID_COLS && row >= 0 && row < K.GRID_ROWS) {
        const idx = (this.gridTop + row) * K.GRID_COLS + col;
        if (idx < SKINS.length) {
          if (idx === this.cursor) this.equipCursor();
          else { this.cursor = idx; }
        }
      }
    }
  }
  // Wischen in der Sammlung blaettert
  swipe(dy) {
    if (this.mode !== "skins") return;
    const rows = Math.ceil(SKINS.length / K.GRID_COLS);
    this.gridTop = clamp(this.gridTop + dy, 0, Math.max(0, rows - K.GRID_ROWS));
  }

  key(k) {
    if (k === "f3") { this.showFps = !this.showFps; return; }
    if (this.mode === "play") {
      if (k === "arrowleft" || k === "a") { this.left = true; this.pointerCtrl = false; }
      else if (k === "arrowright" || k === "d") { this.right = true; this.pointerCtrl = false; }
      else if (k === " " || k === "enter") { this.gameOver ? this.reset() : this.shoot(); }
      else if (k === "p") this.paused = !this.paused;
      else if (k === "c") this.open("skins");
      else if (k === "g") this.open("gacha");
      else if (k === "e") this.useAbility();
      else if (k === "escape") this.open("menu");
      return;
    }
    if (this.mode === "menu") {
      if (k === "arrowup" || k === "w") this.menuCursor = (this.menuCursor + MENU_ITEMS.length - 1) % MENU_ITEMS.length;
      else if (k === "arrowdown" || k === "s") this.menuCursor = (this.menuCursor + 1) % MENU_ITEMS.length;
      else if (k === " " || k === "enter") this.menuChoose(MENU_ITEMS[this.menuCursor][0]);
      else if (k === "c") this.open("skins");
      else if (k === "g") this.open("gacha");
      return;
    }
    if (k === "escape" || k === "c" && this.mode === "skins") {
      this.open(this.runActive ? "play" : "menu"); return;
    }
    if (this.mode === "gacha" && (k === " " || k === "enter")) this.spin();
    if (this.mode === "slots" && (k === " " || k === "enter")) this.slotSpin();
    if (this.mode === "skins") {
      if (k === "arrowleft") this.cursor = Math.max(0, this.cursor - 1);
      else if (k === "arrowright") this.cursor = Math.min(SKINS.length - 1, this.cursor + 1);
      else if (k === "arrowup") this.cursor = Math.max(0, this.cursor - K.GRID_COLS);
      else if (k === "arrowdown") this.cursor = Math.min(SKINS.length - 1, this.cursor + K.GRID_COLS);
      else if (k === " " || k === "enter") this.equipCursor();
      this.followCursor();
    }
  }
  keyUp(k) {
    if (k === "arrowleft" || k === "a") this.left = false;
    if (k === "arrowright" || k === "d") this.right = false;
  }

  async enableTilt() {
    if (this.tiltOn) { this.tiltOn = false; return; }
    try {
      const DOE = window.DeviceOrientationEvent;
      if (DOE && typeof DOE.requestPermission === "function") {
        const res = await DOE.requestPermission();
        if (res !== "granted") return;
      }
      window.addEventListener("deviceorientation", ev => {
        // gamma: Neigung um die Laengsachse, -90..90
        if (ev.gamma !== null) this.tilt = clamp(ev.gamma / 28, -1, 1);
      });
      this.tiltOn = true;
    } catch (e) { this.tiltOn = false; }
  }

  // --------------------------------------------------------------- Groesse

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const rect = this.canvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width));
    const h = Math.max(1, Math.round(rect.height));
    this.canvas.width = Math.round(w * dpr);
    this.canvas.height = Math.round(h * dpr);
    this.dpr = dpr; this.sw = w; this.sh = h;
    this.scale = Math.min(w / K.WIDTH, h / K.HEIGHT);
    this.ox = (w - K.WIDTH * this.scale) / 2;
    this.oy = (h - K.HEIGHT * this.scale) / 2;
    this.mo = Math.max(0, (K.HEIGHT - 640) / 2);
  }
}

// Menue wie eine iOS-Einstellungsseite: Primaerknopf plus Zeilengruppe.
// (Schluessel, Beschriftung, Oberkante, Unterkante) - Zeichnen und Treffer
// teilen sich diese Tabelle.
const ROW_H = 33, LIST_TOP = 214;
const LIST_ROWS = [["mode", "Modus"], ["quests", "Aufgaben"],
                   ["skins", "Sammlung"], ["gacha", "Gluecksrad"],
                   ["slots", "Slotmaschine"], ["liste", "Bestenliste"],
                   ["konto", "Konto"], ["tilt", "Neigung"]];
const LIST_BOTTOM = LIST_TOP + LIST_ROWS.length * ROW_H;
const MENU_ITEMS = [["play", "Spielen", 168, 208]].concat(
  LIST_ROWS.map(([k, t], i) => [k, t, LIST_TOP + i * ROW_H,
                                LIST_TOP + (i + 1) * ROW_H]));
// Flaechen der beiden Abhol-Knoepfe in den Tagesaufgaben
const STREAK_BTN = [24, 120, K.WIDTH - 24, 148];
// Farben des Menues kommen aus data.js, also direkt aus doodle_jump.py -
// eine Aenderung dort faerbt beide Fassungen gleich um.
const C_CARD = K.C_CARD, C_CARD_HI = K.C_CARD_HI, C_EDGE = K.C_EDGE;
const C_SEP = K.C_SEP, C_LABEL = K.C_LABEL, C_MUTED = K.C_MUTED;
const C_GLOW = K.C_GLOW;    // Tuerkis - so leuchtet das gewaehlte Feld

// ------------------------------------------------------------------ Start

function boot(canvas) {
  // Das Spielfeld ist 420 breit; die Hoehe richtet sich nach dem Geraet,
  // damit auf einem hohen Telefon keine schwarzen Balken bleiben. Alle
  // Abstaende sind absolute Pixel, die Erreichbarkeit bleibt also gueltig.
  const r0 = canvas.getBoundingClientRect();
  const aspect = (r0.height || window.innerHeight)
               / Math.max(1, r0.width || window.innerWidth);
  K.HEIGHT = Math.round(clamp(K.WIDTH * aspect, 560, 1040));
  K.SCROLL_LINE = K.HEIGHT * 0.42;
  const g = new Game(canvas);
  g.resize();
  window.addEventListener("resize", () => g.resize());
  window.addEventListener("orientationchange", () => setTimeout(() => g.resize(), 250));

  // --- Finger und Maus
  // Jeder Finger bekommt eine Rolle: EINER lenkt, weitere bedienen die
  // Knoepfe oder tippen in den Menues. Ohne diese Trennung wuerde das
  // Loslassen des Schuss-Knopfes die Lenkung des anderen Fingers beenden.
  const STEER = "steer", BUTTON = "button", TAP = "tap";
  const finger = new Map();          // Kennung -> Rolle, Startpunkt, Weg
  let steerId = null;

  const local = t => {
    const r = canvas.getBoundingClientRect();
    return [t.clientX - r.left, t.clientY - r.top];
  };
  const playing = () => g.mode === "play" && !g.paused && !g.gameOver;
  const onButton = (x, y) =>
    g.inButton(x, y, "left") || (g.ability !== null && g.inButton(x, y, "right"));
  const steerHere = (x, y) => playing() && y > (g.barH || 44) && !onButton(x, y);

  const takeSteer = (id, x, y) => {
    steerId = id;
    g.pointerX = clamp((x - g.ox) / g.scale, 0, K.WIDTH);
    g.pointerCtrl = true;
  };

  const beginTouch = (id, x, y) => {
    const f = { role: TAP, x, y, startX: x, startY: y, lastY: y,
                t: performance.now(), moved: false };
    if (playing() && y > (g.barH || 44)) {
      if (g.inButton(x, y, "left")) {          // Schuss sofort, nicht erst beim
        g.shoot();                             // Loslassen - und ohne Lenkung
        f.role = BUTTON;
        finger.set(id, f);
        return;
      }
      if (g.ability !== null && g.inButton(x, y, "right")) {
        g.useAbility();
        f.role = BUTTON;
        finger.set(id, f);
        return;
      }
      if (steerId === null) {                  // erster freier Finger lenkt
        f.role = STEER;
        takeSteer(id, x, y);
      }
    }
    finger.set(id, f);
  };

  const moveTouch = (id, x, y) => {
    const f = finger.get(id);
    if (!f) return;
    f.x = x; f.y = y;
    if (Math.abs(x - f.startX) > 6 || Math.abs(y - f.startY) > 6) f.moved = true;
    if (f.role === STEER && id === steerId && g.mode === "play") {
      g.pointerX = clamp((x - g.ox) / g.scale, 0, K.WIDTH);
      g.pointerCtrl = true;
    } else if (f.role === TAP && g.mode === "skins"
               && Math.abs(y - f.lastY) > 40) {
      g.swipe(y < f.lastY ? 1 : -1);
      f.lastY = y;
    }
  };

  const endTouch = id => {
    const f = finger.get(id);
    if (!f) return;
    finger.delete(id);
    if (f.role === STEER && steerId === id) {
      steerId = null;
      g.pointerCtrl = false;
      for (const [oid, o] of finger) {         // liegt noch ein Finger im Feld,
        if (o.role === TAP && steerHere(o.x, o.y)) {   // uebernimmt er das Lenken
          o.role = STEER;
          takeSteer(oid, o.x, o.y);
          break;
        }
      }
    }
    // Kurzes Tippen ohne Weg schiesst bzw. waehlt im Menue; der Knopf hat
    // schon beim Aufsetzen ausgeloest und tut hier nichts mehr.
    if (f.role !== BUTTON && !f.moved && performance.now() - f.t < 400) {
      g.tap(f.startX, f.startY);
    }
  };

  canvas.addEventListener("touchstart", ev => {
    ev.preventDefault();
    for (const t of ev.changedTouches) {
      const [x, y] = local(t);
      beginTouch(t.identifier, x, y);
    }
  }, { passive: false });
  canvas.addEventListener("touchmove", ev => {
    ev.preventDefault();
    for (const t of ev.changedTouches) {
      const [x, y] = local(t);
      moveTouch(t.identifier, x, y);
    }
  }, { passive: false });
  const liftTouches = ev => {
    ev.preventDefault();
    for (const t of ev.changedTouches) endTouch(t.identifier);
  };
  canvas.addEventListener("touchend", liftTouches, { passive: false });
  canvas.addEventListener("touchcancel", liftTouches, { passive: false });

  // Maus zaehlt als ein einzelner Finger
  let mouseDown = false;
  canvas.addEventListener("mousedown", ev => {
    const [x, y] = local(ev);
    mouseDown = true;
    beginTouch("maus", x, y);
  });
  canvas.addEventListener("mousemove", ev => {
    if (!mouseDown) return;
    const [x, y] = local(ev);
    moveTouch("maus", x, y);
  });
  canvas.addEventListener("mouseup", () => {
    if (!mouseDown) return;
    mouseDown = false;
    endTouch("maus");
  });
  window.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowleft", "arrowright", "arrowup", "arrowdown"].includes(k)) e.preventDefault();
    g.key(k);
  });
  window.addEventListener("keyup", e => g.keyUp(e.key.toLowerCase()));

  // --- Schleife mit fester Schrittweite (wie _tick in der Desktop-Fassung)
  let last = performance.now() / 1000, acc = 0, lastDraw = last;
  function frame(now) {
    now /= 1000;
    let dt = now - last; last = now;
    if (dt > 0.25) dt = FRAME_TIME;          // nach langer Pause nicht nachrasen
    acc += dt;
    let steps = 0;
    while (acc >= FRAME_TIME && steps < K.MAX_CATCHUP) {
      g.step(); acc -= FRAME_TIME; steps++;
    }
    if (acc > FRAME_TIME * K.MAX_CATCHUP) acc = 0;
    if (steps > 0) {
      g.draw();
      const d2 = now - lastDraw;
      if (d2 > 0 && d2 < 1) {
        g.fps = g.fps ? 0.88 * g.fps + 0.12 / d2 : 1 / d2;
        g.regelDetail(d2 * 1000);            // Zierrat nachregeln
      }
      lastDraw = now;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.game = g;                            // fuer Tests von aussen
  return g;
}

document.getElementById("hint").remove();
boot(document.getElementById("c"));
</script>
