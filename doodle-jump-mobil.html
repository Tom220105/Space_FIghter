  const errBox = document.getElementById("err");

  window.addEventListener("error", e =>

  window.addEventListener("unhandledrejection", e => showErr("Promise: " + e.reason));

// Anbindung an Supabase fuer die Webfassung: Konto, Bestenliste und
// Spielstand. Gegenstueck zu wolke.py - dieselben Tabellen, dieselbe
// Funktion punkte_melden, dasselbe Konto.
//
// Alles laeuft ueber fetch und meldet sich ueber hole() zurueck, damit das
// Spiel nie auf das Netz wartet. Ohne Netz laeuft das Spiel unveraendert
// weiter, es fehlen dann nur die Bestenlisten.

const URL = "https://aeujjeagxcmyhmcpewez.supabase.co";
const ANON = "sb_publishable_P2xqiP1R-81hvtUKJlcQtQ_geSCrm6q";

const KONTO_KEY = "doodlejump.konto.v1";

class Wolke {
  constructor(url = URL, anon = ANON) {
    // Im Dashboard steht die Adresse mit REST-Anhang - den haengt dieses
    // Modul selbst an, hier also abschneiden.
    this.url = url.replace(/\/+$/, "").replace(/\/(rest|auth)\/v1$/, "");
    this.anon = anon;
    this.token = null;
    this.erneuern = null;
    this.benutzer = null;
    this.name = null;
    this.antworten = [];
    this.laden();
  }

  get angemeldet() { return this.token !== null; }

  get eingerichtet() {
    return !this.url.includes("DEINPROJEKT") && !!this.anon
        && !this.anon.startsWith("DEIN");
  }

  // ------------------------------------------------------------- Auftraege

  registrieren(email, passwort, name) {
    this.lauf("registrieren", async () => {
      const a = await this.anfrage("/auth/v1/signup", "POST",
                                   { email, password: passwort }, false);
      if (!a.access_token) return { bestaetigen: true };
      this.sitzungMerken(a);
      // Das Konto steht jetzt. Geht nur der Name nicht durch (schon vergeben
      // oder unerlaubte Zeichen), bleibt die Anmeldung bestehen und das
      // Spiel fragt den Namen noch einmal ab.
      try {
        await this.anfrage("/rest/v1/profil", "POST",
                           { id: this.benutzer, name },
                           true, { Prefer: "return=minimal" });
      } catch (e) {
        return { name: null, fehler: String(e.message || e) };
      }
      this.name = name;
      this.speichern();
      return { name };
    });
  }

  anmelden(email, passwort) {
    this.lauf("anmelden", async () => {
      const a = await this.anfrage("/auth/v1/token?grant_type=password", "POST",
                                   { email, password: passwort }, false);
      this.sitzungMerken(a);
      const treffer = await this.anfrage(
        `/rest/v1/profil?id=eq.${this.benutzer}&select=name`);
      this.name = treffer && treffer.length ? treffer[0].name : null;
      this.speichern();
      return { name: this.name };
    });
  }

  // Anzeigenamen nachtragen - fuer Konten, bei denen das Anlegen des
  // Profils schiefging (Name schon vergeben oder unerlaubte Zeichen).
  nameSetzen(name) {
    this.lauf("name", async () => {
      await this.anfrage("/rest/v1/profil", "POST",
                         { id: this.benutzer, name },
                         true, { Prefer: "resolution=merge-duplicates,return=minimal" });
      this.name = name;
      this.speichern();
      return { name };
    });
  }

  abmelden() {
    this.token = this.erneuern = this.benutzer = this.name = null;
    try { localStorage.removeItem(KONTO_KEY); } catch (e) {}
  }

  punkteMelden(modus, punkte, dauer) {
    this.lauf("punkte", async () => {
      await this.anfrage("/rest/v1/rpc/punkte_melden", "POST",
                         { p_modus: modus, p_punkte: Math.round(punkte),
                           p_dauer: Math.round(dauer) });
      return { punkte: Math.round(punkte) };
    });
  }

  bestenliste(modus, anzahl = 100) {
    this.lauf("bestenliste", async () => {
      const zeilen = await this.anfrage(
        `/rest/v1/bestenliste?modus=eq.${encodeURIComponent(modus)}`
        + `&select=platz,name,punkte,gemeldet&order=platz.asc&limit=${anzahl | 0}`);
      return { modus, zeilen: zeilen || [] };
    });
  }

  meinPlatz(modus) {
    this.lauf("platz", async () => {
      const platz = await this.anfrage("/rest/v1/rpc/mein_platz", "POST",
                                       { p_modus: modus });
      return { modus, platz };
    });
  }

  standHoch(daten) {
    this.lauf("stand_hoch", async () => {
      await this.anfrage("/rest/v1/spielstand", "POST",
                         { spieler: this.benutzer, stand: daten,
                           geaendert: "now()" },
                         true, { Prefer: "resolution=merge-duplicates,return=minimal" });
      return { gespeichert: true };
    });
  }

  standRunter() {
    this.lauf("stand_runter", async () => {
      const treffer = await this.anfrage(
        `/rest/v1/spielstand?spieler=eq.${this.benutzer}&select=stand`);
      return { stand: treffer && treffer.length ? treffer[0].stand : null };
    });
  }

  // Fertige Antworten abholen: [Art, geklappt, Daten]
  hole() {
    const fertig = this.antworten;
    this.antworten = [];
    return fertig;
  }

  // ------------------------------------------------------------ Innenleben

  async lauf(art, fn) {
    if (!this.eingerichtet) {
      this.antworten.push([art, false, "Supabase ist nicht eingetragen"]);
      return;
    }
    try {
      this.antworten.push([art, true, await fn()]);
    } catch (e) {
      this.antworten.push([art, false, String(e.message || e)]);
    }
  }

  async anfrage(pfad, methode = "GET", daten = null, mitToken = true,
                zusatz = null, zweiterVersuch = false) {
    const kopf = { apikey: this.anon, "Content-Type": "application/json" };
    if (mitToken && this.token) kopf.Authorization = "Bearer " + this.token;
    if (zusatz) Object.assign(kopf, zusatz);
    const antwort = await fetch(this.url + pfad, {
      method: methode, headers: kopf,
      body: daten === null ? undefined : JSON.stringify(daten),
    });
    if (antwort.status === 401 && this.erneuern && !zweiterVersuch) {
      await this.tokenErneuern();          // abgelaufen: einmal erneuern
      return this.anfrage(pfad, methode, daten, mitToken, zusatz, true);
    }
    const text = await antwort.text();
    if (!antwort.ok) {
      let meldung = `Fehler ${antwort.status}`;
      try {
        const j = JSON.parse(text);
        meldung = j.message || j.msg || j.error_description || j.error || meldung;
      } catch (e) {}
      throw new Error(meldung);
    }
    return text.trim() ? JSON.parse(text) : null;
  }

  async tokenErneuern() {
    const a = await this.anfrage("/auth/v1/token?grant_type=refresh_token",
                                 "POST", { refresh_token: this.erneuern },
                                 false, null, true);
    this.sitzungMerken(a);
  }

  sitzungMerken(a) {
    this.token = a.access_token;
    this.erneuern = a.refresh_token || null;
    this.benutzer = (a.user || {}).id || null;
    this.speichern();
  }

  speichern() {
    try {
      localStorage.setItem(KONTO_KEY, JSON.stringify({
        token: this.token, erneuern: this.erneuern,
        benutzer: this.benutzer, name: this.name,
      }));
    } catch (e) {}
  }

  laden() {
    try {
      const d = JSON.parse(localStorage.getItem(KONTO_KEY) || "{}");
      this.token = d.token || null;
      this.erneuern = d.erneuern || null;
      this.benutzer = d.benutzer || null;
      this.name = d.name || null;
    } catch (e) {}
  }
}

// Doodle Jump ins Weltall - mobile Fassung.
// Portierung von doodle_jump.py; Zahlen und Skins kommen unveraendert aus
// data.js, die Spiellogik ist Schritt fuer Schritt uebernommen. Gezeichnet
// wird direkt auf ein Canvas statt auf ein Tk-Canvas, gesteuert wird per
// Finger (ziehen = lenken, tippen = schiessen) oder Neigung.


const SKIN_BY_KEY = Object.fromEntries(SKINS.map(s => [s.key, s]));
const POOLS = {};
for (const r of ["common", "rare", "epic", "legendary", "mythic"]) {
  POOLS[r] = SKINS.filter(s => s.rarity === r).map(s => s.key);
}
const DEFAULT_SKIN = "klassiker";
const SAVE_KEY = "doodlejump.save.v1";
// Die Datenbank laesst als Anzeigenamen nur 3 bis 16 Zeichen aus Buchstaben,
// Ziffern, Unterstrich und Leerzeichen zu (siehe ANLEITUNG-SUPABASE.md) -
// das wird hier schon vor dem Absenden geprueft.
const NAME_MUSTER = /^[A-Za-z0-9_ ]{3,16}$/;
const NAME_REGEL = "3 bis 16 Zeichen, nur Buchstaben, Ziffern, "
                 + "Unterstrich und Leerzeichen";
const FRAME_TIME = 1 / K.FPS;
const TAU = Math.PI * 2;

// ------------------------------------------------------------- Hilfsmittel

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const rnd = (a = 1, b = 0) => b + Math.random() * (a - b);
const rndInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const choice = arr => arr[Math.floor(Math.random() * arr.length)];

function mix(c1, c2, t) {
  t = clamp(t, 0, 1);
  const a = [1, 3, 5].map(i => parseInt(c1.substr(i, 2), 16));
  const b = [1, 3, 5].map(i => parseInt(c2.substr(i, 2), 16));
  return "#" + [0, 1, 2].map(i => {
    const v = Math.round(a[i] + (b[i] - a[i]) * t);
    return v.toString(16).padStart(2, "0");
  }).join("");
}

function hsvHex(h, sat = 1, val = 1) {
  h = ((h % 1) + 1) % 1 * 6;
  const i = Math.floor(h), f = h - i;
  const p = val * (1 - sat), q = val * (1 - sat * f), t = val * (1 - sat * (1 - f));
  const [r, g, b] = [[val, t, p], [q, val, p], [p, val, t],
                     [p, q, val], [t, p, val], [val, p, q]][i % 6];
  return "#" + [r, g, b].map(v =>
    Math.round(v * 255).toString(16).padStart(2, "0")).join("");
}

// Stipple-Muster von Tk als Deckkraft nachbilden
const STIP = { gray12: 0.14, gray25: 0.26, gray50: 0.5, gray75: 0.75 };

function starCost(n) { return K.STAR_STEP * n; }
function starTotal(n) { return K.STAR_STEP * n * (n + 1) / 2; }

// Ruesselkontur, um `look` nach oben geschwenkt (wie snout_points in Python)
function snoutPoints(look) {
  const a = -K.SNOUT_AIM * look * Math.PI / 180;
  const ca = Math.cos(a), sa = Math.sin(a), lift = K.SNOUT_LIFT * look;
  const [ax, ay] = K.SNOUT_PIVOT;
  const pts = [...K.SNOUT_SHAPE, K.SNOUT_NOSTRIL].map(([dx, dy]) => {
    const rx = dx - ax, ry = dy - ay;
    return [ax + rx * ca - ry * sa, ay + rx * sa + ry * ca - lift];
  });
  return { pts: pts.slice(0, -1), tip: pts[K.SNOUT_TIP_I], nostril: pts[pts.length - 1] };
}

// Gluecksrad: viele kleine Felder, gleichmaessig verteilt (build_slices)
function buildSlices() {
  // Alle Felder gleich breit; die Chancen stecken in der Auslosung, nicht
  // in der Feldgroesse (siehe spin()).
  const counts = K.WHEEL.map(w => K.SLICE_COUNTS[w[0]]);
  const total = counts.reduce((a, b) => a + b, 0);
  const placed = counts.map(() => 0);
  const order = [];
  for (let step = 0; step < total; step++) {
    let best = 0, bestv = -1e9;
    for (let i = 0; i < counts.length; i++) {
      const v = counts[i] * (step + 1) / total - placed[i];
      if (v > bestv) { bestv = v; best = i; }
    }
    order.push(best); placed[best]++;
  }
  const width = 1 / total;
  return order.map((idx, n) => [idx, n * width, width]);
}
const WHEEL_SLICES = buildSlices();

// ------------------------------------------------------ Zeichen-Schicht
// Bildet die im Python benutzten Tk-Aufrufe auf das Canvas ab.

class Draw {
  constructor(ctx) { this.c = ctx; }

  _fill(o) {
    const c = this.c;
    const al = o.stipple ? STIP[o.stipple] : 1;
    if (o.fill) {
      c.globalAlpha = al; c.fillStyle = o.fill; c.fill(); c.globalAlpha = 1;
    }
    if (o.outline) {
      c.strokeStyle = o.outline; c.lineWidth = o.width ?? 1; c.stroke();
    }
  }
  ov(x0, y0, x1, y1, o = {}) {
    const c = this.c;
    c.beginPath();
    c.ellipse((x0 + x1) / 2, (y0 + y1) / 2, Math.abs(x1 - x0) / 2,
              Math.abs(y1 - y0) / 2, 0, 0, TAU);
    this._fill(o);
  }
  rc(x0, y0, x1, y1, o = {}) {
    const c = this.c;
    c.beginPath();
    c.rect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
    this._fill(o);
  }
  pg(pts, o = {}) {
    const c = this.c;
    c.beginPath();
    c.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
    c.closePath();
    this._fill(o);
  }
  ln(pts, o = {}) {
    const c = this.c;
    c.beginPath();
    c.lineJoin = o.round ? "round" : "miter";
    c.lineCap = o.round ? "round" : "butt";
    if (o.smooth && pts.length >= 6) {           // weiche Kurve wie Tk smooth
      c.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length - 2; i += 2) {
        c.quadraticCurveTo(pts[i], pts[i + 1],
                           (pts[i] + pts[i + 2]) / 2, (pts[i + 1] + pts[i + 3]) / 2);
      }
      c.lineTo(pts[pts.length - 2], pts[pts.length - 1]);
    } else {
      c.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
    }
    c.globalAlpha = o.stipple ? STIP[o.stipple] : 1;
    c.strokeStyle = o.fill || "#000"; c.lineWidth = o.width ?? 1; c.stroke();
    c.globalAlpha = 1;
    c.lineJoin = "miter"; c.lineCap = "butt";
  }
  // Tk-Winkel: Grad gegen den Uhrzeigersinn ab 3 Uhr, y nach oben
  arc(x0, y0, x1, y1, start, extent, o = {}) {
    const c = this.c;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const rx = Math.abs(x1 - x0) / 2, ry = Math.abs(y1 - y0) / 2;
    const a0 = -start * Math.PI / 180, a1 = -(start + extent) * Math.PI / 180;
    c.beginPath();
    if (o.style === "pieslice") c.moveTo(cx, cy);
    c.ellipse(cx, cy, rx, ry, 0, a0, a1, extent > 0);
    if (o.style === "pieslice") c.closePath();
    if (o.style === "arc") {
      c.globalAlpha = o.stipple ? STIP[o.stipple] : 1;
      c.strokeStyle = o.outline || "#000"; c.lineWidth = o.width ?? 1; c.stroke();
      c.globalAlpha = 1;
    } else this._fill(o);
  }
  tx(x, y, text, o = {}) {
    const c = this.c;
    const size = o.size ?? 12;
    c.font = `${o.bold === false ? "" : "bold "}${size}px -apple-system, Helvetica, Arial, sans-serif`;
    c.textAlign = o.anchor === "w" ? "left" : o.anchor === "e" ? "right" : "center";
    c.textBaseline = "middle";
    c.fillStyle = o.fill || "#fff";
    const lines = String(text).split("\n");
    lines.forEach((ln, i) => {
      c.fillText(ln, x, y + (i - (lines.length - 1) / 2) * size * 1.25);
    });
  }
}

class Platform {
  constructor(x, y, kind = "normal", springChance = K.SPRING_CHANCE,
              allowSpring = null) {
    this.x = x; this.y = y; this.kind = kind;
    this.dx = kind === "moving" ? choice([-1.7, 1.7]) : 0;
    if (allowSpring === null) allowSpring = kind === "normal" || kind === "moving";
    this.spring = allowSpring && Math.random() < springChance;
    this.broken = false; this.used = false; this.vy = 0;
  }
  get alive() { return !this.used && this.y < K.HEIGHT + 80; }
  update() {
    if (this.kind === "moving") {
      this.x += this.dx;
      if (this.x <= 0) { this.x = 0; this.dx = Math.abs(this.dx); }
      else if (this.x + K.PLAT_W >= K.WIDTH) {
        this.x = K.WIDTH - K.PLAT_W; this.dx = -Math.abs(this.dx);
      }
    }
    if (this.broken) {
      this.vy += K.GRAVITY * 1.6; this.y += this.vy;
      if (this.y > K.HEIGHT + 60) this.used = true;
    }
  }
}

const ITEM_SIZES = { rocket: [K.ROCKET_W, K.ROCKET_H], shield: [30, 32], hole: [34, 34] };

class Item {
  constructor(plat, kind = "rocket") {
    this.plat = plat; this.kind = kind;
    [this.w, this.h] = ITEM_SIZES[kind];
    this.offx = K.PLAT_W / 2 - this.w / 2;
    this.phase = rnd(TAU); this.taken = false;
    this.x = plat.x + this.offx; this.y = plat.y - this.h - 4;
  }
  get alive() { return !this.taken && this.plat.alive && !this.plat.broken; }
  update() {
    this.phase += 0.11;
    this.x = this.plat.x + this.offx;
    this.y = this.plat.y - this.h - 6 + Math.sin(this.phase) * 3.5;
  }
}

class Monster {
  // Zwei Arten: rotes Glutwesen und lila Overlord ("Thanos") - groesser,
  // langsamer, doppelte Punkte.
  constructor(x, y, kind = "normal") {
    this.kind = kind;
    const big = kind === "thanos";
    this.w = K.MONSTER_W * (big ? K.THANOS_SCALE : 1);
    this.h = K.MONSTER_H * (big ? K.THANOS_SCALE : 1);
    const speed = K.MONSTER_SPEED * (big ? K.THANOS_SLOW : 1);
    this.x = x; this.y = y;
    this.dx = choice([-speed, speed]);
    this.phase = rnd(TAU);
    this.dead = false;
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  get worth() { return this.kind === "thanos" ? 2 : 1; }
  update() {
    this.phase += 0.07;
    this.x += this.dx;
    if (this.x <= 0 || this.x + this.w >= K.WIDTH) {
      this.dx = -this.dx;
      this.x = clamp(this.x, 0, K.WIDTH - this.w);
    }
  }
}

class Bullet {
  constructor(x, y) { this.x = x; this.y = y; }
  update() { this.y -= K.BULLET_SPEED; }
}

class Ring {
  constructor(x, y, rmax, color, width = 5) {
    this.x = x; this.y = y; this.r = 6; this.rmax = rmax;
    this.color = color; this.width = width;
  }
  get alive() { return this.r < this.rmax * 0.97; }
  update() { this.r += (this.rmax - this.r) * 0.17 + 2; }
}

// --------------------------------------------------------------- Ton
// Dieselben Klaenge wie in der Rechnerfassung, nur hier im Browser
// berechnet: tiefe Grundtoene, weiche Wellenformen, ein Tiefpass darueber
// und ein langer Ausklang. Es werden keine Dateien geladen.
class Klang {
  constructor() {
    this.ctx = null;
    this.puffer = {};
    this.letzte = {};
    this.an = true;
  }

  // Erst bei der ersten Beruehrung starten - Browser erlauben Ton sonst nicht
  wecken() {
    if (this.ctx) {
      if (this.ctx.state === "suspended") this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      for (const [name, f0, f1, dur, form, lp, vol] of K.SOUND_DEFS) {
        this.puffer[name] = this.bauen([[f0, f1, dur]], form, lp, vol);
      }
      for (const [name, noten, dur, form, lp, vol] of K.SOUND_SEQS) {
        this.puffer[name] = this.bauen(noten.map(f => [f, f, dur]), form, lp, vol);
      }
    } catch (e) { this.ctx = null; }
  }

  bauen(teile, form, lp, vol) {
    const rate = this.ctx.sampleRate;
    const gesamt = teile.reduce((s, [, , d]) => s + Math.round(rate * d), 0);
    const puffer = this.ctx.createBuffer(1, gesamt, rate);
    const daten = puffer.getChannelData(0);
    let pos = 0;
    for (const [f0, f1, dur] of teile) {
      const n = Math.round(rate * dur);
      let phase = 0, tief = 0;
      for (let i = 0; i < n; i++) {
        const t = i / Math.max(1, n - 1);
        phase += (f0 + (f1 - f0) * t) / rate;
        const ph = phase % 1;
        let v;
        if (form === "sine") v = Math.sin(ph * TAU);
        else if (form === "tri") v = 4 * Math.abs(ph - 0.5) - 1;
        else v = Math.random() * 2 - 1;
        tief += lp * (v - tief);
        const env = Math.min(1, t * 9) * (1 - t) ** 2.2;
        daten[pos++] = tief * env * K.SOUND_VOL * vol;
      }
    }
    return puffer;
  }

  spiel(name) {
    if (!this.an || !this.ctx || !this.puffer[name]) return;
    const jetzt = this.ctx.currentTime;
    const pause = K.SOUND_GAP[name] !== undefined ? K.SOUND_GAP[name]
                                                 : K.SOUND_GAP_DEFAULT;
    if (jetzt - (this.letzte[name] || -9) < pause) return;
    this.letzte[name] = jetzt;
    const quelle = this.ctx.createBufferSource();
    quelle.buffer = this.puffer[name];
    quelle.connect(this.ctx.destination);
    quelle.start();
  }
}

const KLANG = new Klang();

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.d = new Draw(this.ctx);
    this.sw = K.WIDTH; this.sh = K.HEIGHT; this.scale = 1; this.ox = 0; this.oy = 0;
    this.mo = 0;                   // Versatz der Menuebox auf hohen Schirmen

    this.left = this.right = false;
    this.pointerX = null;          // Finger/Cursor in virtuellen Koordinaten
    this.pointerCtrl = false;
    this.tilt = 0;                 // -1..1 aus der Neigung
    this.tiltOn = false;
    this.paused = false;
    this.mode = "menu";
    this.menuCursor = 0;
    this.runActive = false;
    this.cursor = 0; this.gridTop = 0;
    this.wheelRot = 0; this.wheelSpinning = false; this.wheelT = 0;
    this.wheelFrom = 0; this.wheelTo = 0; this.wheelIdx = 0;
    this.wheelResult = null; this.winGlow = 0;
    this.showFps = false; this.fps = 0;
    this.charge = 0;                   // Ladung der Spezialfaehigkeit
    this.loginNote = 0;
    this.wolke = new Wolke();
    this.tipsOpen = false;      // wird nach dem Laden gesetzt
    this.detail = 1;            // 1 = voller Zierrat
    this.frameMs = 16.7;
    this.liste = {};            // geholte Bestenlisten je Modus
    this.listePlatz = {};       // eigener Platz je Modus
    this.wolkeText = "";
    this.wolkeNote = 0;         // so lange steht die Meldung im Menue
    this.listeFehler = "";      // warum die Liste nicht kam
    this.listeWartet = false;
    this.tipsOpen = false;
    this.pop = null; this.confetti = []; this.wheelSlice = -1;
    this.multi = []; this.multiT = 0; this.wheelMulti = false;
    this.questBtn = [0, 0, 0, 0]; this.buyBtn = null;
    this.kontoBtn = null;       // Knopf in der Liste, wenn kein Konto da ist
    this.nameGefragt = false;   // Namensfrage nur einmal stellen
    this.bestBefore = 0; this.pendingSkin = null; this.loginText = "";
    this.slotState = "idle"; this.slotT = 0;
    this.slotSyms = [0, 0, 0]; this.slotKind = null; this.slotResult = null;

    this.load();
    if (this.wolke && this.wolke.angemeldet) {
      this.wolke.standRunter();           // was auf anderen Geraeten dazukam
    }
    this.tipsOpen = !this.tipsSeen;        // Einfuehrung beim ersten Start
    this.newDay();
    this.applyStats();
    this.reset();
    this.runActive = false;
  }

  // ---- Speicherstand im Browser

  // Jedes Konto hat seinen eigenen Spielstand im Browser, das Spielen ohne
  // Konto ebenfalls. Deshalb nimmt das Abmelden nichts weg.
  saveKey() {
    return (this.wolke && this.wolke.angemeldet && this.wolke.benutzer)
      ? `${SAVE_KEY}.${String(this.wolke.benutzer).slice(0, 8)}` : SAVE_KEY;
  }

  load() {
    let data = {};
    try {
      data = JSON.parse(localStorage.getItem(this.saveKey())
                        || localStorage.getItem(SAVE_KEY)) || {};
    } catch (e) {}
    const raw = data.highscores || {};
    this.highscores = {};
    for (const m of K.MODES) this.highscores[m] = raw[m] | 0;
    if (data.highscore) {                    // alter Stand ohne Modi
      this.highscores.normal = Math.max(this.highscores.normal, data.highscore | 0);
    }
    this.difficulty = K.MODES.includes(data.mode) ? data.mode : "normal";
    this.coins = data.coins | 0;
    this.spins = data.spins | 0;
    this.tickets = data.tickets | 0;
    this.slotSpins = data.slot_spins | 0;
    this.questDay = data.quest_day || "";
    const rq = data.quests || {};
    this.quests = {};
    this.questClaimed = !!data.quest_claimed;
    this.questKeys = (data.quest_keys || []).filter(k => K.QUEST_BY_KEY[k]);
    if (this.questKeys.length !== K.QUESTS_PER_DAY) this.questKeys = [];
    this.quests = {};
    for (const k of this.questKeys) this.quests[k] = rq[k] | 0;
    this.questNote = false;
    this.dust = data.dust | 0;
    this.xp = data.xp | 0;
    this.rank = data.rank | 0;
    this.pity = data.pity | 0;
    this.streak = clamp(data.streak | 0, 0, K.LOGIN_STREAK.length);
    this.streakDay = data.streak_day || "";
    this.streakClaimed = data.streak_claimed === undefined
      ? true : !!data.streak_claimed;
    this.tipsSeen = !!data.tips_seen;
    this.soundOn = data.sound_on === undefined ? true : !!data.sound_on;
    KLANG.an = this.soundOn;
    this.owned = new Set((data.owned || []).filter(k => SKIN_BY_KEY[k]));
    this.owned.add(DEFAULT_SKIN);
    this.copies = {};
    for (const [k, v] of Object.entries(data.copies || {})) {
      if (SKIN_BY_KEY[k]) this.copies[k] = Math.max(0, v | 0);
    }
    this.skinKey = this.owned.has(data.skin) ? data.skin : DEFAULT_SKIN;
    const best = Math.max(...Object.values(this.highscores));
    for (const s of SKINS) {
      if (s.unlock !== null && best >= s.unlock) this.owned.add(s.key);
    }
  }
  // Der Spielstand als einfaches Objekt - dasselbe, was in den
  // Browserspeicher geht und spaeter in die Wolke faehrt.
  standAlsJson() {
    return {
      highscores: this.highscores, mode: this.difficulty, coins: this.coins,
      owned: [...this.owned].sort(), skin: this.skinKey, copies: this.copies,
      spins: this.spins, tickets: this.tickets, slot_spins: this.slotSpins,
      quest_day: this.questDay, quests: this.quests,
      quest_keys: this.questKeys, quest_claimed: this.questClaimed,
      dust: this.dust, xp: this.xp, rank: this.rank, pity: this.pity,
      streak: this.streak, streak_day: this.streakDay,
      streak_claimed: this.streakClaimed, tips_seen: this.tipsSeen,
      sound_on: this.soundOn,
      tilt: this.tiltOn,
    };
  }

  save() {
    try {
      const stand = this.standAlsJson();
      stand.highscore = this.highscores.normal;   // fuer ganz alte Staende
      localStorage.setItem(this.saveKey(), JSON.stringify(stand));
    } catch (e) {}
  }

  // Wolke und Geraet zusammenfuehren: genommen wird jeweils das Mehr, damit
  // kein Geraet den Fortschritt eines anderen loeschen kann.
  standUebernehmen(stand) {
    if (!stand) return false;
    try {
      for (const [m, w] of Object.entries(stand.highscores || {})) {
        if (K.MODES.includes(m)) {
          this.highscores[m] = Math.max(this.highscores[m] | 0, w | 0);
        }
      }
      this.coins = Math.max(this.coins, stand.coins | 0);
      this.dust = Math.max(this.dust, stand.dust | 0);
      this.tickets = Math.max(this.tickets, stand.tickets | 0);
      this.spins = Math.max(this.spins, stand.spins | 0);
      this.slotSpins = Math.max(this.slotSpins, stand.slot_spins | 0);
      this.pity = Math.max(this.pity, stand.pity | 0);
      this.streak = Math.max(this.streak, stand.streak | 0);
      if ((stand.rank | 0) > this.rank) {
        this.rank = stand.rank | 0;
        this.xp = stand.xp | 0;
      }
      for (const k of stand.owned || []) {
        if (SKIN_BY_KEY[k]) this.owned.add(k);
      }
      for (const [k, v] of Object.entries(stand.copies || {})) {
        if (SKIN_BY_KEY[k]) {
          this.copies[k] = Math.max(this.copies[k] | 0, v | 0);
        }
      }
      if (this.owned.has(stand.skin)) this.skinKey = stand.skin;
      this.applyStats();
      this.save();
      return true;
    } catch (e) {
      return false;
    }
  }
  sound(name) { if (this.soundOn) KLANG.spiel(name); }

  // ---- Wolke: Konto, Bestenliste, Spielstand

  // Lesen darf jeder - ein Konto braucht nur, wer selbst darin stehen will.
  listeHolen() {
    if (!this.wolke || !this.wolke.eingerichtet || this.listeWartet) return;
    this.listeWartet = true;
    this.listeFehler = "";
    this.wolke.bestenliste(this.difficulty);
    if (this.wolke.angemeldet) this.wolke.meinPlatz(this.difficulty);
  }

  melde(text) {
    this.wolkeText = String(text);
    this.wolkeNote = 260;
  }

  // Supabase antwortet auf Englisch - die haeufigen Faelle auf Deutsch.
  klartext(text) {
    const t = String(text), k = t.toLowerCase();
    if (k.includes("already registered") || k.includes("already been registered")) {
      return "Diese E-Mail hat schon ein Konto - bitte anmelden";
    }
    if (k.includes("invalid login")) return "E-Mail oder Passwort stimmt nicht";
    if (k.includes("password should be") || k.includes("weak password")) {
      return "Passwort zu kurz - mindestens 6 Zeichen";
    }
    if (k.includes("unable to validate email") || k.includes("invalid email")) {
      return "Die E-Mail sieht nicht wie eine Adresse aus";
    }
    if (k.includes("email not confirmed")) {
      return "Konto noch nicht bestaetigt - Mail oeffnen";
    }
    if (k.includes("duplicate key")) {
      return "Diesen Namen gibt es schon - such dir einen anderen";
    }
    if (k.includes("for security purposes") || k.includes("rate limit")) {
      return "Zu viele Versuche - eine Minute warten";
    }
    if (k.includes("row-level")) {
      return "Die Datenbank verweigert das - SQL aus der Anleitung fehlt";
    }
    if (k.includes("failed to fetch") || k.includes("networkerror")) {
      return "keine Verbindung";
    }
    return t;
  }

  meldeLauf() {
    if (!this.wolke || !this.wolke.angemeldet) return;
    if (Math.floor(this.score) < K.MELDE_AB) return;
    this.wolke.punkteMelden(this.difficulty, Math.floor(this.score),
                            Math.max(5, Math.round(this.frame / K.FPS)));
    this.wolke.standHoch(this.standAlsJson());
  }

  wolkeAntworten() {
    if (!this.wolke) return;
    for (const [art, geklappt, daten] of this.wolke.hole()) {
      if (!geklappt) {
        this.melde(this.klartext(daten));
        this.listeWartet = false;
        if (art === "bestenliste") this.listeFehler = this.wolkeText;
        continue;
      }
      if (art === "bestenliste") {
        this.liste[daten.modus] = daten.zeilen;
        this.listeFehler = "";
        this.listeWartet = false;
      } else if (art === "platz") {
        this.listePlatz[daten.modus] = daten.platz;
      } else if (art === "anmelden" || art === "registrieren") {
        if (daten && daten.bestaetigen) {
          this.melde("Bitte erst die Bestaetigungsmail oeffnen");
          continue;
        }
        this.kontoUebernehmen();
        if (daten && daten.fehler) {        // Konto steht, nur der Name nicht
          this.melde(this.klartext(daten.fehler));
        }
      } else if (art === "name") {
        this.melde(`Name gespeichert: ${daten.name}`);
        this.liste = {}; this.listePlatz = {};
      } else if (art === "stand_runter") {
        if (daten.stand && this.standUebernehmen(daten.stand)) {
          this.melde("Spielstand zusammengefuehrt");
        }
        // Das Ergebnis gleich wieder hoch - so hat die Wolke immer den
        // vollstaendigen Stand, auch beim ersten Anmelden.
        this.wolke.standHoch(this.standAlsJson());
      } else if (art === "punkte") {
        this.melde(`${daten.punkte} Punkte gemeldet`);
        delete this.liste[this.difficulty];
        if (this.mode === "liste") this.listeHolen();
      }
    }
    // Angemeldet, aber ohne Namen: dann steht man in keiner Bestenliste.
    // Das kommt vor, wenn beim Anlegen der Name schon vergeben war.
    if (this.wolke.angemeldet && !this.wolke.name && !this.nameGefragt
        && !document.getElementById("konto")) {
      this.nameGefragt = true;
      this.namenFenster();
    }
  }

  // Nach dem Anmelden: erst den Stand dieses Kontos aus dem Browser
  // dazunehmen, dann den aus der Wolke. Genommen wird immer das Mehr - was
  // ohne Konto erspielt wurde, geht also nicht verloren.
  kontoUebernehmen() {
    this.melde(`Angemeldet als ${this.wolke.name}`);
    this.sound("buy");
    try {
      const eigen = JSON.parse(localStorage.getItem(this.saveKey()) || "null");
      if (eigen) this.standUebernehmen(eigen);
    } catch (e) {}
    this.save();
    this.wolke.standRunter();
    this.liste = {}; this.listePlatz = {}; this.listeWartet = false;
    if (this.mode === "liste") this.listeHolen();
  }

  get skin() { return SKIN_BY_KEY[this.skinKey]; }
  // Bestleistung immer die des gewaehlten Modus
  get highscore() { return this.highscores[this.difficulty] | 0; }
  set highscore(v) { this.highscores[this.difficulty] = Math.round(v); }

  // ---- Sterne und Wirkwerte

  stars(key) {
    const have = this.copies[key] || 0;
    let n = 0;
    while (n < K.MAX_STARS && have >= starTotal(n + 1)) n++;
    return n;
  }
  starProgress(key) {
    const st = this.stars(key);
    if (st >= K.MAX_STARS) return null;
    return [(this.copies[key] || 0) - starTotal(st), starCost(st + 1)];
  }
  isMaxed(key) { return (this.copies[key] || 0) >= K.MAX_COPIES; }
  effectiveStats(key) {
    const bonus = this.stars(key) * K.STAR_BONUS;
    return SKIN_BY_KEY[key].stats.map(b => (b > 0 ? b + bonus : 0));
  }
  get perk() { return K.PERKS[this.skinKey] ? this.skinKey : null; }

  applyStats() {
    const [sp, ag, iv, ib] = this.effectiveStats(this.skinKey);
    const P = K.STAT_PER_POINT;
    this.jumpV = K.JUMP_V * (1 + P[0] * sp);
    this.springV = K.SPRING_V * (1 + P[0] * sp * 0.5);
    this.accel = K.MOVE_ACCEL * (1 + P[1] * ag);
    this.maxSpeed = K.MAX_SPEED_X * (1 + P[1] * ag);
    this.springChance = K.SPRING_CHANCE * (1 + P[2] * iv);
    this.itemRate = 1 + P[2] * iv;
    this.rocketTotal = K.ROCKET_DISTANCE * (1 + P[3] * ib);
    this.holeTotal = K.HOLE_DISTANCE * (1 + P[3] * ib);
    this.itemBoost = 1 + P[3] * ib;
    this.springBoost = 1 + K.SPRING_BOOST_PER_POINT * ib;

    // Grundwerte, danach die Eigenart des angelegten Rekord-Skins
    this.shieldFrames = K.SHIELD_FRAMES;
    this.shootCd = K.SHOOT_COOLDOWN;
    this.startShield = 0;
    const perk = this.perk;
    if (perk === "nebelwandler") {
      this.shieldFrames = Math.round(this.shieldFrames
                                     * (1 + K.PERK_SHIELD_MORE));
    } else if (perk === "sternenkind") {
      this.startShield = Math.round(K.PERK_START_SHIELD * K.FPS);
    } else if (perk === "singularitaet") {
      this.holeTotal *= 1 + K.PERK_HOLE_MORE;
    }
    this.pierce = perk === "supernova";
    this.hasRevive = perk === "urknall";
  }

  // ---- Tagesaufgaben
  static heute() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`
         + `-${String(d.getDate()).padStart(2, "0")}`;
  }

  // Vier Aufgaben je Tag, gezogen aus dem Vorrat. Dieselbe Auswahl wie in
  // der Rechnerfassung: sie haengt nur am Datum.
  static questsOfDay(tag) {
    let h = 0;                                   // einfacher Streuwert
    const text = "quests-" + tag;
    for (let i = 0; i < text.length; i++) {
      h = (h * 31 + text.charCodeAt(i)) >>> 0;
    }
    const vorrat = K.QUEST_POOL.map(q => q[0]);
    const gezogen = [];
    for (let i = 0; i < K.QUESTS_PER_DAY; i++) {
      h = (h * 1103515245 + 12345) >>> 0;
      gezogen.push(vorrat.splice(h % vorrat.length, 1)[0]);
    }
    return gezogen;
  }

  questDefs() {
    return this.questKeys.map(k => [k, K.QUEST_BY_KEY[k][1],
                                    K.QUEST_BY_KEY[k][2]]);
  }

  newDay() {
    const today = Game.heute();
    if (this.questDay === today) {
      if (!this.questKeys.length) {               // alter Stand ohne Auswahl
        this.questKeys = Game.questsOfDay(today);
        const alt = this.quests;
        this.quests = {};
        for (const k of this.questKeys) this.quests[k] = alt[k] | 0;
      }
      return;
    }
    this.questDay = today;
    this.questKeys = Game.questsOfDay(today);
    this.quests = {};
    for (const k of this.questKeys) this.quests[k] = 0;
    this.questClaimed = false;
    this.questNote = false;
    this.loginStreak(today);
    this.loginNote = 200;
    this.save();
  }

  // Sieben Tage am Stueck bringen immer mehr - abgeholt wird von Hand
  loginStreak(today) {
    const gestern = new Date(new Date(today).getTime() - 86400000);
    const gs = `${gestern.getFullYear()}-`
             + `${String(gestern.getMonth() + 1).padStart(2, "0")}-`
             + `${String(gestern.getDate()).padStart(2, "0")}`;
    if (this.streakDay === gs && this.streak < K.LOGIN_STREAK.length) {
      this.streak++;
    } else {
      this.streak = 1;
    }
    if (this.streak > K.LOGIN_STREAK.length) this.streak = 1;
    this.streakDay = today;
    this.streakClaimed = false;
    this.loginText = `Tag ${this.streak} der Serie liegt bereit   -   `
                   + "in den Aufgaben abholen";
  }

  streakReward(tag) {
    const [muenzen, tickets, skin] = K.LOGIN_STREAK[tag - 1];
    const teile = [];
    if (tickets) teile.push(`${tickets} Flammenticket`);
    if (muenzen) teile.push(`${muenzen} Muenzen`);
    if (skin) teile.push("1 epischer Skin");
    return teile.join("  +  ");
  }

  get loginReady() { return this.streak > 0 && !this.streakClaimed; }

  collectLogin() {
    if (!this.loginReady) return false;
    const [muenzen, tickets, skin] = K.LOGIN_STREAK[this.streak - 1];
    this.coins += muenzen;
    this.tickets += tickets;
    if (skin) this.pendingSkin = skin;
    this.streakClaimed = true;
    this.loginNote = 0;
    this.toast = [`TAG ${this.streak} EINGESAMMELT`,
                  this.streakReward(this.streak), K.C_TICKET, 170];
    this.winGlow = 26;
    this.sound("buy");
    this.save();
    return true;
  }

  bumpQuest(key, amount = 1) {
    if (!(key in this.quests)) return;
    const [, , goal, absolut] = K.QUEST_BY_KEY[key];
    const old = this.quests[key] | 0;
    const val = absolut ? Math.max(old, amount) : old + amount;
    this.quests[key] = Math.min(goal, val);
    if (this.quests[key] !== old) this.checkQuestReward();
  }

  questsDone() {
    return this.questKeys.length > 0
      && this.questKeys.every(k => (this.quests[k] | 0) >= K.QUEST_BY_KEY[k][2]);
  }

  get questReady() { return this.questsDone() && !this.questClaimed; }

  checkQuestReward() {
    if (this.questNote || this.questClaimed || !this.questsDone()) return;
    this.questNote = true;
    this.toast = ["ALLE TAGESAUFGABEN GESCHAFFT",
                  "Praemie liegt bereit - in den Aufgaben abholen",
                  K.C_TICKET, 200];
    this.save();
  }

  collectQuests() {
    if (!this.questReady) return false;
    this.questClaimed = true;
    this.tickets += K.QUEST_TICKETS;
    this.coins += K.QUEST_COINS;
    this.toast = ["PRAEMIE EINGESAMMELT",
                  `+${K.QUEST_TICKETS} Flammenticket und ${K.QUEST_COINS} Muenzen`,
                  K.C_TICKET, 170];
    this.winGlow = 26;
    this.sound("buy");
    this.save();
    return true;
  }

  collectAll() {
    const a = this.collectLogin(), b = this.collectQuests();
    if (!a && !b) this.sound("deny");
    return a || b;
  }

  // ---- Slotmaschine
  slotSpin() {
    if (this.slotState === "spinning" || this.pop) return;
    if (this.tickets < K.SLOT_COST) { this.sound("deny"); return; }
    this.tickets -= K.SLOT_COST;
    this.slotSpins++;
    this.slotResult = null;
    let r = Math.random(), acc = 0, kind = K.SLOT_ODDS[K.SLOT_ODDS.length - 1][0];
    for (const [k, w] of K.SLOT_ODDS) { acc += w; if (r < acc) { kind = k; break; } }
    this.slotKind = kind;
    this.slotState = "spinning";
    this.slotT = 0;
    this.save();
  }
  slotPayout() {
    const col = K.RARITY[this.slotKind][1];
    this.slotResult = this.awardSkin(this.slotKind, col);
    this.winGlow = 34;
    this.popWin(this.slotResult, col);
    this.save();
  }

  // ---- Spezialfaehigkeit
  get ability() { return K.ABILITIES[this.skinKey] || null; }
  get abilityActive() { return this.abilityLeft > 0; }
  get abilityReady() { return this.ability !== null && this.charge >= K.ABILITY_CHARGE; }
  useAbility() {
    if (!this.abilityReady || this.riding || this.holeSuck > 0) return;
    if (this.mode !== "play" || this.paused || this.gameOver) return;
    this.charge = 0;
    this.abilityLeft = K.ABILITY_DIST;
    this.abilityFlash = 60;
    this.vy = -Math.min(this.ability.speed, K.ABILITY_DIST);
    const cx = this.px + K.PLAYER_W / 2, cy = this.py + K.PLAYER_H / 2;
    const col = this.ability.col;
    this.burst(cx, cy, col, 34);
    [[170, col, 7], [290, "#ffffff", 6], [420, col, 5]]
      .forEach(([r, c2, w]) => this.rings.push(new Ring(cx, cy, r, c2, w)));
    this.flash = 9;
  }
  endAbility() {
    this.abilityLeft = 0; this.vy = -6;
    const cx = this.px + K.PLAYER_W / 2, cy = this.py + K.PLAYER_H / 2;
    this.burst(cx, cy, this.ability.col, 26);
    this.rings.push(new Ring(cx, cy, 240, "#ffffff", 6));
  }
  abilityTrail() {
    const cx = this.px + K.PLAYER_W / 2, cy = this.py + K.PLAYER_H;
    if (this.skinKey === "prisma") {
      for (let i = 0; i < 8; i++) {
        this.particles.push([cx + rnd(16, -16), cy, rnd(2, -2), rnd(8, 2.5),
                             rndInt(12, 30), hsvHex(Math.random(), 0.85, 1)]);
      }
    } else {
      for (let i = 0; i < 7; i++) {
        this.particles.push([cx + rnd(20, -20), cy, rnd(2.6, -2.6), rnd(6.5, 2),
                             rndInt(14, 32),
                             choice(["#ffffff", "#9fd8ff", "#c9b8ff", "#ff8ad8"])]);
      }
    }
    if (this.frame % 6 === 0) {
      this.rings.push(new Ring(cx, cy - 8, 120, this.ability.col, 4));
    }
  }

  get rocketActive() { return this.rocketLeft > 0; }
  get holeActive() { return this.holeLeft > 0; }
  get holeStreak() { return this.holeLeft > 0 && this.holeSuck <= 0; }
  get riding() {
    return this.rocketLeft > 0 || this.holeLeft > 0 || this.abilityLeft > 0;
  }

  // ---- Neustart

  reset() {
    this.platforms = []; this.items = []; this.monsters = [];
    this.bullets = []; this.particles = []; this.rings = []; this.speedlines = [];
    this.initBackground();

    this.frame = 0; this.score = 0; this.bonus = 0;
    this.heightClimbed = 0; this.progress = 0;
    this.gameOver = false; this.paused = false;
    this.shootTimer = 0; this.shootAnim = 0; this.squash = 0;
    this.gapSinceSolid = 0;
    this.shield = 0; this.holeLeft = 0; this.holeSuck = 0; this.invuln = 0;
    this.abilityLeft = 0; this.abilityFx = 0; this.abilityFlash = 0;
    this.holeFx = 0; this.holeScale = 1; this.itemFlash = null;
    this.rocketLeft = 0; this.rocketV = 0; this.rocketFx = 0;
    this.rocketFlash = 0; this.flash = 0; this.earned = 0; this.toast = null;

    // Punktefaktor, Meilensteine, Rekordmarke, Komet, Rettung
    this.mult = 1; this.kills = 0; this.multFlash = 0;
    this.nextMilestone = K.MILESTONE_STEP; this.milestoneNote = 0;
    this.milestoneVal = 0;
    this.recordHit = false; this.recordFlash = 0; this.recordNear = 0;
    this.comet = null; this.cometDue = rnd(K.COMET_GAP[1], K.COMET_GAP[0]);
    this.lastScore = 0; this.runComets = 0;
    this.revived = false;
    this.xpStart = this.xp; this.xpGain = 0; this.ranksUp = []; this.overT = 0;
    this.runShot = 0; this.runStomp = 0; this.runItems = 0; this.runSprings = 0;

    const start = new Platform(K.WIDTH / 2 - K.PLAT_W / 2, K.HEIGHT - 90, "normal");
    start.spring = false;
    this.platforms.push(start);
    this.topY = start.y;
    this.itemDue = {}; this.itemPending = {};
    for (const k of Object.keys(K.ITEM_INTERVALS)) {
      this.itemDue[k] = 0; this.itemPending[k] = 0;
    }
    this.monsterDue = rnd(K.MONSTER_GAP[1], K.MONSTER_GAP[0]);
    this.monsterPending = false;
    while (this.topY > -K.HEIGHT) this.addNextPlatform();
    for (const k of Object.keys(K.ITEM_INTERVALS)) {
      this.itemDue[k] = this.rollDue(k); this.itemPending[k] = 0;
    }
    this.monsterDue = rnd(K.MONSTER_GAP[1], K.MONSTER_GAP[0]);
    this.monsterPending = false;

    this.runActive = true;
    this.px = K.WIDTH / 2 - K.PLAYER_W / 2;
    this.py = start.y - K.PLAYER_H;
    this.vx = 0; this.vy = this.jumpV; this.facing = 1;
    this.shield = this.startShield | 0;       // Sternenkind startet geschuetzt
  }

  // ---- Plattform-Erzeugung mit garantierter Erreichbarkeit

  nextGap() {
    const gap = rndInt(K.MIN_GAP, K.MAX_GAP) + Math.floor(Math.min(this.progress / 900, 14));
    const room = K.SAFE_JUMP - this.gapSinceSolid;
    return clamp(gap, 26, Math.max(26, room));
  }
  makePlatform(y, forceSolid) {
    if (this.difficulty === "hard") {        // nur weisse UFOs, Federn erlaubt
      return new Platform(rnd(K.WIDTH - K.PLAT_W), y, "vanish",
                          this.springChance, true);
    }
    const diff = Math.min(this.progress / 6000, 1);
    const wMove = 0.10 + 0.18 * diff;
    const wBreak = forceSolid ? 0 : 0.07 + 0.11 * diff;
    const wVanish = 0.05 + 0.07 * diff;
    const wNormal = Math.max(0.05, 1 - wMove - wBreak - wVanish);
    let r = Math.random() * (wNormal + wMove + wBreak + wVanish);
    let kind;
    if ((r -= wNormal) < 0) kind = "normal";
    else if ((r -= wMove) < 0) kind = "moving";
    else if ((r -= wBreak) < 0) kind = "breakable";
    else kind = "vanish";
    return new Platform(rnd(K.WIDTH - K.PLAT_W), y, kind, this.springChance);
  }
  rollDue(kind) {
    // Exponentialverteilt, im Mittel ITEM_INTERVALS[kind] Punkte
    return -Math.log(1 - Math.random()) * K.ITEM_INTERVALS[kind] / this.itemRate;
  }
  addNextPlatform() {
    const gap = this.nextGap();
    this.monsterDue -= gap;                  // Monster nach Hoehe, nicht per Wurf
    if (this.monsterDue <= 0) {
      this.monsterPending = true;
      this.monsterDue = rnd(K.MONSTER_GAP[1], K.MONSTER_GAP[0]);
    }
    for (const k of Object.keys(K.ITEM_INTERVALS)) {
      this.itemDue[k] -= gap;
      if (this.itemDue[k] <= 0) {
        this.itemPending[k] = Math.min(2, this.itemPending[k] + 1);
        this.itemDue[k] = this.rollDue(k);
      }
    }
    this.topY -= gap;
    this.gapSinceSolid += gap;
    const forceSolid = this.gapSinceSolid + K.MIN_GAP * 0.6 > K.SAFE_JUMP;
    const p = this.makePlatform(this.topY, forceSolid);
    this.platforms.push(p);
    if (p.kind !== "breakable") this.gapSinceSolid = 0;
    return p;
  }
  spawnAbove() {
    while (this.topY > -K.HEIGHT * 0.6) {
      const p = this.addNextPlatform();
      const waiting = Object.keys(this.itemPending).filter(k => this.itemPending[k]);
      if (waiting.length && !this.riding
          && (p.kind === "normal" || p.kind === "moving") && !p.spring) {
        const kind = choice(waiting.sort());
        this.itemPending[kind]--;
        this.items.push(new Item(p, kind));
      }
      if (this.monsterPending && this.progress > K.MONSTER_FROM
          && this.difficulty !== "easy") {          // Einfach: keine Monster
        this.monsterPending = false;
        const kind = (this.progress > K.THANOS_FROM
                      && Math.random() < K.THANOS_SHARE) ? "thanos" : "normal";
        this.monsters.push(this.placeMonster(p, kind));
      }
    }
  }

  // Abstand zweier Spalten - der Bildschirmrand ist durchlaessig
  static wrapDist(a, b) {
    const d = Math.abs(a - b) % K.WIDTH;
    return Math.min(d, K.WIDTH - d);
  }
  placeMonster(plat, kind) {
    // Weder direkt ueber das Deck, auf dem man landen muss, noch in die
    // Spalte, in der man gerade hochsteigt.
    const w = K.MONSTER_W * (kind === "thanos" ? K.THANOS_SCALE : 1);
    const h = K.MONSTER_H * (kind === "thanos" ? K.THANOS_SCALE : 1);
    const pcx = this.px + K.PLAYER_W / 2;
    const platCx = plat.x + K.PLAT_W / 2;
    let bestX = null, bestScore = -1;
    for (let i = 0; i < 14; i++) {
      const x = rnd(K.WIDTH - w - 8, 8);
      const cx = x + w / 2;
      const score = Math.min(1, Game.wrapDist(cx, platCx) / K.MONSTER_CLEAR_PLAT)
                  + Math.min(1, Game.wrapDist(cx, pcx) / K.MONSTER_CLEAR_PLAYER);
      if (score > bestScore) { bestScore = score; bestX = x; }
      if (score >= 1.999) break;
    }
    let y = this.topY - 70;
    for (let i = 0; i < 4; i++) {
      const klebt = this.platforms.some(q =>
        Math.abs(q.y - (y + h)) < 34
        && Game.wrapDist(q.x + K.PLAT_W / 2, bestX + w / 2) < 70);
      if (!klebt) break;
      y -= 26;
    }
    return new Monster(bestX, y, kind);
  }

  // ---- Weltall-Hintergrund

  initBackground() {
    const span = K.HEIGHT + 2 * K.BG_MARGIN;
    this.bgStars = [];
    for (let i = 0; i < 90; i++) {
      this.bgStars.push([rnd(K.WIDTH + K.BG_MARGIN, -K.BG_MARGIN),
                         rnd(K.HEIGHT + K.BG_MARGIN, -K.BG_MARGIN),
                         rnd(1.9, 0.5), rnd(1.0, 0.3), rnd(TAU),
                         choice([0.10, 0.17, 0.26, 0.36])]);
    }
    this.bgNebulae = [];
    for (let i = 0; i < 4; i++) this.bgNebulae.push(this.newNebula(rnd(K.HEIGHT, -K.BG_MARGIN)));
    this.bgPlanet = null;
    this.shooting = [];
    this.bgSpan = span;
  }
  newNebula(y) {
    return [rnd(K.WIDTH), y, rnd(165, 80), choice(K.NEBULA_COLORS), rnd(0.12, 0.05)];
  }
  newPlanet() {
    const [col, shade] = choice(K.PLANET_COLORS);
    const r = rnd(58, 26);
    return [rnd(K.WIDTH - r, r), -K.BG_MARGIN - r * 2.2, r, col, shade,
            Math.random() < 0.45, rnd(0.22, 0.14)];
  }
  scrollBackground(dy) {
    const span = this.bgSpan;
    for (const st of this.bgStars) {
      st[1] += dy * st[5];
      if (st[1] > K.HEIGHT + K.BG_MARGIN) {
        st[1] -= span; st[0] = rnd(K.WIDTH + K.BG_MARGIN, -K.BG_MARGIN);
      }
    }
    for (let i = 0; i < this.bgNebulae.length; i++) {
      const n = this.bgNebulae[i];
      n[1] += dy * n[4];
      if (n[1] - n[2] > K.HEIGHT + K.BG_MARGIN) {
        this.bgNebulae[i] = this.newNebula(-K.BG_MARGIN - n[2]);
      }
    }
    if (this.bgPlanet) {
      this.bgPlanet[1] += dy * this.bgPlanet[6];
      if (this.bgPlanet[1] - this.bgPlanet[2] * 2 > K.HEIGHT + K.BG_MARGIN) this.bgPlanet = null;
    } else if (Math.random() < Math.min(0.02, dy * 0.0012)) {
      this.bgPlanet = this.newPlanet();
    }
  }
  updateShootingStars() {
    if (this.shooting.length < 2 && Math.random() < 0.005) {
      const side = choice([-1, 1]);
      this.shooting.push([rnd(K.WIDTH) - side * 60, rnd(K.HEIGHT * 0.6, -20),
                          side * rnd(11, 7), rnd(5, 2.2), 46]);
    }
    for (const sh of this.shooting) { sh[0] += sh[2]; sh[1] += sh[3]; sh[4]--; }
    this.shooting = this.shooting.filter(sh =>
      sh[4] > 0 && sh[0] > -120 && sh[0] < K.WIDTH + 120 && sh[1] < K.HEIGHT + 40);
  }
  skyColors() {
    const t = this.heightClimbed / K.PALETTE_SPAN;
    const n = K.SPACE_PALETTES.length;
    const i = ((Math.floor(t) % n) + n) % n, j = (i + 1) % n;
    let f = t - Math.floor(t);
    f = f * f * (3 - 2 * f);
    let top = mix(K.SPACE_PALETTES[i][0], K.SPACE_PALETTES[j][0], f);
    let bot = mix(K.SPACE_PALETTES[i][1], K.SPACE_PALETTES[j][1], f);
    if (this.rocketFx > 0.01) {
      top = mix(top, K.C_ROCKET_SKY_TOP, this.rocketFx);
      bot = mix(bot, K.C_ROCKET_SKY_BOT, this.rocketFx);
    }
    if (this.abilityFx > 0.01 && this.ability !== null) {
      const col = this.ability.col;
      top = mix(top, mix(col, "#000000", 0.55), 0.45 * this.abilityFx);
      bot = mix(bot, col, 0.30 * this.abilityFx);
    }
    if (this.holeFx > 0.01) {
      top = mix(top, "#000000", 0.85 * this.holeFx);
      bot = mix(bot, "#170a22", 0.85 * this.holeFx);
    }
    return [top, bot];
  }
  updateStarfield() {
    if (this.rocketFx > 0.05 || this.holeStreak) {
      for (let i = 0; i < 3; i++) {
        this.speedlines.push([rnd(K.WIDTH + 10, -10), -40, rnd(70, 18), rnd(46, 22)]);
      }
    }
    const push = Math.max(this.rocketFx, this.holeStreak ? 1.6 : 0);
    for (const ln of this.speedlines) ln[1] += ln[3] * (0.4 + push);
    this.speedlines = this.speedlines.filter(ln => ln[1] < K.HEIGHT + 60);
  }

  // ------------------------------------------------------------- Logik

  step() {
    // Antworten aus der Wolke kommen auch mitten im Spiel an
    this.wolkeAntworten();
    if (this.mode === "play" && this.gameOver) this.overT++;
    if (this.mode !== "play") this.updateMenu();
    else if (!this.paused && !this.gameOver) this.update();
  }

  steerTo(targetX) {
    let d = targetX - (this.px + K.PLAYER_W / 2);
    if (d > K.WIDTH / 2) d -= K.WIDTH;
    else if (d < -K.WIDTH / 2) d += K.WIDTH;
    let want = clamp(d * 0.40, -this.maxSpeed, this.maxSpeed);
    if (Math.abs(d) < 2) want = 0;
    const stepv = this.accel * (this.rocketActive ? 0.9 : 1.7);
    this.vx += clamp(want - this.vx, -stepv, stepv);
    if (Math.abs(this.vx) > 0.4) this.facing = this.vx > 0 ? 1 : -1;
  }

  update() {
    this.frame++;
    for (const a of ["milestoneNote", "recordFlash", "multFlash",
                     "shootTimer", "shootAnim", "rocketFlash", "squash",
                     "flash", "shield", "holeSuck", "invuln",
                     "abilityFlash"]) {
      if (this[a] > 0) this[a]--;
    }
    if (this.ability !== null && !this.abilityActive) {
      this.charge = Math.min(K.ABILITY_CHARGE, this.charge + 1);
    }
    this.abilityFx += clamp((this.abilityActive ? 1 : 0) - this.abilityFx, -0.08, 0.12);
    this.rocketFx += clamp((this.rocketActive ? 1 : 0) - this.rocketFx, -0.045, 0.09);
    const htar = (this.holeActive || this.holeSuck > 0) ? 1 : 0;
    this.holeFx += clamp(htar - this.holeFx, -1 / K.HOLE_OUT, 0.16);
    const span = 1 - K.HOLE_MIN_SCALE;
    if (this.holeSuck > 0) this.holeScale = K.HOLE_MIN_SCALE + span * (this.holeSuck / K.HOLE_SUCK);
    else if (this.holeActive) this.holeScale = K.HOLE_MIN_SCALE;
    else if (this.holeScale < 1) this.holeScale = Math.min(1, this.holeScale + span / K.HOLE_OUT);
    if (this.itemFlash) {
      this.itemFlash[0]--;
      if (this.itemFlash[0] <= 0) this.itemFlash = null;
    }
    if (this.shield === 1) {
      this.burst(this.px + K.PLAYER_W / 2, this.py + K.PLAYER_H / 2, K.C_SHIELD, 18);
    }

    // --- seitwaerts
    const accel = this.accel * (this.rocketActive ? 0.55 : 1);
    if (this.pointerCtrl && this.pointerX !== null && !(this.left || this.right)) {
      this.steerTo(this.pointerX);
    } else if (this.tiltOn && Math.abs(this.tilt) > 0.04 && !(this.left || this.right)) {
      this.vx += accel * clamp(this.tilt * 1.8, -1.6, 1.6);
      if (Math.abs(this.vx) > 0.4) this.facing = this.vx > 0 ? 1 : -1;
    } else if (this.left && !this.right) { this.vx -= accel; this.facing = -1; }
    else if (this.right && !this.left) { this.vx += accel; this.facing = 1; }
    else {
      this.vx *= K.MOVE_FRICTION;
      if (Math.abs(this.vx) < 0.05) this.vx = 0;
    }
    this.vx = clamp(this.vx, -this.maxSpeed, this.maxSpeed);
    this.px += this.vx;
    if (this.px + K.PLAYER_W < 0) this.px = K.WIDTH;
    else if (this.px > K.WIDTH) this.px = -K.PLAYER_W;

    // --- hoch und runter
    if (this.abilityActive) {
      this.vy = -Math.min(this.ability.speed, this.abilityLeft);
      this.abilityTrail();
    } else if (this.holeSuck > 0) { this.vy = 0; this.holeSwirl(); }
    else if (this.holeActive) {
      this.vy = -Math.min(K.HOLE_SPEED, this.holeLeft); this.holeSwirl();
    } else if (this.rocketActive) {
      this.rocketV = Math.min(K.ROCKET_SPEED, this.rocketV + K.ROCKET_ACCEL);
      this.vy = -Math.min(this.rocketV, this.rocketLeft);
      this.rocketTrail();
    } else {
      this.vy = Math.min(this.vy + K.GRAVITY, K.MAX_FALL);
    }
    this.py += this.vy;

    for (const p of this.platforms) p.update();
    for (const it of this.items) it.update();

    // --- Landung
    if (this.vy > 0 && !this.riding && this.holeSuck <= 0) {
      const feetPrev = this.py + K.PLAYER_H - this.vy;
      const feetNow = this.py + K.PLAYER_H;
      for (const p of this.platforms) {
        if (p.broken || p.used) continue;
        if (!(this.px + K.PLAYER_W - 8 > p.x && this.px + 8 < p.x + K.PLAT_W)) continue;
        if (feetPrev <= p.y + 2 && p.y + 2 <= feetNow + 2) { this.landOn(p); break; }
      }
    }

    // --- Items einsammeln
    for (const it of this.items) {
      if (!it.alive || !this.overlaps(it.x, it.y, it.w, it.h, 6)) continue;
      if (it.kind !== "shield" && this.riding) continue;
      it.taken = true;
      this.pickUp(it);
    }

    for (const b of this.bullets) b.update();
    this.bullets = this.bullets.filter(b => b.y > -20);
    for (const m of this.monsters) m.update();

    for (const b of [...this.bullets]) {
      for (const m of this.monsters) {
        if (!m.dead && m.x < b.x && b.x < m.x + m.w && m.y < b.y && b.y < m.y + m.h) {
          m.dead = true;
          this.addBonus(300 * m.worth, true);
          this.runShot++;
          this.sound("hit");
          this.bumpQuest("shoot");
          this.burst(m.cx, m.cy, "#ff9f43");
          const i = this.bullets.indexOf(b);
          if (i >= 0) this.bullets.splice(i, 1);
          break;
        }
      }
    }

    const pcx = this.px + K.PLAYER_W / 2, pcy = this.py + K.PLAYER_H / 2;
    for (const m of this.monsters) {
      if (m.dead) continue;
      if (this.holeActive || this.holeSuck > 0) {
        const d = Math.hypot(m.cx - pcx, m.cy - pcy);
        if (d < K.HOLE_PULL_R) {
          m.x += (pcx - m.cx) * K.HOLE_PULL;
          m.y += (pcy - m.cy) * K.HOLE_PULL;
          if (d < K.HOLE_EAT_R) {
            m.dead = true; this.addBonus(100 * m.worth, true);
            this.burst(m.cx, m.cy, K.C_HOLE_RIM, 14);
          }
        }
        continue;
      }
      if (this.rocketActive || this.abilityActive) {
        if (Math.hypot(m.cx - pcx, m.cy - pcy) < K.ROCKET_BLAST_R) {
          m.dead = true; this.addBonus(100 * m.worth, true);
          this.burst(m.cx, m.cy, K.C_ASTRAL, 18);
          this.rings.push(new Ring(m.cx, m.cy, 70, K.C_ASTRAL_L, 4));
        }
        continue;
      }
      if (!this.overlaps(m.x, m.y, m.w, m.h, -10)) continue;
      if (this.vy > 0 && this.py + K.PLAYER_H - this.vy <= m.y + 12) {
        m.dead = true; this.vy = K.STOMP_V; this.squash = 8;
        this.addBonus(200 * m.worth, true);
        this.runStomp++;
        this.sound("stomp"); this.burst(m.cx, m.cy, "#ff9f43");
        this.bumpQuest("stomp");
      } else if (this.invuln > 0) {
        continue;                            // stille Gnadenfrist
      } else if (this.shield > 0) {
        m.dead = true; this.addBonus(50 * m.worth, true);
        this.burst(m.cx, m.cy, K.C_SHIELD, 20);
        this.rings.push(new Ring(pcx, pcy, 120, K.C_SHIELD, 5));
      } else { this.endGame(); return; }
    }

    // --- Kamera
    if (this.py < K.SCROLL_LINE) {
      const dy = K.SCROLL_LINE - this.py;
      this.py = K.SCROLL_LINE;
      // Der Faktor wirkt auch auf die erklommene Hoehe
      this.heightClimbed += dy * this.mult;
      this.score = this.heightClimbed + this.bonus;
      this.checkUnlocks();
      this.bumpQuest("score", Math.floor(this.score));
      this.checkMilestone();
      this.checkRecord();
      if (this.rocketActive) {
        this.rocketLeft -= dy;
        if (this.rocketLeft <= 0) this.endRocket();
      } else if (this.holeActive) {
        this.holeLeft -= dy;
        if (this.holeLeft <= 0) this.endHole();
      } else if (this.abilityActive) {
        this.abilityLeft -= dy;
        if (this.abilityLeft <= 0) this.endAbility();
      } else this.progress += dy;
      for (const group of [this.platforms, this.monsters, this.bullets, this.rings]) {
        for (const o of group) o.y += dy;
      }
      for (const q of this.particles) q[1] += dy;
      this.topY += dy;
      this.scrollBackground(dy);
      this.spawnAbove();
    }

    this.platforms = this.platforms.filter(p => p.alive);
    this.items = this.items.filter(it => it.alive);
    this.monsters = this.monsters.filter(m => !m.dead && m.y < K.HEIGHT + 80);
    for (const r of this.rings) r.update();
    this.rings = this.rings.filter(r => r.alive);
    for (const q of this.particles) {
      q[0] += q[2]; q[1] += q[3]; q[3] += 0.35; q[4]--;
    }
    this.particles = this.particles.filter(q => q[4] > 0);
    this.updateComet();
    this.updateStarfield();
    this.updateShootingStars();
    if (this.toast) {
      this.toast[3]--;
      if (this.toast[3] <= 0) this.toast = null;
    }
    if (this.py > K.HEIGHT + 40) this.endGame();
  }

  overlaps(x, y, w, h, pad = 0) {
    return this.px + K.PLAYER_W - pad > x && this.px + pad < x + w
        && this.py + K.PLAYER_H - pad > y && this.py + pad < y + h;
  }
  checkUnlocks() {
    for (const sk of SKINS) {
      if (sk.unlock !== null && this.score >= sk.unlock && !this.owned.has(sk.key)) {
        this.owned.add(sk.key);
        this.toast = [`SKIN FREIGESCHALTET: ${sk.name.toUpperCase()}`,
                      `${sk.unlock} Punkte erreicht`, K.RARITY.score[1], 170];
        this.burst(this.px + K.PLAYER_W / 2, this.py + K.PLAYER_H / 2, K.RARITY.score[1], 30);
        this.rings.push(new Ring(this.px + K.PLAYER_W / 2, this.py + K.PLAYER_H / 2,
                                 260, K.RARITY.score[1], 6));
        this.save();
      }
    }
  }
  // Punkte gutschreiben - immer mit dem Faktor des Durchgangs. Ein
  // erledigtes Monster hebt ihn anschliessend um MULT_PER_KILL.
  addBonus(points, kill = false) {
    this.bonus += points * this.mult;
    this.score = this.heightClimbed + this.bonus;
    if (kill) {
      this.kills++;
      if (this.mult < K.MULT_MAX) {
        this.mult = Math.min(K.MULT_MAX, this.mult + K.MULT_PER_KILL);
        this.multFlash = Math.round(0.8 * K.FPS);
      }
    }
  }

  get record() { return this.highscore; }

  // Alle MILESTONE_STEP Punkte eine kleine Praemie
  checkMilestone() {
    while (this.score >= this.nextMilestone) {
      this.coins += K.MILESTONE_COINS;
      this.milestoneNote = Math.round(1.6 * K.FPS);
      this.milestoneVal = Math.round(this.nextMilestone);
      this.nextMilestone += K.MILESTONE_STEP;
      this.sound("coin");
    }
  }

  // Den eigenen Bestwert zu knacken ist der Moment im Spiel
  checkRecord() {
    if (this.recordHit || this.record <= 0 || this.score < this.record) return;
    this.recordHit = true;
    this.recordFlash = Math.round(2.2 * K.FPS);
    this.flash = 8;
    this.burst(this.px + K.PLAYER_W / 2, this.py + K.PLAYER_H / 2, "#ffd54a", 34);
    this.rings.push(new Ring(this.px + K.PLAYER_W / 2,
                             this.py + K.PLAYER_H / 2, 300, "#ffd54a", 6));
    this.sound("fanfare");
  }

  yOfScore(ziel) {
    return this.py + K.PLAYER_H / 2
           - (ziel - this.score) / Math.max(0.1, this.mult);
  }

  // Goldener Komet: seltener Gast, der quer durchs Bild zieht
  updateComet() {
    if (this.comet === null) {
      this.cometDue -= Math.max(0, this.score - this.lastScore);
      this.lastScore = this.score;
      if (this.cometDue <= 0 && this.progress > 3000) {
        this.cometDue = rnd(K.COMET_GAP[1], K.COMET_GAP[0]);
        const links = Math.random() < 0.5;
        this.comet = [links ? -40 : K.WIDTH + 40, rnd(K.HEIGHT * 0.55, 90),
                      K.COMET_SPEED * (links ? 1 : -1), rnd(0.9, -0.5),
                      Math.round(9 * K.FPS)];
      }
      return;
    }
    this.comet[0] += this.comet[2];
    this.comet[1] += this.comet[3];
    this.comet[4]--;
    const [cx, cy] = this.comet;
    const getroffen = this.bullets.some(b => Math.hypot(b.x - cx, b.y - cy) < 26);
    if (getroffen || this.overlaps(cx - 16, cy - 16, 32, 32, -4)) {
      this.coins += K.COMET_COINS;
      this.runComets++;
      this.toast = ["GOLDENER KOMET", `+${K.COMET_COINS} Muenzen`, K.C_COMET, 150];
      this.burst(cx, cy, K.C_COMET, 40);
      this.rings.push(new Ring(cx, cy, 260, K.C_COMET, 6));
      this.bullets = this.bullets.filter(b => Math.hypot(b.x - cx, b.y - cy) >= 26);
      this.sound("fanfare");
      this.comet = null;
      return;
    }
    if (this.comet[4] <= 0 || this.comet[0] < -80 || this.comet[0] > K.WIDTH + 80
        || this.comet[1] > K.HEIGHT + 60) {
      this.comet = null;
    }
  }

  // Erfahrung gutschreiben und Raenge vergeben
  addXp(amount) {
    this.xp += Math.max(0, Math.round(amount));
    const neu = [];
    while (this.xp >= this.rankNeed) {
      this.xp -= this.rankNeed;
      this.rank++;
      const lohn = [`+${K.RANK_COINS} Muenzen`];
      this.coins += K.RANK_COINS;
      if (this.rank % K.RANK_TICKET_EVERY === 0) {
        this.tickets++;
        lohn.push("+1 Flammenticket");
      }
      if (this.rank % K.RANK_SKIN_EVERY === 0) {
        this.pendingSkin = "rare";
        lohn.push("+1 seltener Skin");
      }
      neu.push([this.rank, lohn.join("   ")]);
    }
    return neu;
  }

  get rankNeed() { return K.RANK_BASE + K.RANK_STEP * this.rank; }

  pickUp(it) {
    this.runItems++;
    this.bumpQuest("items");
    this.sound("item");
    const cx = it.x + it.w / 2, cy = it.y + it.h / 2;
    if (it.kind === "rocket") {
      this.rocketLeft = this.rocketTotal; this.rocketV = 12;
      this.rocketFlash = 55; this.flash = 11; this.vy = -this.rocketV;
      this.burst(cx, cy, K.C_ASTRAL, 34);
      [[150, K.C_ASTRAL_L, 7], [260, K.C_ASTRAL, 6], [380, "#ffffff", 5]]
        .forEach(([r, c, w]) => this.rings.push(new Ring(cx, cy, r, c, w)));
    } else if (it.kind === "shield") {
      this.shield = Math.round(this.shieldFrames * this.itemBoost);
      this.itemFlash = [55, "SCHUTZSCHILD", K.C_SHIELD];
      this.burst(cx, cy, K.C_SHIELD, 26);
      this.rings.push(new Ring(cx, cy, 200, K.C_SHIELD, 6));
    } else {
      this.holeLeft = this.holeTotal; this.holeSuck = K.HOLE_SUCK;
      this.itemFlash = [55, "SCHWARZES LOCH", K.C_HOLE_RIM];
      this.vy = 0;
      this.burst(cx, cy, K.C_HOLE_RIM, 30);
      this.rings.push(new Ring(cx, cy, 240, K.C_HOLE_RIM, 6));
    }
  }
  endRocket() {
    this.rocketLeft = 0; this.rocketV = 0; this.vy = -6;
    const cx = this.px + K.PLAYER_W / 2, cy = this.py + K.PLAYER_H / 2;
    this.burst(cx, cy, K.C_ASTRAL, 26);
    this.rings.push(new Ring(cx, cy, 240, K.C_ASTRAL_L, 6));
  }
  endHole() {
    this.holeLeft = 0; this.vy = -7; this.squash = 7;
    // Eine halbe Sekunde unverwundbar - bewusst ohne jede Anzeige
    this.invuln = K.HOLE_GRACE;
    const cx = this.px + K.PLAYER_W / 2, cy = this.py + K.PLAYER_H / 2;
    this.burst(cx, cy, K.C_HOLE_RIM, 26);
    this.rings.push(new Ring(cx, cy, 220, K.C_HOLE_RIM, 6));
  }
  holeSwirl() {
    const cx = this.px + K.PLAYER_W / 2, cy = this.py + K.PLAYER_H / 2;
    if (this.holeStreak) {
      for (let i = 0; i < 5; i++) {
        this.particles.push([cx + rnd(5, -5), cy, rnd(1.2, -1.2), rnd(9, 3),
                             rndInt(8, 18),
                             choice([K.C_HOLE_RIM, "#ffd166", "#ffffff", K.C_ASTRAL_L])]);
      }
      return;
    }
    for (let i = 0; i < 3; i++) {
      const a = rnd(TAU), r = rnd(120, 60);
      this.particles.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r,
                           -Math.cos(a) * 2.6 - Math.sin(a) * 2.2,
                           -Math.sin(a) * 2.6 + Math.cos(a) * 2.2,
                           rndInt(10, 22),
                           choice([K.C_HOLE_RIM, "#ffd166", K.C_ASTRAL_L, "#ffffff"])]);
    }
  }
  rocketTrail() {
    const cx = this.px + K.PLAYER_W / 2, cy = this.py + K.PLAYER_H;
    for (let i = 0; i < 10; i++) {
      this.particles.push([cx + rnd(17, -17), cy, rnd(2.8, -2.8), rnd(7.5, 2),
                           rndInt(16, 38), choice(K.C_FLAME)]);
    }
    if (this.frame % 5 === 0) this.rings.push(new Ring(cx, cy - 6, 130, K.C_ASTRAL, 4));
  }
  landOn(p) {
    if (p.kind === "breakable") {
      p.broken = true;
      this.py = p.y - K.PLAYER_H;
      this.vy = this.jumpV * K.BREAK_JUMP;
      this.sound("jump");
      this.squash = 6;
      this.burst(p.x + K.PLAT_W / 2, p.y, K.C_BROWN, 14);
      return;
    }
    this.py = p.y - K.PLAYER_H;
    this.squash = 8;
    if (p.spring) {
      this.vy = this.springV * this.springBoost;
      this.runSprings++;
      this.bumpQuest("spring");
      this.sound("spring");
      this.burst(p.x + K.PLAT_W / 2, p.y, "#888888", 6);
    } else {
      this.vy = this.jumpV;
      this.sound("jump");
    }
    if (p.kind === "vanish") p.used = true;
  }
  burst(x, y, color, n = 10) {
    // Nie mehr Partikel als PARTICLE_MAX - darueber sieht man nur noch Farbe
    const frei = K.PARTICLE_MAX - this.particles.length;
    n = Math.round(Math.min(n, Math.max(0, frei)) * (0.5 + 0.5 * this.detail));
    for (let i = 0; i < n; i++) {
      this.particles.push([x, y, rnd(2.6, -2.6), rnd(-0.4, -3.4), rndInt(14, 26), color]);
    }
  }
  shoot() {
    if (this.shootTimer > 0 || this.rocketActive) return;
    this.shootTimer = this.shootCd;
    this.sound("shoot");
    this.shootAnim = K.SHOOT_ANIM;
    const { tip } = snoutPoints(1);
    this.bullets.push(new Bullet(this.px + K.PLAYER_W / 2 + tip[0] * this.facing,
                                 this.py + K.PLAYER_H + tip[1]));
  }
  endGame() {
    if (this.tryRevive()) return;            // Urknall faengt einmal auf
    this.gameOver = true;
    this.runActive = false;
    this.rocketLeft = 0; this.abilityLeft = 0; this.holeLeft = 0;
    this.earned = Math.floor(Math.floor(this.score) / K.COINS_PER_SCORE
                             * K.MODE_COINS[this.difficulty]);
    this.coins += this.earned;
    this.bestBefore = this.highscore;
    if (Math.floor(this.score) > this.highscore) {
      this.highscore = Math.floor(this.score);
    }
    this.bumpQuest("runs");
    this.bumpQuest("earn", this.earned);
    this.bumpQuest("climb", Math.floor(this.score));
    // Erfahrung gibt es fuer jeden Lauf - auch fuer einen kurzen
    this.xpGain = Math.floor(Math.floor(this.score) / K.XP_PER_SCORE)
                + K.XP_PER_KILL * (this.runShot + this.runStomp)
                + K.XP_PER_ITEM * this.runItems;
    this.ranksUp = this.addXp(this.xpGain);
    this.overT = 0;
    this.sound("over");
    this.save();
    this.meldeLauf();                        // Bestenliste, falls angemeldet
  }

  // Zweiter Urknall: einmal je Lauf faengt der Skin den Tod ab
  tryRevive() {
    if (!this.hasRevive || this.revived || this.gameOver) return false;
    this.revived = true;
    this.rocketLeft = this.holeLeft = this.abilityLeft = 0;
    this.holeSuck = 0;
    this.monsters = this.monsters.filter(m => Math.abs(m.cy - this.py) > 160);
    const p = new Platform(clamp(this.px + K.PLAYER_W / 2 - K.PLAT_W / 2,
                                 0, K.WIDTH - K.PLAT_W),
                           K.SCROLL_LINE + 120, "normal");
    p.spring = false;
    this.platforms.push(p);
    this.px = p.x + K.PLAT_W / 2 - K.PLAYER_W / 2;
    this.py = p.y - K.PLAYER_H;
    this.vx = 0; this.vy = this.jumpV;
    this.shield = Math.round(K.REVIVE_SHIELD * K.FPS);
    this.invuln = Math.round(0.6 * K.FPS);
    this.toast = ["ZWEITER URKNALL", "der Skin hat dich aufgefangen",
                  K.RARITY.score[1], 170];
    this.burst(this.px + K.PLAYER_W / 2, this.py + K.PLAYER_H / 2, "#ffffff", 40);
    this.rings.push(new Ring(this.px + K.PLAYER_W / 2, this.py + K.PLAYER_H / 2,
                             320, "#ffffff", 7));
    this.sound("revive");
    return true;
  }

  // ---- Gluecksrad

  // Nach PITY_SPINS Drehungen ohne Episches ist die naechste garantiert
  rollWheel() {
    if (this.pity >= K.PITY_SPINS) {
      return K.WHEEL.findIndex(e => e[0] === K.PITY_KIND);
    }
    let r = Math.random(), acc = 0, idx = K.WHEEL.length - 1;
    for (let i = 0; i < K.WHEEL.length; i++) {
      acc += K.WHEEL[i][1];
      if (r < acc) { idx = i; break; }
    }
    return idx;
  }

  countPity(kind) {
    if (["epic", "legendary", "mythic"].includes(kind)) this.pity = 0;
    else this.pity++;
  }

  get pityLeft() { return Math.max(0, K.PITY_SPINS - this.pity); }

  // Zehnerzug: zehn Ziehungen auf einmal, danach ein Fenster mit zehn Kaestchen
  multiSpin() {
    if (this.wheelSpinning || this.pop || this.multi.length) return;
    if (this.coins < K.MULTI_COST) { this.sound("deny"); return; }
    this.coins -= K.MULTI_COST;
    this.spins += K.MULTI_N;
    this.bumpQuest("spend", K.MULTI_COST);
    this.bumpQuest("wheel", K.MULTI_N);
    const ergebnisse = [];
    for (let i = 0; i < K.MULTI_N; i++) {
      const idx = this.rollWheel();
      const [kind, , , col] = K.WHEEL[idx];
      this.countPity(kind);
      if (kind === "coins") {
        const amount = rndInt(K.COIN_PRIZE[0], K.COIN_PRIZE[1]);
        this.coins += amount;
        ergebnisse.push(["Muenzen", `+${amount}`, col, null, 0]);
      } else {
        ergebnisse.push(this.awardSkin(kind, col));
      }
    }
    this.multi = ergebnisse;
    this.multiT = 0;
    this.wheelFrom = ((this.wheelRot % 360) + 360) % 360;
    this.wheelTo = this.wheelFrom + 360 * 3 + 40;
    this.wheelT = 0;
    this.wheelSpinning = true;
    this.wheelMulti = true;
    this.save();
  }

  multiShow() {
    this.wheelMulti = false;
    this.multiT = 1;
    const beste = this.multi.reduce((a, b) => {
      const rang = r => (r[3] === null ? 0
        : 1 + Object.keys(K.RARITY).indexOf(SKIN_BY_KEY[r[3]].rarity));
      return rang(b) > rang(a) ? b : a;
    });
    this.wheelResult = beste;
    this.popWin(null, beste[2]);
    this.winGlow = 34;
    this.save();
  }

  closeMulti() {
    if (this.multiT <= 0) return false;
    this.multi = []; this.multiT = 0; this.pop = null;
    this.sound("click");
    return true;
  }

  spin() {
    if (this.wheelSpinning || this.pop) return;
    if (this.coins < K.SPIN_COST) { this.sound("deny"); return; }
    this.coins -= K.SPIN_COST;
    this.spins++;
    this.bumpQuest("spend", K.SPIN_COST);
    this.bumpQuest("wheel");
    this.wheelResult = null;
    const idx = this.rollWheel();
    this.wheelIdx = idx;
    const cand = WHEEL_SLICES.filter(s => s[0] === idx);
    const [, st, w] = choice(cand);
    const u = st + w * rnd(0.78, 0.22);
    this.wheelFrom = ((this.wheelRot % 360) + 360) % 360;
    this.wheelTo = u * 360 + 360 * 7;
    while (this.wheelTo < this.wheelFrom + 360 * 5) this.wheelTo += 360;
    this.wheelT = 0;
    this.wheelSpinning = true;
    this.save();
  }
  wheelPayout() {
    const kind = K.WHEEL[this.wheelIdx][0], col = K.WHEEL[this.wheelIdx][3];
    this.countPity(kind);
    if (kind === "coins") {
      const amount = rndInt(K.COIN_PRIZE[0], K.COIN_PRIZE[1]);
      this.coins += amount;
      this.wheelResult = ["Muenzen", `+${amount}`, col, null, 0];
      this.winGlow = 34;
      this.popWin(this.wheelResult, col);
      this.save();
      return;
    }
    this.wheelResult = this.awardSkin(kind, col);
    this.winGlow = 34;
    this.popWin(this.wheelResult, col);
    this.save();
  }

  // Gewinn gross herausstellen: Karte ploppt auf, Konfetti fliegt
  popWin(result, col) {
    this.pop = [0, result, col];
    this.confetti = [];
    const cx = K.WIDTH / 2, cy = K.HEIGHT * 0.42;
    for (let i = 0; i < K.CONFETTI_N; i++) {
      const a = rnd(TAU), v = rnd(13, 4);
      this.confetti.push([
        cx + Math.cos(a) * rnd(150, 80), cy + Math.sin(a) * rnd(100, 50),
        Math.cos(a) * v, Math.sin(a) * v - rnd(6, 2),
        rnd(TAU), rnd(0.28, -0.28),
        choice(K.CONFETTI_COLS.concat([col])), rndInt(70, 130),
        rnd(8, 4), rnd(13, 7)]);
    }
    this.sound("fanfare");
  }

  closePop() {
    if (!this.pop) return false;
    this.pop = null;
    this.sound("click");
    return true;
  }
  awardSkin(kind, col) {
    const key = choice(POOLS[kind]);
    const before = this.stars(key);
    let note;
    if (!this.owned.has(key)) {
      this.owned.add(key);
      if (this.copies[key] === undefined) this.copies[key] = 0;
      note = "NEU!";
    } else if (this.isMaxed(key)) {
      // Der Skin ist fertig - die Kopie zerfaellt zu Sternenstaub
      this.dust += K.DUST_MAXED;
      note = `voll ausgebaut   +${K.DUST_MAXED} Staub`;
    } else {
      this.copies[key] = (this.copies[key] || 0) + 1;
      const now = this.stars(key);
      if (now > before) note = `EVOLVIERT   ${now} ${now === 1 ? "Stern" : "Sterne"}`;
      else {
        const [got, need] = this.starProgress(key);
        note = `Kopie   ${got}/${need} bis ${now + 1} Sterne`;
      }
    }
    if (key === this.skinKey) this.applyStats();
    return [SKIN_BY_KEY[key].name, note, col, key, this.stars(key)];
  }
  copyCost(key) {
    const sk = SKIN_BY_KEY[key];
    return sk.rarity === "score" ? null : K.DUST_COPY_COST[sk.rarity];
  }

  // Eine Kopie mit Sternenstaub kaufen - der gezielte Weg zum Ausbau
  buyCopy(key) {
    const kosten = this.copyCost(key);
    if (kosten === null || !this.owned.has(key) || this.isMaxed(key)
        || this.dust < kosten) {
      this.sound("deny");
      return false;
    }
    this.dust -= kosten;
    const vorher = this.stars(key);
    this.copies[key] = (this.copies[key] || 0) + 1;
    const jetzt = this.stars(key);
    if (key === this.skinKey) this.applyStats();
    this.winGlow = 26;
    if (jetzt > vorher) {
      this.toast = [`${SKIN_BY_KEY[key].name.toUpperCase()} EVOLVIERT`,
                    `${jetzt} ${jetzt === 1 ? "Stern" : "Sterne"}`,
                    K.RARITY[SKIN_BY_KEY[key].rarity][1], 150];
    }
    this.sound("buy");
    this.save();
    return true;
  }

  updateMenu() {
    this.frame++;
    // Bestenliste offen, aber noch nichts da? Dann jetzt holen - etwa wenn
    // man sich gerade erst angemeldet hat.
    if (this.mode === "liste" && this.wolke && this.wolke.eingerichtet
        && !this.listeFehler && this.liste[this.difficulty] === undefined) {
      this.listeHolen();
    }
    // Belohnungen aus Rang und Serie werden im Menue uebergeben, damit die
    // Karte dort aufploppen kann
    if (this.pendingSkin && !this.pop
        && (this.mode === "menu" || this.mode === "quests")) {
      const kind = this.pendingSkin;
      this.pendingSkin = null;
      const ergebnis = this.awardSkin(kind, K.RARITY[kind][1]);
      this.popWin(ergebnis, K.RARITY[kind][1]);
      this.save();
    }
    if (this.mode === "menu") { this.scrollBackground(1.4); this.updateShootingStars(); }
    if (this.winGlow > 0) this.winGlow--;
    if (this.loginNote > 0) this.loginNote--;
    if (this.wolkeNote > 0) this.wolkeNote--;
    if (this.slotState === "spinning") {
      this.slotT++;
      for (let i = 0; i < K.SLOT_REELS; i++) {
        if (this.slotT < K.SLOT_STOP[i]) {
          if (this.slotT % 3 === 0) {
            this.slotSyms[i] = Math.floor(Math.random() * K.SLOT_ODDS.length);
          }
        } else {
          this.slotSyms[i] = K.SLOT_ODDS.findIndex(o => o[0] === this.slotKind);
        }
      }
      if (this.slotT > K.SLOT_STOP[K.SLOT_REELS - 1] + 6) {
        this.slotState = "done";
        this.slotPayout();
      }
    }
    if (this.wheelSpinning) {
      this.wheelT = Math.min(1, this.wheelT + 1 / (this.wheelMulti ? 70 : 165));
      const e = 1 - Math.pow(1 - this.wheelT, 3.4);
      this.wheelRot = this.wheelFrom + (this.wheelTo - this.wheelFrom) * e;
      // Bei jedem Feld unter dem Zeiger knackt es - von allein langsamer
      const feld = Math.floor(((this.wheelRot % 360) + 360) % 360
                              / (360 / WHEEL_SLICES.length));
      if (feld !== this.wheelSlice) { this.wheelSlice = feld; this.sound("tick"); }
      if (this.wheelT >= 1) {
        this.wheelSpinning = false;
        if (this.wheelMulti) this.multiShow(); else this.wheelPayout();
      }
    }
    if (this.multiT > 0) this.multiT++;
    if (this.pop) {
      this.pop[0]++;
      if (this.pop[0] > K.POP_LIFE) this.pop = null;
    }
    for (const q of this.confetti) {
      q[0] += q[2]; q[1] += q[3];
      q[2] *= 0.985; q[3] = Math.min(6.5, q[3] + 0.22);
      q[4] += q[5]; q[7]--;
    }
    this.confetti = this.confetti.filter(q => q[7] > 0);
  }

  // ----------------------------------------------------------- Zeichnen

  draw() {
    const c = this.ctx, d = this.d;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    c.fillStyle = K.C_LETTERBOX;
    c.fillRect(0, 0, this.sw, this.sh);

    const amp = 6 * this.rocketFx * this.scale;
    const shx = amp > 0.3 ? rnd(amp, -amp) : 0;
    const shy = amp > 0.3 ? rnd(amp, -amp) : 0;
    c.save();
    c.beginPath();
    c.rect(this.ox, this.oy, K.WIDTH * this.scale, K.HEIGHT * this.scale);
    c.clip();
    c.translate(this.ox + shx, this.oy + shy);
    c.scale(this.scale, this.scale);
    if (this.mode === "menu") this.drawSpace(); else this.drawWorld();
    c.restore();
    this.drawLetterbox();

    if (this.mode !== "play") {
      // Menues sind fuer 640 Hoehe gebaut - auf hohen Schirmen mittig setzen
      c.save();
      c.translate(0, this.mo * this.scale);
      if (this.mode === "menu") { this.drawMainMenu(); this.drawWinPop(); }
      else if (this.mode === "skins") this.drawSkins();
      else if (this.mode === "quests") this.drawQuests();
      else if (this.mode === "slots") this.drawSlots();
      else if (this.mode === "liste") this.drawListe();
      else this.drawGacha();
      if (this.tipsOpen) this.drawTips();
